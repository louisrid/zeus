name: projection-run
on:
  schedule:
    - cron: "23 5 * * 3"     # Wednesday 05:23 — after the xG refresh, before the weekend
    - cron: "23 9 * * 5"     # Friday 09:23 — after the odds pull, ahead of the deadline
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek to project (blank = next unfinished)"
        required: false
      sims:
        description: "Simulations per fixture (blank = 10000)"
        required: false
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node jobs/projection_run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GW: ${{ inputs.gw }}
          SIMS: ${{ inputs.sims }}
