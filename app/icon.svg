<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- FPLBot. A pitch from above: the halfway line and centre circle in neon green on deep purple, the
       ball on the spot in neon pink. Square corners on purpose: iOS applies its own mask. No
       transparency anywhere, no text. Reads at 60px because it is three shapes. -->
  <rect width="1024" height="1024" fill="#1E0630"/>
  <rect x="0" y="0" width="1024" height="1024" fill="#2A0B3D"/>
  <rect x="0" y="0" width="1024" height="512" fill="#1E0630"/>
  <!-- goal boxes, top and bottom, thinner so they drop away at small sizes rather than clutter -->
  <path d="M232 0v150h560V0" fill="none" stroke="#00FF85" stroke-width="22" stroke-linejoin="round"/>
  <path d="M232 1024V874h560v150" fill="none" stroke="#00FF85" stroke-width="22" stroke-linejoin="round"/>
  <!-- halfway line -->
  <line x1="0" y1="512" x2="1024" y2="512" stroke="#00FF85" stroke-width="56" stroke-linecap="butt"/>
  <!-- centre circle -->
  <circle cx="512" cy="512" r="236" fill="none" stroke="#00FF85" stroke-width="56"/>
  <!-- the ball on the spot -->
  <circle cx="512" cy="512" r="72" fill="#FF00BA"/>
</svg>
