t%20x%3D%229%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%229%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2211%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%227%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%228%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%229%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%2210%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3Crect%20x%3D%229%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23000%22/%3E%3C/svg%3E"><meta name="description" content="Stakkz: a 3D city property game for 2 to 5 friends. Create a party, share the code, play in the browser."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Stakkz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a white page with a wide gutter on both sides; inside it a narrow column of controls beside a framed 3D stage (stage on top on phones).
   Two visual systems only: black-outline flat UI and voxel renders.
   Type: Coolvetica in sentence case for the logo, buttons, tabs, titles and names; Archivo Black for money and numbers; Space Grotesk for small detail text.
   Size: every length is multiplied by --k and every font size by --kf, so the whole interface scales from two numbers. */
:root{
  --ink:#000;--paper:#fff;--mist:#EEF2F8;--sun:#FFD60A;--hot:#FF4B3E;--sky:#3FA9FF;--leaf:#3DDC84;--grape:#B983FF;--pink:#FF8AD8;
  --brand:"Archivo Black","Arial Black",Impact,sans-serif;--ui:"Coolvetica","Archivo Black","Arial Black",sans-serif;--text:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --k:.58;--kf:.82;
  --bw:2px;--sb:2px;--r:calc(var(--k)*12px);--h:calc(var(--k)*38px);--fs:max(12px,calc(var(--kf)*15px));--fb:max(12px,calc(var(--kf)*17px));--fl:max(12px,calc(var(--kf)*13px));--gap:calc(var(--k)*13px);--sw:clamp(268px,21vw,300px);--ot:8px;--gut:clamp(28px,6.5vw,120px);--sr:14px;
  --sh:0 2px 0 var(--ink);--drop:3px 3px 0 var(--ink);
  color-scheme:light;
}
@media (max-width:900px),(max-height:520px){:root{--k:.74;--kf:.9;--bw:2.5px;--sb:3px;--h:34px;--ot:40px;--gut:22px;--sr:16px}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:700 var(--fs)/1.4 var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#gl,#bd{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;border-radius:calc(var(--sr) - var(--sb))}
#app{position:relative;z-index:2;height:100%;min-height:0;display:grid;gap:22px;padding-block:22px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;touch-action:none;cursor:grab;border:var(--sb) solid var(--ink);border-radius:var(--sr);overflow:hidden;box-shadow:var(--drop)}
#stage:active{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;margin:0;touch-action:manipulation}
h1,h2,h3,p,dl{margin:0}
img,svg{display:block}
h2{font:400 max(12px,calc(var(--kf)*23px))/1.15 var(--ui);letter-spacing:.01em;text-wrap:balance}
h2.c{text-align:center}
h3,.lbl{font:700 var(--fl)/1.25 var(--text)}
.fine{font-size:max(12px,calc(var(--kf)*14px));line-height:1.4}
.c{text-align:center}
:focus-visible{outline:3px solid #3D5AFE;outline-offset:2px}
@keyframes bob{50%{transform:translateY(calc(var(--k)*-4px))}}
@keyframes pop{from{transform:scale(.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{50%{background-position:100% 50%}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}25%{transform:rotate(6deg) translateY(calc(var(--k)*-5px))}50%{transform:rotate(-4deg)}75%{transform:rotate(5deg) translateY(-2px)}}

/* brand: the word in lower case with a pixel stack of cash */
.logo{display:inline-flex;align-items:center;gap:.13em;font:400 1em/1 var(--ui);letter-spacing:-.01em;white-space:nowrap}
.logo b{font-weight:400}
.mk{height:.96em;width:auto;flex:0 0 auto;margin-top:-.1em}
.logo.xl{font-size:max(12px,calc(var(--kf)*46px))}.logo.md{font-size:max(12px,calc(var(--kf)*34px))}.logo.sm{font-size:max(12px,calc(var(--kf)*24px))}
.logo.xl .mk{animation:bob 2.6s ease-in-out infinite}

/* controls */
.card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*18px);box-shadow:var(--drop)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--k)*7px);height:var(--h);padding:0 calc(var(--k)*16px);min-width:0;font:400 var(--fb)/1 var(--ui);letter-spacing:.015em;white-space:nowrap;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 calc(var(--k)*5px) 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--sun)}.btn.bad{background:var(--hot)}.btn.ok{background:var(--leaf)}.btn.blue{background:var(--sky)}
.btn.big{height:calc(var(--h) + calc(var(--k)*8px));font-size:calc(var(--fb) + 3px);width:100%}
.btn.sm{height:calc(var(--h) - calc(var(--k)*5px));padding:0 calc(var(--k)*11px);font-size:calc(var(--fb) - 2px);border-radius:calc(var(--k)*10px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{background:repeating-linear-gradient(45deg,#fff 0 calc(var(--k)*8px),var(--mist) calc(var(--k)*8px) calc(var(--k)*16px));cursor:default;transform:none;box-shadow:var(--sh)}
.ib{display:grid;place-items:center;flex:0 0 auto;width:var(--h);height:var(--h);padding:0;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.ib:hover{transform:translateY(-2px);box-shadow:0 calc(var(--k)*5px) 0 var(--ink)}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.seg{display:flex;min-width:0;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.seg button{flex:1 1 0;min-width:0;height:calc(var(--h) - calc(var(--k)*6px));padding:0 calc(var(--k)*4px);border:0;border-left:var(--bw) solid var(--ink);background:none;font:400 calc(var(--fb) - 1px)/1 var(--ui);letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--mist)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.nav button{flex:1 1 auto;height:var(--h);font-size:calc(var(--fb) - 1.5px);letter-spacing:0;padding:0 calc(var(--k)*5px)}
.seg.nav button.hot:not(.on){background:linear-gradient(120deg,#FFD9F1,#FFE14D,#8FE3FF,#C9A6FF,#FFD9F1);background-size:300% 300%;animation:hue 3s ease-in-out infinite}
.seg.dense button{font-size:calc(var(--fb) - 2px);letter-spacing:0;padding:0 2px}
.row2{display:grid;grid-template-columns:calc(var(--k)*84px) minmax(0,1fr);align-items:center;gap:calc(var(--k)*10px)}
.fld{display:grid;gap:calc(var(--k)*6px);min-width:0}
.col{display:grid;gap:calc(var(--k)*10px)}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--k)*8px)}.row > *{flex:1 1 calc(var(--k)*110px)}
input.t{height:var(--h);width:100%;min-width:0;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:0 calc(var(--k)*12px);font:400 var(--fb)/1 var(--ui);letter-spacing:.015em;background:var(--paper)}
input.t::placeholder{color:var(--ink);opacity:.55}
input.t:focus::placeholder{opacity:0}
#f-code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--k)*8px)}
.note{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:calc(var(--k)*9px) calc(var(--k)*12px);background:var(--sun);font-size:max(12px,calc(var(--kf)*14px))}
.bar{display:block;height:calc(var(--k)*9px);border:2px solid var(--ink);border-radius:calc(var(--k)*999px);overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;min-width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--leaf),var(--sky),var(--pink));background-size:300% 100%;animation:slide 2.5s linear infinite;transition:width .8s cubic-bezier(.3,1.3,.5,1);border-right:2px solid var(--ink);border-radius:calc(var(--k)*999px)}
@keyframes slide{to{background-position:-300% 0}}
.bar.load i{animation:slide 1s linear infinite,loadx 1.1s ease-in-out infinite alternate}
@keyframes loadx{from{width:8%}to{width:100%}}
.coin{display:inline-block;flex:0 0 auto;width:1em;height:1em;border-radius:50%;background:var(--sun);border:.16em solid var(--ink);vertical-align:-.14em;position:relative;animation:cspin 5s ease-in-out infinite}
.coin::after{content:"";position:absolute;inset:20%;border-radius:50%;border:.1em solid var(--ink)}
.coin.big{font-size:max(12px,calc(var(--kf)*54px));animation:cflip .9s ease-in-out infinite}
@keyframes cspin{0%,90%{transform:scaleX(1)}95%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
@keyframes cflip{50%{transform:scaleX(.15)}}
.cn{display:inline-flex;align-items:center;gap:.32em;white-space:nowrap;font-family:var(--brand);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:calc(var(--k)*5px);height:calc(var(--k)*28px);padding:0 calc(var(--k)*9px);border:2px solid var(--ink);border-radius:calc(var(--k)*999px);background:var(--mist);font:400 max(12px,calc(var(--kf)*13px))/1 var(--brand);white-space:nowrap}
button.pill{transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
button.pill:hover{transform:translateY(-2px)}
button.pill.hot{background:var(--sun);animation:nudge 2.4s ease-in-out infinite}
.ava{display:inline-block;flex:0 0 auto;width:calc(var(--k)*var(--s,38px));height:calc(var(--k)*var(--s,38px));border:2.5px solid var(--ink);border-radius:28%;background:var(--c,#fff);background:color-mix(in srgb,var(--c,#B983FF) 36%,#fff);overflow:hidden;vertical-align:middle;line-height:0}
.ava img{width:100%;height:100%}
.fig,.pim{object-fit:contain;flex:0 0 auto}
.ic{flex:0 0 auto}

/* panel: the column of controls. No box of its own; the small padding keeps shadows and focus rings from being clipped by its scroll area. */
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--gap);padding:6px;margin:-6px}
.panel > *{flex:0 0 auto;min-width:0;max-width:100%}
#app[data-screen="home"],#app[data-screen="lobby"],#app[data-screen="game"]{grid-template:"side stage" minmax(0,1fr) / var(--sw) minmax(0,1fr)}
#side,#hud{grid-area:side;overflow-x:hidden;overflow-y:auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--k)*10px)}
.hd .tools{display:flex;gap:calc(var(--k)*8px)}
.tag{font:700 var(--fl)/1.3 var(--text)}
.code{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:calc(var(--k)*8px)}
.code b{display:grid;place-items:center;height:calc(var(--k)*48px);font:400 max(12px,calc(var(--kf)*27px))/1 var(--brand);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*11px);background:var(--sun);animation:bob 2.4s ease-in-out infinite}
.code b:nth-child(2){animation-delay:.15s;background:var(--pink)}.code b:nth-child(3){animation-delay:.3s;background:var(--sky)}.code b:nth-child(4){animation-delay:.45s;background:var(--leaf)}
.code .btn{height:calc(var(--k)*48px)}
.who{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:calc(var(--k)*10px);min-height:calc(var(--k)*48px);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:3px calc(var(--k)*10px) 3px calc(var(--k)*5px);background:var(--c);font:400 max(12px,calc(var(--kf)*18px))/1.1 var(--ui);letter-spacing:.01em;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.who .ava{--s:36px}
.who > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who em{font:700 var(--fl)/1 var(--text);font-style:normal;background:var(--paper);border:2px solid var(--ink);border-radius:calc(var(--k)*7px);padding:calc(var(--k)*4px) calc(var(--k)*6px)}
.who.empty{background:none;border-style:dashed;animation:none;font:700 max(12px,calc(var(--kf)*14px))/1.2 var(--text);padding-left:calc(var(--k)*12px);min-height:calc(var(--k)*40px)}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{25%{content:"."}50%{content:".."}75%{content:"..."}}

/* character + shop */
.catbody{display:grid;gap:var(--gap);align-content:start}
.sws{display:flex;flex-wrap:wrap;gap:calc(var(--k)*10px);padding:3px}
.sws button{position:relative;display:grid;place-items:center;width:calc(var(--k)*38px);height:calc(var(--k)*38px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*11px);padding:0;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.sws button:hover{transform:translateY(-2px) rotate(-5deg)}
.sws button.on{outline:3px solid var(--ink);outline-offset:3px}
.sws button.lock::after{content:"";position:absolute;right:calc(var(--k)*-7px);bottom:calc(var(--k)*-7px);width:calc(var(--k)*16px);height:calc(var(--k)*16px);border:2px solid var(--ink);border-radius:50%;background:var(--sun)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--k)*10px)}
.opt{display:grid;grid-template-rows:calc(var(--k)*64px) auto;justify-items:center;align-items:center;gap:calc(var(--k)*4px);min-width:0;padding:calc(var(--k)*8px) calc(var(--k)*4px) calc(var(--k)*10px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*14px);background:var(--paper);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.opt small{font:400 max(12px,calc(var(--kf)*15px))/1.1 var(--ui);letter-spacing:.01em;text-align:center}
.opt:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.opt.on{background:var(--sun);box-shadow:var(--sh)}
.opt.more{background:var(--mist)}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--k)*8px);min-height:calc(var(--k)*28px)}
.shophead .cn{font-size:max(12px,calc(var(--kf)*16px))}
.loot{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px calc(var(--k)*12px);padding:calc(var(--k)*10px) calc(var(--k)*12px) calc(var(--k)*10px) calc(var(--k)*8px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*14px)}
.loot .pim{grid-row:1 / span 2}
.loot:hover .pim{animation:wig .6s ease-in-out infinite}
.loot b{font:400 max(12px,calc(var(--kf)*19px))/1.15 var(--ui);letter-spacing:.01em}
.loot .acts{display:flex;flex-wrap:wrap;gap:calc(var(--k)*8px)}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--k)*12px)}
.item{flex:0 0 calc((100% - calc(var(--k)*24px)) / 3);display:grid;justify-items:center;align-content:start;gap:calc(var(--k)*7px);min-width:0;padding:calc(var(--k)*8px) calc(var(--k)*6px) calc(var(--k)*10px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*14px);background:var(--paper);text-align:center;transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
.items.two .item{flex-basis:calc((100% - calc(var(--k)*12px)) / 2)}
.item .pic{display:grid;place-items:center;width:100%;aspect-ratio:1.15;border:2px solid var(--ink);border-radius:calc(var(--k)*9px);overflow:hidden}
.items.two .pic{aspect-ratio:1.5}
.item .pic > *{width:auto;height:84%;max-width:84%;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.item:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.item:hover .pic > *{transform:scale(1.12) rotate(-5deg)}
.item b{display:grid;place-items:center;min-height:2.3em;font:400 max(12px,calc(var(--kf)*15px))/1.15 var(--ui);letter-spacing:.01em}
.item .pill{height:calc(var(--k)*24px);font-size:max(12px,calc(var(--kf)*12px))}
.item.own .pill{background:var(--leaf);font:700 max(12px,calc(var(--kf)*12px))/1 var(--text)}
.r0{background:var(--mist)}

.mecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--k)*14px);align-items:center}

.bgsw{display:block;height:calc(var(--k)*50px);aspect-ratio:1.2;border:2px solid var(--ink);border-radius:calc(var(--k)*9px)}

.pwrap .bgsw{height:calc(var(--k)*112px)}
.pcard{position:relative;display:flex;align-items:flex-end;gap:calc(var(--k)*10px);min-height:calc(var(--k)*124px);padding:calc(var(--k)*8px) calc(var(--k)*10px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*14px);overflow:hidden}

.plate{display:grid;gap:2px;min-width:0;padding:calc(var(--k)*7px) calc(var(--k)*11px);background:var(--paper);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*11px);box-shadow:3px 3px 0 var(--ink)}

.pillrow{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--k)*8px)}
/* game */
#ghead{display:flex;align-items:center;gap:calc(var(--k)*8px)}
#ghead .logo{margin-right:auto}
.codechip{font:700 max(12px,calc(var(--kf)*13px))/1 var(--text);letter-spacing:.14em;background:var(--sun);border:2px solid var(--ink);border-radius:calc(var(--k)*8px);padding:calc(var(--k)*6px) calc(var(--k)*5px) calc(var(--k)*6px) calc(var(--k)*8px)}
#clock{min-width:calc(var(--k)*62px);text-align:center;font:400 max(12px,calc(var(--kf)*15px))/1 var(--brand);font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:calc(var(--k)*8px);padding:calc(var(--k)*6px) calc(var(--k)*7px);background:var(--paper)}
#ghead .ib{width:calc(var(--k)*32px);height:calc(var(--k)*32px);border-width:2px;border-radius:calc(var(--k)*8px);box-shadow:none}

.pp{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:calc(var(--k)*10px);row-gap:3px;align-items:center;text-align:left;min-width:0;padding:calc(var(--k)*8px) calc(var(--k)*10px) calc(var(--k)*13px) calc(var(--k)*18px);border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden;transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
.pp:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.pp::before,.mine::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--k)*8px);background:var(--c);border-right:var(--bw) solid var(--ink)}
.pp .ava{grid-row:1 / span 2;--s:38px}
.pp .nm{font:400 max(12px,calc(var(--kf)*17px))/1.15 var(--ui);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .cash{font:400 max(12px,calc(var(--kf)*16px))/1 var(--brand);font-variant-numeric:tabular-nums;text-align:right}
.pp .pips{grid-column:2;min-height:calc(var(--k)*11px)}

.pp .bar{position:absolute;left:calc(var(--k)*8px);right:0;bottom:0;height:calc(var(--k)*6px);border:0;border-top:2px solid var(--ink);border-radius:0}

.pp.out,.mine.out{background:repeating-linear-gradient(45deg,#fff 0 calc(var(--k)*9px),#FFD9D5 calc(var(--k)*9px) calc(var(--k)*18px))}
.pips{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.pips i{width:calc(var(--k)*9px);height:calc(var(--k)*11px);border:1.5px solid var(--ink);border-radius:2.5px;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.pips i.b{box-shadow:inset 0 calc(var(--k)*-4px) 0 var(--ink)}

.tm{position:absolute;left:calc(var(--k)*8px);right:0;top:0;height:calc(var(--k)*6px);border-bottom:2px solid var(--ink);background:var(--paper);overflow:hidden}
.tm i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--sun),var(--leaf));background-size:calc(var(--k)*260px) 100%;transition:width .3s linear}
#log{flex:1 1 calc(var(--k)*70px);min-height:calc(var(--k)*70px);max-width:none;display:flex;flex-direction:column;gap:calc(var(--k)*8px);padding:calc(var(--k)*10px) 0;border-block:var(--bw) solid var(--ink)}

#log li i,#ticker i{width:calc(var(--k)*10px);height:calc(var(--k)*10px);border:2px solid var(--ink);border-radius:50%;margin-top:calc(var(--k)*4px);flex:0 0 auto}
@keyframes slidein{from{transform:translateX(calc(var(--k)*12px));opacity:0}}
#ticker{display:none}
#actions{display:grid;gap:calc(var(--k)*10px);min-width:0}
.mine{position:relative;display:grid;gap:calc(var(--k)*7px);min-width:0;padding:calc(var(--k)*11px) calc(var(--k)*10px) calc(var(--k)*9px) calc(var(--k)*18px);border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.mine.on{background:var(--c)}
.mtop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:calc(var(--k)*10px);row-gap:2px;align-items:center;text-align:left;min-width:0;padding:0;border:0;background:none}

.mtop .nm{display:flex;align-items:center;gap:calc(var(--k)*6px);min-width:0;font:400 max(12px,calc(var(--kf)*19px))/1.15 var(--ui);letter-spacing:.01em;white-space:nowrap}

.mrow{display:flex;align-items:center;gap:calc(var(--k)*8px);min-height:calc(var(--k)*30px)}
.mrow .pips{flex:1}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--k)*10px) calc(var(--k)*12px);align-items:center;min-width:0}
.dicebox{display:grid;gap:calc(var(--k)*4px)}
.dice{display:flex;gap:calc(var(--k)*6px)}
.die{width:calc(var(--k)*38px);height:calc(var(--k)*38px);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*10px);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding:calc(var(--k)*4px);gap:1px}
.die span{border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .08s}
.die span.p{transform:scale(.84)}
.dice.rolling .die{animation:tumble .32s linear infinite}
.dice.rolling .die:last-child{animation-direction:reverse}
.dice.land .die{animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes tumble{25%{transform:translateY(calc(var(--k)*-9px)) rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:translateY(calc(var(--k)*-6px)) rotate(270deg)}100%{transform:rotate(360deg)}}
.pw{display:block;height:calc(var(--k)*6px);border:2px solid var(--ink);border-radius:calc(var(--k)*999px);overflow:hidden;background:var(--paper)}
.pw i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun),var(--hot))}
.say{min-width:0;font:400 max(12px,calc(var(--kf)*19px))/1.15 var(--ui);letter-spacing:.01em}

.say small:empty{display:none}
.btns{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:calc(var(--k)*8px)}
.btns .btn{flex:1 1 auto}
.btns .btn.go{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,82%,100%{transform:none}88%{transform:translateY(-3px) rotate(-1.5deg)}94%{transform:translateY(0) rotate(1.5deg)}}
#shout{position:absolute;left:50%;top:var(--ot);z-index:4;transform:translateX(-50%);pointer-events:none;max-width:96%;font:400 clamp(16px,2vw,23px)/1.05 var(--ui);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sun);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*13px);padding:calc(var(--k)*10px) calc(var(--k)*15px);box-shadow:var(--drop);animation:shout 1.9s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes shout{0%{transform:translate(-50%,calc(var(--k)*-80px)) rotate(-5deg)}14%{transform:translate(-50%,0) rotate(-1.5deg)}80%{transform:translate(-50%,0) rotate(-1.5deg);opacity:1}100%{transform:translate(-50%,calc(var(--k)*-80px));opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(calc(var(--k)*20px) + env(safe-area-inset-bottom,0px));z-index:30;transform:translateX(-50%);max-width:min(92vw,calc(var(--k)*460px));background:var(--ink);color:var(--paper);border-radius:calc(var(--k)*12px);padding:calc(var(--k)*11px) calc(var(--k)*15px);font-size:max(12px,calc(var(--kf)*14.5px));text-align:center;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.float{position:fixed;z-index:14;pointer-events:none;display:inline-flex;align-items:center;gap:calc(var(--k)*5px);font:400 max(12px,calc(var(--kf)*14px))/1 var(--brand);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*10px);padding:calc(var(--k)*5px) calc(var(--k)*8px);background:var(--leaf);box-shadow:2px 2px 0 var(--ink);animation:fl 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
.float.neg{background:var(--hot)}.float.cf{background:var(--sun)}.float.bx{background:var(--pink)}
@keyframes fl{0%{transform:translateY(calc(var(--k)*14px)) scale(.4);opacity:0}18%{transform:translateY(0) scale(1.08);opacity:1}75%{transform:translateY(calc(var(--k)*-8px));opacity:1}100%{transform:translateY(calc(var(--k)*-26px));opacity:0}}
.fly{position:fixed;left:calc(var(--k)*-9px);top:calc(var(--k)*-9px);z-index:15;font-size:max(12px,calc(var(--kf)*18px));pointer-events:none;animation:none}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translate(calc(var(--k)*-6px),3px) rotate(-.5deg)}40%{transform:translate(calc(var(--k)*5px),-3px) rotate(.5deg)}60%{transform:translate(calc(var(--k)*-4px),2px)}80%{transform:translate(3px,-2px)}}
#rush{position:absolute;inset:0;z-index:5;pointer-events:none}
.rh{position:absolute;left:50%;top:var(--ot);transform:translateX(-50%);display:grid;grid-template-columns:auto auto;gap:calc(var(--k)*6px) calc(var(--k)*16px);align-items:center;min-width:calc(var(--k)*240px);background:var(--sun);border:var(--bw) solid var(--ink);border-radius:calc(var(--k)*13px);padding:calc(var(--k)*10px) calc(var(--k)*14px);box-shadow:var(--drop);white-space:nowrap}

/* prize wheel */
.wheelwrap{position:relative;justify-self:center;width:calc(var(--k)*270px);height:calc(var(--k)*270px);margin:calc(var(--k)*16px) 0 calc(var(--k)*6px)}
.wheel{position:absolute;inset:0;border:var(--bw) solid var(--ink);border-radius:50%;box-shadow:var(--drop);transition:transform 4.2s cubic-bezier(.12,.62,.08,1)}
.wl{position:absolute;left:50%;top:50%;width:0;height:0}

@media (max-width:900px),(max-height:520px){

.calm *,.calm *::before,.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* title screen */
#title{position:fixed;inset:0;z-index:6;display:grid;place-items:center;overflow:auto;padding:24px max(22px,env(safe-area-inset-right,0px)) 24px max(22px,env(safe-area-inset-left,0px))}
#title.out{animation:tout .42s cubic-bezier(.6,0,.9,.4) forwards;pointer-events:none}
#title.in{animation:tin .42s cubic-bezier(.2,.9,.3,1)}
@keyframes tout{to{transform:translateY(-105%)}}
@keyframes tin{from{transform:translateY(-105%)}}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-8deg)}60%{transform:translateY(0) rotate(2deg)}80%{transform:translateY(-14px) rotate(-1deg)}100%{transform:none}}

.tbox{display:grid;justify-items:center;gap:clamp(14px,2.6vh,28px);width:min(580px,100%)}

.tmore{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;animation:fadeup .45s 1.3s both}

.hotb{background:linear-gradient(120deg,#FFD9F1,#FFE14D,#8FE3FF,#C9A6FF,#FFD9F1);background-size:300% 300%;animation:hue 3s ease-in-out infinite}
.tfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;animation:fadeup .45s 1.42s both;--k:.74;--kf:.92;--h:28px;--r:9px;--fb:max(12px,calc(var(--kf)*17px))}

.logob:hover{transform:rotate(-2deg) scale(1.03)}

#side.enter > *{animation:fadeup .34s cubic-bezier(.2,.9,.3,1) both}

/* big screens: menus get a wider column and larger controls than the in-game panel; the shop and Me get the most room */

.pp{flex:1 0 auto}

}

  .tgo{grid-template-columns:1fr 1fr}

    case 'view': settings.follow = settings.follow === false; applySettings(); break;
    case 'rules': rulesModal(); break;

    case 'menu': menuModal(); break;
    case 'set': settings[el.dataset.k] = el.dataset.v === '1'; applySettings(); Snd.music(!!settings.music); refreshModal(); Snd('tap'); break;
    case 'mute': { const k = el.dataset.k; settings[k] = !settings[k]; applySettings(); Snd.music(!!settings.music); Snd('tap'); document.querySelectorAll('[data-a=mute][data-k=' + k + ']').forEach(b => { b.classList.toggle('off', !settings[k]); b.setAttribute('aria-pressed', String(!!settings[k])); }); break; }
    case 'go': F.page = el.dataset.v; F.sel = null; renderHome(); hideTitle(); enter(); break;

    case 'adm': { if (!settings.admin || !adminOk()) break; const v = el.dataset.v;
      if (v === 'coins') wallet.coins += 1000000; else if (v === 'boxes') wallet.boxes += 10; else Object.keys(ITEMS).forEach(id => { if (ITEMS[id][2] > 0 && wallet.own.indexOf(id) < 0) wallet.own.push(id); });

    case 'askleave': F.leave = !!el.dataset.v; refreshModal(); break;

    case 'propose': if (await act({ t: 'propose', to: TB.to, gc: TB.gc, tc: TB.tc, gp: TB.gp, tp: TB.tp })) closeModal(); break;
