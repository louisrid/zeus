name: Fix Improve to use Build Squad logic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-improve:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Improve use the exact full auto-build path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/builder/BuilderClient.jsx")
          text = path.read_text(encoding="utf-8")

          old_import = 'import { bestXI, improveSquad } from "../../lib/solver/autobuild.mjs";'
          new_import = 'import { bestXI } from "../../lib/solver/autobuild.mjs";'
          if text.count(old_import) != 1:
              raise SystemExit("Expected the current bestXI/improveSquad import exactly once; source has drifted.")
          text = text.replace(old_import, new_import, 1)

          improve_start = text.find("  const doImprove = () => {")
          improve_end_marker = "\n\n  /* REBUILD FROM SCRATCH:"
          improve_end = text.find(improve_end_marker, improve_start)
          if improve_start < 0 or improve_end < 0:
              raise SystemExit("Could not locate the current doImprove block exactly; source has drifted.")
          text = text[:improve_start] + text[improve_end + 2:]

          rebuild_start = text.find("  /* REBUILD FROM SCRATCH:")
          rebuild_end_marker = "\n\n    const maybes = React.useMemo"
          rebuild_end = text.find(rebuild_end_marker, rebuild_start)
          if rebuild_start < 0 or rebuild_end < 0:
              raise SystemExit("Could not locate the current doRebuild block exactly; source has drifted.")

          new_rebuild = "\n".join([
              "  /* FULL AUTO-BUILD: BUILD SQUAD and IMPROVE use this exact same solver path.",
              "     Existing unlocked players are discarded; only explicit locks, ignores and a locked formation persist. */",
              "  const doRebuild = () => {",
              "    try {",
              "      if (!ctx || !pool.length) return;",
              "      const r = bestXI({ pool, xpOf: xpOverHorizon, locks, ignores, startProbOf: model.startProbOf,",
              "        onlyFormation: formationLocked ? squad.structure : null });",
              "      if (!r) { say(\"No legal squad fits those locks.\", true); return; }",
              "",
              "      snapshot();",
              "      const captain = [...r.xi].sort((a, b) => xpOverHorizon(b) - xpOverHorizon(a))[0] || null;",
              "      setSquad((sq) => ({",
              "        ...sq,",
              "        structure: r.formation,",
              "        players: [...r.xi, ...r.bench],",
              "        captain: captain ? captain.fpl_id : null,",
              "        vice: null,",
              "      }));",
              "",
              "      const verb = squad.players.length >= RULES.size ? \"Improved\" : \"Built\";",
              "      say(`${verb}: ${r.xp} xP, ${r.cost} spent, ${r.formation}.`);",
              "    } catch (e) { say(`Build failed: ${e.message}`, true); }",
              "  };",
          ])

          text = text[:rebuild_start] + new_rebuild + text[rebuild_end:]

          old_handler = "onClick={squad.players.length >= RULES.size ? doImprove : squad.players.length ? doBestXI : doRebuild}"
          new_handler = "onClick={squad.players.length > 0 && squad.players.length < RULES.size ? doBestXI : doRebuild}"
          if text.count(old_handler) != 1:
              raise SystemExit("Expected the current green-button handler exactly once; source has drifted.")
          text = text.replace(old_handler, new_handler, 1)

          required = [
              new_import,
              new_handler,
              "const doRebuild = () => {",
              "const verb = squad.players.length >= RULES.size ? \"Improved\" : \"Built\";",
              "captain: captain ? captain.fpl_id : null,",
              "vice: null,",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Required final marker missing: {marker}")
          forbidden = ["const doImprove = () => {", "improveSquad({", "bestXI, improveSquad"]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"Obsolete Improve implementation remains: {marker}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Confirm the exact behaviour is wired
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/builder/BuilderClient.jsx").read_text(encoding="utf-8")

          assert 'import { bestXI } from "../../lib/solver/autobuild.mjs";' in text
          assert "const doImprove = () => {" not in text
          assert "improveSquad({" not in text
          assert "squad.players.length > 0 && squad.players.length < RULES.size ? doBestXI : doRebuild" in text
          assert "const r = bestXI({ pool, xpOf: xpOverHorizon, locks, ignores" in text
          assert "captain: captain ? captain.fpl_id : null" in text
          assert "vice: null" in text
          print("PASS: empty and complete squads use the same doRebuild -> bestXI path; partial squads still use Fill Gaps.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile production build
        run: npm run build

      - name: Commit the fixed whole file to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/builder/BuilderClient.jsx
          if git diff --cached --quiet; then
            echo "No change was needed."
            exit 0
          fi
          git commit -m "Make Improve use the shared Build Squad solver"
          git push origin HEAD:main
