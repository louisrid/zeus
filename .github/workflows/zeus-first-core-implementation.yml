name: ZEUS first core implementation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeus-first-core-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed if the audited source has changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/builder/BuilderClient.jsx)" = "687ec94844caef148610f34a037e9b9e856b8e15"
          test "$(git hash-object app/api/optimise/route.js)" = "e90ef89fafdf24fd30fbf8a2179f1d36c77afdc1"
          test "$(git hash-object lib/solver/autobuild.mjs)" = "ca17c47063e1df72b66f72c5969e0aae32481c83"
          test "$(git hash-object tests/fixtures/v2-eight-gameweeks.mjs)" = "12759b3f8343438351e96df6a19d4c66e8bfa5bb"
          test "$(git hash-object tests/v2-ui.test.mjs)" = "d13cf77e1abd5e825b8342c0b26cce31ab985836"
          test "$(git hash-object tests/render.test.mjs)" = "acb31649ee40f3359135e0285b673c9a5403cdf9"
          test ! -e lib/optimise-request.mjs
          test ! -e lib/squad-range.mjs
          test ! -e tests/optimise-request.test.mjs
          test ! -e tests/squad-range.test.mjs
          test ! -e tests/optimise-route-contract.test.mjs
          test -f .github/workflows/zeus-first-core-implementation.yml
          git diff --exit-code

      - name: Apply audited Builder, solver and fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/zeus-apply-core-fixes.py
          python3 /tmp/zeus-apply-core-fixes.py

      - name: Write exact-range helpers, endpoint and tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > lib/optimise-request.mjs
          printf '%s' '' | base64 --decode > lib/squad-range.mjs
          printf '%s' '' | base64 --decode > app/api/optimise/route.js
          printf '%s' '' | base64 --decode > tests/optimise-request.test.mjs
          printf '%s' '' | base64 --decode > tests/squad-range.test.mjs
          printf '%s' '' | base64 --decode > tests/optimise-route-contract.test.mjs

      - name: Verify the complete intended diff
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            app/api/optimise/route.js \
            app/builder/BuilderClient.jsx \
            lib/optimise-request.mjs \
            lib/solver/autobuild.mjs \
            lib/squad-range.mjs \
            tests/fixtures/v2-eight-gameweeks.mjs \
            tests/optimise-request.test.mjs \
            tests/optimise-route-contract.test.mjs \
            tests/render.test.mjs \
            tests/squad-range.test.mjs \
            tests/v2-ui.test.mjs | sort -u)"
          actual="$(git diff --name-only | sort -u)"
          test "$actual" = "$expected"
          git diff --check
          grep -q 'import { bestXI } from "../../lib/solver/autobuild.mjs"' app/builder/BuilderClient.jsx
          ! grep -q 'improveSquad' app/builder/BuilderClient.jsx
          grep -q 'squad.players.length >= RULES.size ? doRebuild' app/builder/BuilderClient.jsx
          grep -q 'captain: captain ? captain.fpl_id : null, vice: vice ? vice.fpl_id : null' app/builder/BuilderClient.jsx
          grep -q 'gw_from' app/api/optimise/route.js
          grep -q 'source_mode: "external_xpts_lineup_gated"' app/api/optimise/route.js
          grep -q 'Chip-aware theoretical squad selection is not enabled yet' app/api/optimise/route.js
          ! grep -q 'scorer.scoreOf(player)' app/api/optimise/route.js
          node --check app/api/optimise/route.js
          node --check lib/optimise-request.mjs
          node --check lib/solver/autobuild.mjs
          node --check lib/squad-range.mjs
          node --check tests/optimise-request.test.mjs
          node --check tests/optimise-route-contract.test.mjs
          node --check tests/render.test.mjs
          node --check tests/squad-range.test.mjs
          node --check tests/v2-ui.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused core tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/v2-ui.test.mjs \
            tests/render.test.mjs \
            tests/optimise-request.test.mjs \
            tests/optimise-route-contract.test.mjs \
            tests/squad-range.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Commit the verified implementation and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zeus-first-core-implementation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/optimise/route.js \
            app/builder/BuilderClient.jsx \
            lib/optimise-request.mjs \
            lib/solver/autobuild.mjs \
            lib/squad-range.mjs \
            tests/fixtures/v2-eight-gameweeks.mjs \
            tests/optimise-request.test.mjs \
            tests/optimise-route-contract.test.mjs \
            tests/render.test.mjs \
            tests/squad-range.test.mjs \
            tests/v2-ui.test.mjs
          git commit -m "Add exact optimiser ranges and shared weekly squad evaluation"
          git push origin main
