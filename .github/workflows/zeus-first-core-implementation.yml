name: ZEUS complete rolling implementation
run-name: ZEUS complete implementation, release verification and cleanup · ${{ github.sha }}

"on":
  workflow_dispatch:
    inputs:
      production_url:
        description: Production ZEUS base URL
        required: true
        default: https://zeus-teal.vercel.app
        type: string

permissions:
  contents: write


concurrency:
  group: zeus-complete-rolling-implementation
  cancel-in-progress: false

jobs:
  implement-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out audited main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed if any audited dependency changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/builder/BuilderClient.jsx)" = "687ec94844caef148610f34a037e9b9e856b8e15"
          test "$(git hash-object app/api/optimise/route.js)" = "e90ef89fafdf24fd30fbf8a2179f1d36c77afdc1"
          test "$(git hash-object lib/solver/autobuild.mjs)" = "ca17c47063e1df72b66f72c5969e0aae32481c83"
          test "$(git hash-object tests/fixtures/v2-eight-gameweeks.mjs)" = "12759b3f8343438351e96df6a19d4c66e8bfa5bb"
          test "$(git hash-object tests/v2-ui.test.mjs)" = "d13cf77e1abd5e825b8342c0b26cce31ab985836"
          test "$(git hash-object tests/render.test.mjs)" = "acb31649ee40f3359135e0285b673c9a5403cdf9"
          test "$(git hash-object tests/plan.test.mjs)" = "4c918cd93881cd883a15f413addd3d32a396033c"
          test "$(git hash-object tests/core-restoration.test.mjs)" = "fbdadbb2e749976aadb5151a25325e61b2b31de1"
          test "$(git hash-object tests/guards.test.mjs)" = "cf2147f8ecea5f1caf9479d56a01293343c4f9d1"
          test "$(git hash-object app/squad/SquadClient.jsx)" = "4ace14901ffd7f3c80a41daad9e12e7b6056bd39"
          test "$(git hash-object app/api/brief/route.js)" = "0b576467e1b37f799471cafc2843aed9ddd66ef3"
          test "$(git hash-object lib/server/fpl_brief_api.mjs)" = "2224faaae220163aabb0ff56da3326d54b132e86"
          test "$(git hash-object lib/server/squad-brief.mjs)" = "f3f2d248912cab97bb7f6b923911b6e4e3e3ca0c"
          test "$(git hash-object docs/LETTA_SAVED_SQUADS_TOOL.md)" = "72a17defd30f6ca8778f28b4de762251bd3ac903"
          test "$(git hash-object lib/plan.mjs)" = "e5bb24838c2045c7e07d711955d3088a6857e4f5"
          test "$(git hash-object lib/squad-projection.mjs)" = "fcb4819309291d2169d88c53fb6714d324af2469"
          test "$(git hash-object lib/solver/optimise.mjs)" = "7093bf1abdc36f65c84f4a6cd68bb6b7687af5fa"
          test "$(git hash-object components/GameweekRange.jsx)" = "9a2ed907af90f78a8b66fd9711f9d0b4f0f8df80"
          test "$(git hash-object .github/workflows/zeus-fix-improve-same-as-build.yml)" = "3f57e845cb780676712c1e8ed745196e5baf326a"
          test "$(git hash-object .github/workflows/zeus-lineups-chips-letta-squads-v11.yml)" = "4246d40e7951ad9d84d20a2b0f6279be8a6c13fc"
          test ! -e lib/optimise-request.mjs
          test ! -e lib/squad-range.mjs
          test ! -e lib/plan-range.mjs
          test ! -e lib/fixture-difficulty.mjs
          test ! -e lib/solver/build-range.mjs
          test ! -e components/SquadRangeSummary.jsx
          test ! -e docs/LETTA_FINAL_OPERATING_PROMPT.md
          test ! -e docs/WORKFLOWS.md
          test ! -e tests/optimise-request.test.mjs
          test ! -e tests/squad-range.test.mjs
          test ! -e tests/optimise-route-contract.test.mjs
          test ! -e tests/plan-range.test.mjs
          test ! -e tests/build-range.test.mjs
          test ! -e tests/fixture-difficulty.test.mjs
          test ! -e tests/saved-squad-route.test.mjs
          test ! -e tests/squad-range-ui-contract.test.mjs
          test -f .github/workflows/zeus-first-core-implementation.yml
          git diff --exit-code

      - name: Apply audited Builder, solver and fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '/tmp/zeus-apply-core-fixes.py')"
          printf '%s' '' | base64 --decode > '/tmp/zeus-apply-core-fixes.py'
          python3 /tmp/zeus-apply-core-fixes.py

      - name: Write exact optimiser helpers, endpoint and core tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'lib/optimise-request.mjs')"
          printf '%s' '' | base64 --decode > 'lib/optimise-request.mjs'
          mkdir -p "$(dirname 'lib/squad-range.mjs')"
          printf '%s' '' | base64 --decode > 'lib/squad-range.mjs'
          mkdir -p "$(dirname 'app/api/optimise/route.js')"
          printf '%s' '' | base64 --decode > 'app/api/optimise/route.js'
          mkdir -p "$(dirname 'tests/optimise-request.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/optimise-request.test.mjs'
          mkdir -p "$(dirname 'tests/squad-range.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/squad-range.test.mjs'
          mkdir -p "$(dirname 'tests/optimise-route-contract.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/optimise-route-contract.test.mjs'
      - name: Apply saved-squad range, fixture and Letta integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '/tmp/zeus-apply-remaining.py')"
          printf '%s' '' | base64 --decode > '/tmp/zeus-apply-remaining.py'
          mkdir -p "$(dirname '/tmp/zeus-optimise-function.txt')"
          printf '%s' '' | base64 --decode > '/tmp/zeus-optimise-function.txt'
          python3 /tmp/zeus-apply-remaining.py

      - name: Write shared range, fixture, UI, prompt and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'lib/plan-range.mjs')"
          printf '%s' '' | base64 --decode > 'lib/plan-range.mjs'
          mkdir -p "$(dirname 'lib/fixture-difficulty.mjs')"
          printf '%s' '' | base64 --decode > 'lib/fixture-difficulty.mjs'
          mkdir -p "$(dirname 'lib/solver/build-range.mjs')"
          printf '%s' '' | base64 --decode > 'lib/solver/build-range.mjs'
          mkdir -p "$(dirname 'components/SquadRangeSummary.jsx')"
          printf '%s' '' | base64 --decode > 'components/SquadRangeSummary.jsx'
          mkdir -p "$(dirname 'docs/LETTA_FINAL_OPERATING_PROMPT.md')"
          printf '%s' '' | base64 --decode > 'docs/LETTA_FINAL_OPERATING_PROMPT.md'
          mkdir -p "$(dirname 'tests/plan-range.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/plan-range.test.mjs'
          mkdir -p "$(dirname 'tests/build-range.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/build-range.test.mjs'
          mkdir -p "$(dirname 'tests/fixture-difficulty.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/fixture-difficulty.test.mjs'
          mkdir -p "$(dirname 'tests/squad-range-ui-contract.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/squad-range-ui-contract.test.mjs'
          mkdir -p "$(dirname 'tests/saved-squad-route.test.mjs')"
          printf '%s' '' | base64 --decode > 'tests/saved-squad-route.test.mjs'
      - name: Align release guards with exact-range architecture
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/zeus-align-range-guards.py
          python /tmp/zeus-align-range-guards.py

      - name: Verify the complete intended implementation diff
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n'             app/api/brief/route.js             app/api/optimise/route.js             app/builder/BuilderClient.jsx             app/squad/SquadClient.jsx             components/SquadRangeSummary.jsx             docs/LETTA_FINAL_OPERATING_PROMPT.md             docs/LETTA_SAVED_SQUADS_TOOL.md             lib/fixture-difficulty.mjs             lib/optimise-request.mjs             lib/solver/build-range.mjs             lib/plan-range.mjs             lib/server/fpl_brief_api.mjs             lib/server/squad-brief.mjs             lib/solver/autobuild.mjs             lib/solver/optimise.mjs             lib/squad-range.mjs             tests/build-range.test.mjs             tests/fixture-difficulty.test.mjs             tests/fixtures/v2-eight-gameweeks.mjs             tests/optimise-request.test.mjs             tests/optimise-route-contract.test.mjs             tests/core-restoration.test.mjs             tests/guards.test.mjs             tests/plan.test.mjs             tests/plan-range.test.mjs             tests/render.test.mjs             tests/saved-squad-route.test.mjs             tests/squad-range-ui-contract.test.mjs             tests/squad-range.test.mjs             tests/v2-ui.test.mjs | sort -u)"
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$actual" = "$expected"
          git diff --check
          grep -Fq 'squad.players.length >= RULES.size ? doRebuild' app/builder/BuilderClient.jsx
          ! grep -Fq 'improveSquad' app/builder/BuilderClient.jsx
          ! grep -Fq 'import { optimiseSquad }' app/builder/BuilderClient.jsx
          grep -Fq 'source_mode: "external_xpts_lineup_gated"' app/api/optimise/route.js
          grep -Fq 'buildSquadForRange' app/api/optimise/route.js
          grep -Fq 'buildSquadForRange' app/builder/BuilderClient.jsx
          grep -Fq 'mergeWeeklyDecisions' app/builder/BuilderClient.jsx
          grep -Fq 'optimiseSavedPlanRange' app/squad/SquadClient.jsx
          grep -Fq 'applyOptimisedRangeToPlan' app/squad/SquadClient.jsx
          grep -Fq 'simulate_gw' app/api/brief/route.js
          grep -Fq 'range_total' lib/server/squad-brief.mjs
          grep -Fq 'buildTeamFixtureOutlooks' lib/server/fpl_brief_api.mjs
          grep -Fq 'category_scale' lib/server/fpl_brief_api.mjs
          grep -Fq 'get_fpl_squad' docs/LETTA_FINAL_OPERATING_PROMPT.md
          grep -Fq 'get_saved_fpl_squads' docs/LETTA_FINAL_OPERATING_PROMPT.md
          grep -Fq 'durable memory' docs/LETTA_FINAL_OPERATING_PROMPT.md
          test ! -e docs/LETTA_SAVED_SQUADS_TOOL.md
          node --check app/api/brief/route.js
          node --check app/api/optimise/route.js
          node --check lib/fixture-difficulty.mjs
          node --check lib/optimise-request.mjs
          node --check lib/plan-range.mjs
          node --check lib/solver/build-range.mjs
          node --check lib/server/fpl_brief_api.mjs
          node --check lib/server/squad-brief.mjs
          node --check lib/solver/autobuild.mjs
          node --check lib/solver/optimise.mjs
          node --check lib/squad-range.mjs
          node --check tests/build-range.test.mjs
          node --check tests/core-restoration.test.mjs
          node --check tests/guards.test.mjs
          node --check tests/fixture-difficulty.test.mjs
          node --check tests/optimise-request.test.mjs
          node --check tests/optimise-route-contract.test.mjs
          node --check tests/plan-range.test.mjs
          node --check tests/render.test.mjs
          node --check tests/saved-squad-route.test.mjs
          node --check tests/squad-range-ui-contract.test.mjs
          node --check tests/squad-range.test.mjs
          node --check tests/v2-ui.test.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci
          else
            npm install --package-lock=false
          fi

      - name: Run focused implementation tests
        shell: bash
        run: |
          set -euo pipefail
          node --test             tests/core-restoration.test.mjs             tests/guards.test.mjs             tests/v2-ui.test.mjs             tests/render.test.mjs             tests/optimise-request.test.mjs             tests/optimise-route-contract.test.mjs             tests/squad-range.test.mjs             tests/plan-range.test.mjs             tests/build-range.test.mjs             tests/fixture-difficulty.test.mjs             tests/saved-squad-route.test.mjs             tests/squad-range-ui-contract.test.mjs             tests/lineup-chips-squads.test.mjs             tests/fixture-api-difficulty.test.mjs             tests/fixture-outlook.test.mjs             tests/plan.test.mjs

      - name: Run complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/zeus-full-suite.log
          grep -Fq '# fail 0' /tmp/zeus-full-suite.log
          grep -Fq '# cancelled 0' /tmp/zeus-full-suite.log

      - name: Build production application
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run build
          git diff --check

      - name: Commit verified implementation and self-delete installer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zeus-first-core-implementation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ZEUS ranges, fixtures and Letta contracts"
          implementation_sha="$(git rev-parse HEAD)"
          echo "IMPLEMENTATION_SHA=$implementation_sha" >> "$GITHUB_ENV"
          mkdir -p /tmp/zeus-release-evidence
          printf '%s\n' "$implementation_sha" > /tmp/zeus-release-evidence/implementation-sha.txt
          git push origin HEAD:main

      - name: Wait for exact production deployment
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ inputs.production_url }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY }}
        run: |
          set -euo pipefail
          base="${ZEUS_BASE_URL%/}"
          auth=()
          if [ -n "${ZEUS_API_KEY:-}" ]; then auth=(-H "x-api-key: $ZEUS_API_KEY"); fi
          ready=0
          for attempt in $(seq 1 72); do
            code="$(curl -sS -o /tmp/zeus-release-evidence/health.json -w '%{http_code}' "${auth[@]}" "$base/api/health" || true)"
            if [ "$code" = "200" ] && IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/zeus-release-evidence/health.json', 'utf8'));
          if (!body.ok) process.exit(1);
          if (body.deployment_commit !== process.env.IMPLEMENTATION_SHA) process.exit(1);
          NODE
            then
              ready=1
              break
            fi
            echo "Waiting for Vercel commit $IMPLEMENTATION_SHA ($attempt/72)..."
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "Exact implementation commit did not become live."
            cat /tmp/zeus-release-evidence/health.json 2>/dev/null || true
            exit 1
          fi
          printf '%s\n' "$base" > /tmp/zeus-release-evidence/production-url.txt

      - name: Verify live pages and structured contracts
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ inputs.production_url }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY }}
        run: |
          set -euo pipefail
          base="${ZEUS_BASE_URL%/}"
          auth=()
          if [ -n "${ZEUS_API_KEY:-}" ]; then auth=(-H "x-api-key: $ZEUS_API_KEY"); fi
          for route in / /players /builder /squad; do
            code="$(curl -sS -o "/tmp/zeus-release-evidence/page-${route//\//_}.html" -w '%{http_code}' "$base$route")"
            test "$code" = "200"
          done
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=1&gw_to=1&budget=100" > /tmp/zeus-release-evidence/optimise-gw1.json
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=2&gw_to=2&budget=100" > /tmp/zeus-release-evidence/optimise-gw2.json
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=1&gw_to=3&budget=100" > /tmp/zeus-release-evidence/optimise-gw1-gw3.json
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=2&gw_to=4&budget=100" > /tmp/zeus-release-evidence/optimise-gw2-gw4.json
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=1&gw_to=3&budget=100&chip=benchboost&chip_gw=1" > /tmp/zeus-release-evidence/optimise-bb.json
          curl -sS "${auth[@]}" "$base/api/optimise?format=json&mode=squad&gw_from=1&gw_to=3&budget=100&chip=triplecaptain&chip_gw=2" > /tmp/zeus-release-evidence/optimise-tc.json
          curl -sS "${auth[@]}" "$base/api/brief?view=squads&format=json&gw_from=1&gw_to=2&plan=active&include_players=true" > /tmp/zeus-release-evidence/saved-range.json
          curl -sS "${auth[@]}" "$base/api/brief?view=squads&format=json&plan=active&simulate_chip=benchboost&simulate_gw=2&include_players=false" > /tmp/zeus-release-evidence/simulation.json
          curl -sS "${auth[@]}" "$base/api/brief?view=fixtures&format=json&team=ARS&gw_from=2&gw_to=5" > /tmp/zeus-release-evidence/fixtures.json
          curl -sS "${auth[@]}" "$base/api/brief?view=xpts&format=json&gw_from=1&gw_to=1&limit=5000&offset=0" > /tmp/zeus-release-evidence/xpts.json
          gw9_code="$(curl -sS -o /tmp/zeus-release-evidence/gw9.json -w '%{http_code}' "${auth[@]}" "$base/api/brief?view=xpts&format=json&gw_from=9&gw_to=9")"
          test "$gw9_code" = "400"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(`/tmp/zeus-release-evidence/${name}.json`, 'utf8'));
          const verifyBuild = (body, from, to, label) => {
            if (!body.ok || body.gw_from !== from || body.gw_to !== to) throw new Error(`${label}: exact range failed`);
            if (body.squad?.players?.length !== 15 || body.weekly?.length !== to - from + 1) {
              throw new Error(`${label}: squad or weekly length failed`);
            }
            const composition = body.squad?.composition || {};
            if (composition.GKP !== 2 || composition.DEF !== 5 || composition.MID !== 5 || composition.FWD !== 3) {
              throw new Error(`${label}: illegal composition`);
            }
            if (Object.values(body.squad?.club_counts || {}).some((count) => Number(count) > 3)) {
              throw new Error(`${label}: club limit failed`);
            }
            if (Number(body.squad.xi_cost) > 83.000001 || Number(body.squad.bench_cost) > 17.000001
              || Number(body.squad.total_cost) > 100.000001) throw new Error(`${label}: budget limits failed`);
            if (!Number.isFinite(Number(body.total?.net_xpts))) throw new Error(`${label}: range total missing`);
            const summed = body.weekly.reduce((total, week) => total + Number(week.net_xpts || 0), 0);
            if (Math.abs(summed - Number(body.total.net_xpts)) > 1e-7) throw new Error(`${label}: weekly total mismatch`);
          };

          const gw1 = read('optimise-gw1');
          const gw2 = read('optimise-gw2');
          const gw1gw3 = read('optimise-gw1-gw3');
          const gw2gw4 = read('optimise-gw2-gw4');
          verifyBuild(gw1, 1, 1, 'GW1');
          verifyBuild(gw2, 2, 2, 'GW2');
          verifyBuild(gw1gw3, 1, 3, 'GW1-GW3');
          verifyBuild(gw2gw4, 2, 4, 'GW2-GW4');

          const bb = read('optimise-bb');
          verifyBuild(bb, 1, 3, 'GW1-GW3 Bench Boost');
          if (bb.weekly?.[0]?.chip !== 'benchboost' || !(bb.weekly[0].bench_boost_bonus > 0)
            || bb.weekly.slice(1).some((week) => week.bench_boost_bonus !== 0)) {
            throw new Error('GW1 Bench Boost theoretical build failed');
          }
          const tc = read('optimise-tc');
          verifyBuild(tc, 1, 3, 'GW1-GW3 Triple Captain');
          const tcWeek = (tc.weekly || []).find((week) => week.gw === 2);
          if (tcWeek?.chip !== 'triplecaptain' || tcWeek?.captain_multiplier !== 3
            || tc.weekly.filter((week) => week.gw !== 2).some((week) => week.captain_multiplier === 3)) {
            throw new Error('GW2 Triple Captain theoretical build failed');
          }

          const saved = read('saved-range');
          if (!saved.ok || saved.gw_from !== 1 || saved.gw_to !== 2) throw new Error('Saved range request failed');
          if (!saved.selected_squad || saved.selected_squad.weekly?.length !== 2) throw new Error('Saved weekly range is missing');
          if (!Number.isFinite(Number(saved.selected_squad.range_total?.net_xpts))) throw new Error('Saved range total is missing');
          if ((saved.available_squads || []).some((row) => /4812/.test(String(row.plan_name)))) throw new Error('Team 4812 is exposed');

          const simulation = read('simulation');
          const simulated = simulation.selected_squad?.range_simulation;
          if (!simulation.ok || simulation.gw_from !== 2 || simulation.gw_to !== 2
            || !simulated || simulated.gw !== 2 || simulated.chip !== 'benchboost' || simulated.persisted !== false) {
            throw new Error('Exact standalone GW2 Bench Boost simulation failed');
          }

          const fixtures = read('fixtures');
          if (!fixtures.ok || !fixtures.fixtures?.length || !fixtures.team_outlooks?.length) throw new Error('Fixture outlook failed');
          const views = fixtures.fixtures.flatMap((fixture) => [fixture.home_team_view, fixture.away_team_view]).filter(Boolean);
          const categories = new Set(['EASY', 'MEDIUM', 'HARD']);
          for (const view of views) {
            if (!categories.has(view.category) || !categories.has(view.attack_category) || !categories.has(view.defence_category)) {
              throw new Error('Fixture category missing');
            }
            if (!Number.isFinite(Number(view.numeric_value)) || !view.strength_inputs) throw new Error('Fixture numeric inputs missing');
          }

          const xpts = read('xpts');
          if (!xpts.ok || !xpts.lineup_gate?.active) throw new Error('Lineup gate is not live');
          const haaland = (xpts.projections || []).find((row) => row.name === 'Haaland');
          if (!haaland || Number(haaland.xpts) !== 7.5 || Number(haaland.raw_imported_xpts) !== 7.5) {
            throw new Error('Haaland GW1 canonical calibration changed');
          }
          const nonStarter = (xpts.projections || []).find((row) => row.predicted_start === false && Number(row.raw_imported_xpts) > 0);
          if (!nonStarter || nonStarter.xpts !== 0 || nonStarter.start_probability !== 0) throw new Error('Raw/effective xPTS contract failed');
          console.log('All live ZEUS acceptance checks passed.');
          NODE

      - name: Remove only superseded temporary workflows and write workflow audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/zeus-fix-improve-same-as-build.yml)" = "3f57e845cb780676712c1e8ed745196e5baf326a"
          test "$(git hash-object .github/workflows/zeus-lineups-chips-letta-squads-v11.yml)" = "4246d40e7951ad9d84d20a2b0f6279be8a6c13fc"
          for file in             .github/workflows/zeus-fix-improve-same-as-build.yml             .github/workflows/zeus-lineups-chips-letta-squads-v11.yml; do
            name="$(basename "$file")"
            references="$(git grep -l -F "$name" -- ':!docs/WORKFLOWS.md' ":!$file" || true)"
            test -z "$references"
            git rm "$file"
          done
          mkdir -p docs /tmp/zeus-release-evidence
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          protected = {
              '.github/workflows/archive-2526.yml',
              '.github/workflows/backtest-engine.yml',
              '.github/workflows/backtest.yml',
              '.github/workflows/baseline-gate.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/component-attribution.yml',
              '.github/workflows/fpl-pull.yml',
              '.github/workflows/history-load.yml',
              '.github/workflows/minutes-scorecard.yml',
              '.github/workflows/odds-pull.yml',
              '.github/workflows/penalty-duty.yml',
              '.github/workflows/presser-pull.yml',
              '.github/workflows/projections-run.yml',
              '.github/workflows/reliability.yml',
              '.github/workflows/rival-pull.yml',
              '.github/workflows/sweep.yml',
              '.github/workflows/understat-pull.yml',
              '.github/workflows/zeus-release-check-v5.yml',
          }

          def trigger_names(lines):
              out=[]
              for index,line in enumerate(lines):
                  if line.strip() in {'on:', '"on":'}:
                      for child in lines[index+1:index+14]:
                          if child and not child.startswith(' '): break
                          stripped=child.strip()
                          if stripped.endswith(':') and not stripped.startswith(('-', '#')):
                              out.append(stripped[:-1].strip('"'))
                      break
              return list(dict.fromkeys(out))

          def classify(path, text, triggers):
              if path in protected:
                  return 'KEEP'
              manual_only = triggers and set(triggers) <= {'workflow_dispatch'}
              one_off = any(marker in text for marker in [
                  'git commit', 'git push', 'python3 - <<', 'replace_exact(', 'workflow_dispatch:',
              ])
              versioned = bool(re.search(r'(?:-v\d+|zeus-(?:fix|repair|install|switch|tidy))', Path(path).stem, re.I))
              if manual_only and one_off and versioned:
                  return 'DELETE CANDIDATE'
              return 'MANUAL REVIEW'

          rows=[]
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text=path.read_text(encoding='utf-8')
              lines=text.splitlines()
              name=next((line.split(':',1)[1].strip() for line in lines if line.startswith('name:')), path.name)
              triggers=trigger_names(lines)
              last=subprocess.check_output(['git','log','-1','--format=%h %cs %s','--',str(path)], text=True).strip()
              category=classify(str(path), text, triggers)
              references=subprocess.check_output(
                  ['bash','-lc',f'git grep -l -F {repr(path.name)} -- ":!{path}" || true'], text=True,
              ).strip().splitlines()
              rows.append({
                  'path': str(path), 'name': name,
                  'triggers': ', '.join(triggers) or 'unresolved',
                  'last': last or 'uncommitted', 'category': category,
                  'references': ', '.join(references) or 'none',
              })

          root_yaml=sorted([str(p) for p in Path('.').glob('*.y*ml')])
          out=[
              '# GitHub workflow inventory', '',
              'This inventory was generated after the complete ZEUS implementation was verified live.', '',
              '## Cleanup policy', '',
              '- Permanent operational workflows are protected.',
              '- The two proven superseded workflows were removed by exact path and blob hash.',
              '- Remaining one-off-looking workflows are audit candidates only and were not deleted automatically.',
              '- Manual review is required before any further deletion.', '',
          ]
          for category in ['KEEP', 'DELETE CANDIDATE', 'MANUAL REVIEW']:
              out += [f'## {category}', '', '| Path | Name | Triggers | References | Last commit |', '|---|---|---|---|---|']
              selected=[row for row in rows if row['category']==category]
              out += [f"| `{row['path']}` | {row['name']} | {row['triggers']} | {row['references']} | {row['last']} |" for row in selected]
              if not selected: out += ['| None |  |  |  |  |']
              out += ['']
          out += ['## Root YAML files', '']
          out += [f'- `{path}` (manual review; root files are not active Actions)' for path in root_yaml] or ['- None.']
          Path('docs/WORKFLOWS.md').write_text('\n'.join(out)+'\n', encoding='utf-8')
          Path('/tmp/zeus-release-evidence/workflow-audit.txt').write_text(
              '\n'.join('\t'.join([row['category'],row['path'],row['name'],row['triggers'],row['references'],row['last']]) for row in rows)+'\n',
              encoding='utf-8',
          )
          PY
          if command -v ruby >/dev/null 2>&1; then
            ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "parsed #{f}" }'               | tee /tmp/zeus-release-evidence/yaml-parse.txt
          fi
          git diff --check
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n'             .github/workflows/zeus-fix-improve-same-as-build.yml             .github/workflows/zeus-lineups-chips-letta-squads-v11.yml             docs/WORKFLOWS.md | sort)"
          test "$changed" = "$expected"
          git commit -m "Remove superseded ZEUS workflows and document inventory"
          git push origin HEAD:main
          git log -2 --oneline > /tmp/zeus-release-evidence/final-commits.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeus-complete-release-evidence
          path: /tmp/zeus-release-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Final report
        shell: bash
        run: |
          echo "Implementation commit verified live: $IMPLEMENTATION_SHA"
          echo "The complete ZEUS implementation, final Letta prompt, live checks and guarded workflow cleanup passed."
