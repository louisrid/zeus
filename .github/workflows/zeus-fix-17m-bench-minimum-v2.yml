name: Fix 17m bench minimum V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zeus-fix-17m-bench-minimum-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Change 17m from a bench ceiling to a bench minimum
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # The owned-squad optimiser must require bench spend >= 17, not <= 17.
          path = Path("lib/solver/optimise.mjs")
          text = path.read_text()
          text = replace_once(
              text,
              '''  const xiBudget = finiteBudget(opts.xiBudget);\n  const benchBudget = finiteBudget(opts.benchBudget);''',
              '''  const xiBudget = finiteBudget(opts.xiBudget);\n  const benchMinimum = opts.benchBudget !== null && opts.benchBudget !== undefined && opts.benchBudget !== ""\n    && Number.isFinite(Number(opts.benchBudget)) ? Math.max(0, Number(opts.benchBudget)) : 0;''',
              "optimise budget variables",
          )
          text = replace_once(
              text,
              '''            if (xiCost > xiBudget + 1e-9 || benchCost > benchBudget + 1e-9) continue;''',
              '''            if (xiCost > xiBudget + 1e-9 || benchCost + 1e-9 < benchMinimum) continue;''',
              "optimise budget condition",
          )
          path.write_text(text)

          # The squad builder reserves at least 17m for the bench, permits a more expensive bench,
          # and enforces the minimum even when the cheapest four cost less than 17m.
          path = Path("lib/solver/autobuild.mjs")
          text = path.read_text()
          text = text.replace("DEFAULT_BENCH_BUDGET", "DEFAULT_BENCH_MINIMUM")
          text = replace_once(
              text,
              ''' * The job: maximise the fielded eleven over the selected horizon while reserving a hard ceiling\n * for the four substitutes. The XI and bench are separate optimisation stages: first maximise the\n * XI inside its budget, then maximise the legal bench inside its own budget.''',
              ''' * The job: maximise the fielded eleven over the selected horizon while reserving at least\n * 17m for the four substitutes. The XI and bench are separate optimisation stages: first maximise\n * the XI inside its cap, then maximise the legal bench with the remaining total budget.''',
              "autobuild header",
          )
          text = replace_once(
              text,
              '''  const benchCap = Math.max(0, Math.min(totalBudget, Number.isFinite(Number(benchBudget)) ? Number(benchBudget) : DEFAULT_BENCH_MINIMUM));\n  const xiCap = Math.max(0, totalBudget - benchCap);''',
              '''  const benchMinimum = Math.max(0, Math.min(totalBudget, Number.isFinite(Number(benchBudget)) ? Number(benchBudget) : DEFAULT_BENCH_MINIMUM));\n  const xiCap = Math.max(0, totalBudget - benchMinimum);''',
              "autobuild budget variables",
          )
          text = text.replace(
              "avoidable expensive bench from consuming the entire £17m allowance.",
              "a legal formation from being blocked by the £17m minimum.",
          )

          start_marker = '''    // A partial draft may force an expensive kept player onto the bench. Try to exchange that player\n'''
          end_marker = '''    const finalIds = new Set([...xi, ...bench].map((player) => Number(player.fpl_id)));\n'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("autobuild bench optimisation block not found")

          new_block = '''    // 17m is the minimum spend on the four substitutes, not a ceiling. Start by\n    // spending spare total budget on legal bench upgrades until the minimum is reached.\n    let minimumGuard = 500;\n    while (sumPrice(bench) + EPS < benchMinimum && minimumGuard-- > 0) {\n      const totalSpare = totalBudget - sumPrice(xi) - sumPrice(bench);\n      let bestMinimumSwap = null;\n      for (const outgoing of bench) {\n        if (keepSet.has(Number(outgoing.fpl_id)) || lockSet.has(Number(outgoing.fpl_id))) continue;\n        for (const incoming of cand) {\n          const inId = Number(incoming.fpl_id);\n          if (incoming.position !== outgoing.position || chosen.has(inId)) continue;\n          const extra = price(incoming) - price(outgoing);\n          if (extra <= EPS || extra > totalSpare + EPS) continue;\n          if (incoming.team_id !== outgoing.team_id && !roomAt(incoming)) continue;\n          const gain = xp(incoming) - xp(outgoing);\n          const nextBenchCost = sumPrice(bench) + extra;\n          const reachesMinimum = nextBenchCost + EPS >= benchMinimum;\n          const loss = Math.max(0, -gain);\n          const lossRate = loss / extra;\n          const overshoot = Math.max(0, nextBenchCost - benchMinimum);\n          if (!bestMinimumSwap\n            || (gain > bestMinimumSwap.gain + EPS)\n            || (Math.abs(gain - bestMinimumSwap.gain) <= EPS && reachesMinimum && !bestMinimumSwap.reachesMinimum)\n            || (Math.abs(gain - bestMinimumSwap.gain) <= EPS && reachesMinimum === bestMinimumSwap.reachesMinimum\n              && lossRate < bestMinimumSwap.lossRate - EPS)\n            || (Math.abs(gain - bestMinimumSwap.gain) <= EPS && reachesMinimum === bestMinimumSwap.reachesMinimum\n              && Math.abs(lossRate - bestMinimumSwap.lossRate) <= EPS && overshoot < bestMinimumSwap.overshoot - EPS)) {\n            bestMinimumSwap = { outgoing, incoming, gain, reachesMinimum, lossRate, overshoot };\n          }\n        }\n      }\n      if (!bestMinimumSwap) break;\n      replaceBench(bestMinimumSwap.outgoing, bestMinimumSwap.incoming);\n    }\n\n    // When the complete 15 is fixed and no outside bench upgrade is available, a same-position\n    // starter/bench exchange can still move enough spend onto the bench without changing the squad.\n    let seatGuard = 50;\n    while (sumPrice(bench) + EPS < benchMinimum && seatGuard-- > 0) {\n      let bestSeatSwap = null;\n      for (const starter of xi) {\n        if (lockSet.has(Number(starter.fpl_id))) continue;\n        for (const benchPlayer of bench) {\n          if (benchPlayer.position !== starter.position || !startsEnough(benchPlayer)) continue;\n          const increase = price(starter) - price(benchPlayer);\n          if (increase <= EPS) continue;\n          const loss = xp(starter) - xp(benchPlayer);\n          const lossRate = loss / increase;\n          const nextBenchCost = sumPrice(bench) + increase;\n          const overshoot = Math.max(0, nextBenchCost - benchMinimum);\n          if (!bestSeatSwap\n            || lossRate < bestSeatSwap.lossRate - EPS\n            || (Math.abs(lossRate - bestSeatSwap.lossRate) <= EPS && loss < bestSeatSwap.loss - EPS)\n            || (Math.abs(lossRate - bestSeatSwap.lossRate) <= EPS\n              && Math.abs(loss - bestSeatSwap.loss) <= EPS && overshoot < bestSeatSwap.overshoot - EPS)) {\n            bestSeatSwap = { starter, benchPlayer, loss, lossRate, overshoot };\n          }\n        }\n      }\n      if (!bestSeatSwap) break;\n      xi[xi.indexOf(bestSeatSwap.starter)] = bestSeatSwap.benchPlayer;\n      bench[bench.indexOf(bestSeatSwap.benchPlayer)] = bestSeatSwap.starter;\n    }\n    if (sumPrice(bench) + EPS < benchMinimum) continue;\n\n    // Once the minimum is satisfied, use any remaining total budget on positive bench upgrades.\n    let benchGuard = 500;\n    while (benchGuard-- > 0) {\n      const totalSpare = totalBudget - sumPrice(xi) - sumPrice(bench);\n      let bestBenchSwap = null;\n      for (const outgoing of bench) {\n        if (keepSet.has(Number(outgoing.fpl_id)) || lockSet.has(Number(outgoing.fpl_id))) continue;\n        for (const incoming of cand) {\n          const inId = Number(incoming.fpl_id);\n          if (incoming.position !== outgoing.position || chosen.has(inId)) continue;\n          const extra = price(incoming) - price(outgoing);\n          if (extra > totalSpare + EPS) continue;\n          if (sumPrice(bench) + extra + EPS < benchMinimum) continue;\n          if (incoming.team_id !== outgoing.team_id && !roomAt(incoming)) continue;\n          const gain = xp(incoming) - xp(outgoing);\n          if (gain <= EPS) continue;\n          const value = extra > EPS ? gain / extra : gain * 1000;\n          if (!bestBenchSwap || gain > bestBenchSwap.gain + EPS\n            || (Math.abs(gain - bestBenchSwap.gain) <= EPS && value > bestBenchSwap.value + EPS)\n            || (Math.abs(gain - bestBenchSwap.gain) <= EPS && Math.abs(value - bestBenchSwap.value) <= EPS\n              && price(incoming) < price(bestBenchSwap.incoming) - EPS)) {\n            bestBenchSwap = { outgoing, incoming, gain, value };\n          }\n        }\n      }\n      if (!bestBenchSwap) break;\n      replaceBench(bestBenchSwap.outgoing, bestBenchSwap.incoming);\n    }\n\n'''
          text = text[:start] + new_block + text[end:]
          text = replace_once(
              text,
              '''    if (xiCost > xiCap + EPS || benchCost > benchCap + EPS || totalCost > totalBudget + EPS) continue;''',
              '''    if (xiCost > xiCap + EPS || benchCost + EPS < benchMinimum || totalCost > totalBudget + EPS) continue;''',
              "autobuild final budget condition",
          )
          text = replace_once(
              text,
              '''      benchBudget: Math.round(benchCap * 10) / 10,''',
              '''      benchBudget: Math.round(benchMinimum * 10) / 10,''',
              "autobuild returned bench rule",
          )

          # improveSquad uses the same minimum semantics.
          text = replace_once(
              text,
              '''  const benchCap = Math.max(0, Math.min(totalBudget, Number.isFinite(Number(benchBudget)) ? Number(benchBudget) : DEFAULT_BENCH_MINIMUM));\n  const xiCap = totalBudget - benchCap;''',
              '''  const benchMinimum = Math.max(0, Math.min(totalBudget, Number.isFinite(Number(benchBudget)) ? Number(benchBudget) : DEFAULT_BENCH_MINIMUM));\n  const xiCap = totalBudget - benchMinimum;''',
              "improve budget variables",
          )
          text = replace_once(
              text,
              '''        if (xiSpend > xiCap + EPS || benchSpend > benchCap + EPS || xiSpend + benchSpend > totalBudget + EPS) continue;''',
              '''        if (xiSpend > xiCap + EPS || benchSpend + EPS < benchMinimum || xiSpend + benchSpend > totalBudget + EPS) continue;''',
              "improve budget condition",
          )
          text = text.replace(
              "live bank, XI budget, bench budget\n   and club limit",
              "live bank, XI cap, bench minimum\n   and club limit",
          )
          if re.search(r"\bbenchCap\b", text):
              raise SystemExit("autobuild still contains the benchCap variable after patch")
          path.write_text(text)

          # Range builds keep the XI cap but treat 17m as the minimum weekly bench spend.
          path = Path("lib/solver/build-range.mjs")
          text = path.read_text()
          text = text.replace("benchCap", "benchMinimum")
          text = text.replace('replace(/[\\\\s_-]+/g, "")', 'replace(/[\\s_-]+/g, "")')
          if re.search(r"\bbenchCap\b", text):
              raise SystemExit("build-range still contains the benchCap variable after patch")
          path.write_text(text)

          # Make the raw API unambiguous for Letta and other clients.
          path = Path("app/api/optimise/route.js")
          text = path.read_text()
          text = replace_once(
              text,
              '''        xi_budget: Math.max(0, parsed.budget - 17),\n        bench_budget: 17,''',
              '''        xi_budget: Math.max(0, parsed.budget - 17),\n        bench_budget: 17,\n        bench_budget_rule: "minimum",''',
              "API constraint metadata",
          )
          path.write_text(text)
          PY

      - name: Add regression tests for the 17m minimum
        run: |
          cat > tests/bench-minimum.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { bestXI } from "../lib/solver/autobuild.mjs";
          import { optimiseSquad } from "../lib/solver/optimise.mjs";
          import { buildSquadForRange } from "../lib/solver/build-range.mjs";

          function fixedFifteen() {
            let id = 1;
            const players = [];
            const add = (position, price, xp, team) => players.push({
              fpl_id: id++, web_name: `${position}${id}`, position, price, xp, team_id: team,
            });
            add("GKP", 6, 10, 1);
            add("GKP", 4, 1, 2);
            for (let i = 0; i < 5; i += 1) add("DEF", 4, 5 - i * 0.1, 3 + i);
            for (let i = 0; i < 5; i += 1) add("MID", 4, 6 - i * 0.1, 8 + i);
            for (let i = 0; i < 3; i += 1) add("FWD", 4, 7 - i * 0.1, 13 + i);
            return players;
          }

          test("owned-squad optimisation treats 17m as a minimum, not a maximum", () => {
            const players = fixedFifteen();
            const expensiveKeeper = players[0];
            const cheapKeeper = players[1];
            const result = optimiseSquad(
              { structure: "3-4-3", players, captain: null, vice: null },
              (player) => player.xp,
              { xiBudget: 83, benchBudget: 17 },
            );
            assert.ok(result);
            assert.ok(result.benchCost >= 17, `bench must cost at least 17m, got ${result.benchCost}`);
            assert.ok(result.players.find((player) => player.fpl_id === cheapKeeper.fpl_id)?.starting);
            assert.equal(result.players.find((player) => player.fpl_id === expensiveKeeper.fpl_id)?.starting, false);
          });

          test("the builder permits a bench above 17m", () => {
            const result = bestXI({ pool: fixedFifteen(), xpOf: (player) => player.xp, benchBudget: 17 });
            assert.ok(result);
            assert.equal(result.benchCost, 18);
            assert.ok(result.benchCost >= 17);
            assert.ok(result.cost <= 100);
          });

          test("range builds preserve the 17m minimum in every weekly lineup", () => {
            const result = buildSquadForRange({
              pool: fixedFifteen(),
              scoreForGw: (player) => player.xp,
              gwFrom: 1,
              gwTo: 2,
              budget: 100,
              benchBudget: 17,
            });
            assert.ok(result.ok, result.error);
            assert.ok(result.benchCost >= 17, `first-week bench must cost at least 17m, got ${result.benchCost}`);
            for (const week of result.weekly) {
              const cost = week.bench.reduce((sum, player) => sum + player.price, 0);
              assert.ok(cost >= 17, `GW${week.gw} bench must cost at least 17m, got ${cost}`);
            }
          });
          EOF

      - name: Verify source semantics
        run: |
          grep -n 'benchCost + 1e-9 < benchMinimum' lib/solver/optimise.mjs
          grep -n 'benchCost + EPS < benchMinimum' lib/solver/autobuild.mjs
          grep -n 'bench_budget_rule: "minimum"' app/api/optimise/route.js
          grep -n 'const benchCapacity' lib/solver/autobuild.mjs
          if grep -R "benchCost > bench" lib/solver lib/squad-range.mjs; then
            echo "A bench ceiling remains in solver code"
            exit 1
          fi

      - name: Run targeted tests
        run: node --test tests/autobuild.test.mjs tests/build-range.test.mjs tests/bench-minimum.test.mjs

      - name: Run production build
        run: npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/zeus-restore-builder-budget-rules.yml
          git rm -f --ignore-unmatch .github/workflows/zeus-restore-builder-budget-rules-v2.yml
          git rm -f --ignore-unmatch .github/workflows/zeus-restore-builder-budget-rules-v3.yml
          git rm -f --ignore-unmatch .github/workflows/zeus-fix-17m-bench-minimum-v1.yml
          git rm -f --ignore-unmatch .github/workflows/zeus-fix-17m-bench-minimum-v2.yml
          git add -A
          git commit -m "Treat 17m as the minimum bench spend"
          git push
