name: sweep
# EVERY PARAMETER, MEASURED WHERE IT MEANS SOMETHING. Actions tab, choose "sweep", press "Run workflow".
#
# Two stages, because a parameter can only be measured where it has an effect. The seven points parameters are
# judged on players who started, where the points model is what is being tested. The rotation parameter is
# judged on every player with a fixture, because with minutes held certain it does nothing at all.
#
# Every change then has to survive being re-measured: whole gameweeks are redrawn a few hundred times and the
# change has to keep winning. Anything that does not is put back to its default and recorded as not measured.
# That is why the first run's result was thrown away: it wrote down values that moved ordering by less than a
# thousandth, four of them landing on the extreme of their range by chance.
#
# The band correction is fitted on the tuning seasons only and kept only if it shrinks the gap in the band
# where transfer decisions are made.
#
# Nothing is committed unless the whole suite passes and the site still builds afterwards.
#
# READ THE FIRST TABLE IT PRINTS. It reports rows, gameweeks and clubs matched per season. A season short of
# gameweeks cannot support the fixture parameter, and the fix for that is to re-run the history-load workflow.

on:
  workflow_dispatch:
    inputs:
      random_tries:
        description: "Random combinations to draw before refining. 3000 takes about twenty minutes."
        default: "3000"
      descent_passes:
        description: "How many times to walk every parameter in turn after that."
        default: "4"
      confidence:
        description: "How often a change must win when the season is redrawn, or it is not applied."
        default: "0.95"
      bootstrap_draws:
        description: "How many times to redraw the season when testing a change."
        default: "300"
      fixtures:
        description: "1 to let the harness use opponent strength, 0 to ignore it."
        default: "1"
      tune_seasons:
        description: "Seasons to tune on. COVID years and pre-2021 are excluded on purpose."
        default: "2021-22,2022-23,2023-24,2024-25"
      test_season:
        description: "The season held back. Never tuned on."
        default: "2025-26"
      from_gw:
        description: "First gameweek to project. Needs history before it, so not 1."
        default: "8"
      to_gw:
        description: "Last gameweek to project."
        default: "38"
      write:
        description: "1 to write and commit what it proved, 0 to only report it."
        default: "1"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, like every other job here. The Supabase client needs native WebSocket support, which Node 20
          # does not have, and the error it gives talks about "ws" rather than the version.
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Search every parameter and write down only what it proved
        # The heap is raised because five seasons of running totals sit in memory for the whole run.
        run: node --max-old-space-size=3500 jobs/sweep.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RANDOM_TRIES: ${{ github.event.inputs.random_tries }}
          DESCENT_PASSES: ${{ github.event.inputs.descent_passes }}
          CONFIDENCE: ${{ github.event.inputs.confidence }}
          BOOTSTRAP_DRAWS: ${{ github.event.inputs.bootstrap_draws }}
          FIXTURES: ${{ github.event.inputs.fixtures }}
          TUNE_SEASONS: ${{ github.event.inputs.tune_seasons }}
          TEST_SEASON: ${{ github.event.inputs.test_season }}
          FROM_GW: ${{ github.event.inputs.from_gw }}
          TO_GW: ${{ github.event.inputs.to_gw }}
          WRITE: ${{ github.event.inputs.write }}

      - name: Check the tree still passes with what it wrote
        run: npm test

      - name: And that it still builds
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Commit only the file it wrote
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add config/fitted-params.json
          if git diff --cached --quiet; then
            echo "Nothing changed. Either write was off, or nothing cleared the bar."
          else
            git commit -qm "sweep: what survived being re-measured"
            git push
          fi

      - name: Keep the result as a file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-result
          path: config/fitted-params.json
