# THE BACKTEST. Run it from the Actions tab; the results appear in the log.
#
# It walks last season gameweek by gameweek, projects every player who started using only the gameweeks
# before that one, and compares each projection to what the player actually scored. Nothing is tuned on data
# it has already seen, which is the only way a result means anything.
#
# The number to watch is BIAS. Positive means the model projects higher than players really score, which is
# the exact complaint that prompted this. MAE is the average error: lower is better, and a parameter change
# that lowers it is an improvement regardless of how good the argument for the old value was.
#
# To compare two settings, run it twice with different shrinkage values and read the two MAEs.
name: backtest

on:
  workflow_dispatch:
    inputs:
      tune_seasons:
        description: "Seasons to tune on, comma separated. COVID years and pre-2021 are excluded on purpose."
        default: "2021-22,2022-23,2023-24,2024-25"
      test_season:
        description: "Season held back for testing. Never used for tuning."
        default: "2025-26"
      season:
        description: "One season only, overrides the split above. Leave blank normally."
        default: ""
      from_gw:
        description: "First gameweek to project. Needs history before it, so not 1."
        default: "8"
      to_gw:
        description: "Last gameweek to project"
        default: "38"
      shrinkage:
        description: "Shrinkage to test. Leave blank for the fitted value. Ignored when sweep is on."
        default: ""
      sweep:
        description: "Set to 1 to try many settings and report which predicts best."
        default: ""
      sweep_values:
        description: "Shrinkage values to try when sweeping, comma separated."
        default: "2,4,6,8,12,18,24"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, like every other job here. The Supabase client needs native WebSocket support, which
          # Node 20 does not have, and the error it gives is about "ws" rather than the version.
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Derive the rules last season was actually scored under
        # Solved out of the archive rather than typed from memory. If these do not match the published values
        # the archive is inconsistent, and that matters more than any parameter tuning.
        run: node jobs/derive_rules.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASON: ${{ github.event.inputs.season }}
          TUNE_SEASONS: ${{ github.event.inputs.tune_seasons }}
          TEST_SEASON: ${{ github.event.inputs.test_season }}
      - name: Walk last season and score every projection
        run: node jobs/backtest.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASON: ${{ github.event.inputs.season }}
          TUNE_SEASONS: ${{ github.event.inputs.tune_seasons }}
          TEST_SEASON: ${{ github.event.inputs.test_season }}
          FROM_GW: ${{ github.event.inputs.from_gw }}
          TO_GW: ${{ github.event.inputs.to_gw }}
          SHRINKAGE: ${{ github.event.inputs.shrinkage }}
          SWEEP: ${{ github.event.inputs.sweep }}
          SWEEP_SHRINKAGE: ${{ github.event.inputs.sweep_values }}
