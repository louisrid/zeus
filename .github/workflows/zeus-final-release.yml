name: zeus-final-release

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zeus-final-release
  cancel-in-progress: false

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove obsolete repair files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -e "$path" ]; then
              git rm -rq "$path"
              echo "removed $path"
            fi
          done < config/repository-cleanup-paths.txt

      - name: Confirm the repository is clean
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/apply-zeus-deep-repair-v11.yml \
            .github/workflows/apply-zeus-verified-repair-v12.yml \
            .github/workflows/apply-zeus-complete-repair-v13.yml \
            .github/workflows/apply-zeus-final-repair-v14.yml \
            .github/workflows/finish-zeus-repair-v15.yml \
            .github/workflows/fix-upload.yml \
            workflows-to-add; do
            if [ -e "$path" ]; then
              echo "obsolete path still exists: $path"
              exit 1
            fi
          done
          echo "Obsolete repair workflows and duplicate installers are gone."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the complete test suite
        run: npm test

      - name: Build the production website
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Commit repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove obsolete Zeus repair workflows"
            git push origin main
          else
            echo "Repository was already clean."
          fi
          echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Vercel and verify the live system
        run: node jobs/verify_live_system.mjs
        env:
          ZEUS_BASE_URL: ${{ vars.ZEUS_BASE_URL || 'https://zeus-teal.vercel.app' }}
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY || secrets.OPENWEBUI_API_KEY || secrets.FPL_BRIEF_API_KEY }}
          VERIFY_ATTEMPTS: 36
          VERIFY_DELAY_MS: 20000

      - name: Add verification report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/system-verification-latest.md ]; then
            cat docs/system-verification-latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No final verification report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-final-system-verification-${{ github.sha }}
          path: |
            docs/system-verification-latest.md
            system-verification-report.json
          if-no-files-found: warn
