      - name: Remove temporary repair workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f             .github/workflows/apply-xpts-overhaul.yml             .github/workflows/apply-xpts-direct-v6.yml             .github/workflows/apply-xpts-direct-v7.yml             .github/workflows/apply-xpts-direct-v8.yml             .github/workflows/apply-xpts-direct-v9.yml             .github/workflows/restore-players-runtime-v10.yml             .github/workflows/apply-zeus-deep-repair-v11.yml
          rm -rf tools/xpts-overhaul

      - name: JavaScript syntax checks
        run: |
          node --check lib/projections.js
          node --check lib/engine/lineup_evidence.mjs
          node --check lib/server/fpl_brief_route.mjs
          node --check jobs/projections_cleanup.mjs
          node --check jobs/projections_run_v11_wrapper.mjs
          node --check tests/xpts_v11_contract.test.mjs

      - name: Run targeted xPTS and API contracts
        run: |
          node --test tests/xpts_v11_contract.test.mjs
          if [ -f tests/xpts_overhaul_contract.test.mjs ]; then
            node --test tests/xpts_overhaul_contract.test.mjs
          fi
          node -e 'import("./lib/server/fpl_brief_route.mjs").then(async (m) => { const r = await m.GET(new Request("http://localhost/api/brief?gw=1")); if (![200,401,503].includes(r.status)) process.exit(1); console.log("brief route status", r.status); })'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run full repository tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Verify final diff
        run: git diff --check

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes required. The v11 repair is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix projection coverage and FPL brief API"
          git push origin HEAD:main
