name: Restore Builder budget rules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore the existing 83m XI and 17m bench rules
        run: |
          git show c8c5e21880a7b4fbbf0d807fb4f79902945eead3:lib/solver/build-range.mjs > lib/solver/build-range.mjs
          git show c8c5e21880a7b4fbbf0d807fb4f79902945eead3:app/api/optimise/route.js > app/api/optimise/route.js
          rm -f tests/bench-boost-full-squad.test.mjs

          python - <<'PY'
          from pathlib import Path

          path = Path("app/builder/BuilderClient.jsx")
          text = path.read_text()

          old = '''      requiredStarterIdsForGw: () => locks,
              onlyFormationForGw: () => formationLocked ? squad.structure : null,
            });'''
          new = '''      requiredStarterIdsForGw: () => locks,
              onlyFormationForGw: () => formationLocked ? squad.structure : null,
              xiBudget: RULES.budget - 17,
              benchBudget: 17,
            });'''

          if text.count(old) < 2:
              raise SystemExit("Could not find both Builder optimisation blocks")

          text = text.replace(old, new, 2)
          path.write_text(text)
          PY

      - name: Verify targeted solver tests
        run: node --test tests/build-range.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/zeus-restore-builder-budget-rules.yml
          git add lib/solver/build-range.mjs app/api/optimise/route.js app/builder/BuilderClient.jsx tests/bench-boost-full-squad.test.mjs
          git commit -m "Restore Builder budget rules"
          git push
