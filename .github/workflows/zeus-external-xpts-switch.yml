name: Apply External xPTS Switch
run-name: Apply external GW1-GW8 xPTS · ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: zeus-external-xpts-switch
  cancel-in-progress: false

jobs:
  switch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create immutable pre-switch backup
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          backup_branch="backup/pre-external-xpts-${short_sha}"
          backup_tag="pre-external-xpts-${short_sha}"
          if ! git ls-remote --exit-code --heads origin "$backup_branch" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${backup_branch}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${backup_tag}" >/dev/null 2>&1; then
            git tag "$backup_tag" HEAD
            git push origin "refs/tags/${backup_tag}"
          fi
          echo "BACKUP_BRANCH=$backup_branch" >> "$GITHUB_ENV"
          echo "BACKUP_TAG=$backup_tag" >> "$GITHUB_ENV"
          echo "Backup branch: $backup_branch"
          echo "Backup tag: $backup_tag"

      - name: Install the external xPTS source switch
