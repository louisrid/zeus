      - name: Validate exact imported data behaviour
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/external_xpts.mjs
          node --check lib/projections.js
          node --check lib/server/load.mjs
          node --check lib/server/fpl_brief_api.mjs
          node --check app/api/brief/route.js
          node --check jobs/projections_run.mjs
          node --test tests/external-xpts.test.mjs
          grep -q 'process.env.ALLOW_INTERNAL_XPTS' jobs/projections_run.mjs
          if grep -q 'schedule:' .github/workflows/projections-run.yml; then
            echo "The internal projection workflow still has a schedule."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock=true --no-audit --no-fund
          fi

      - name: Build the production website
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: |
          set -euo pipefail
          npm run build

      - name: Commit and push the live switch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZEUS External xPTS Switch"
          git config user.email "actions@github.com"
          git add \
            config/external-xpts-2026-27.mjs \
            lib/external_xpts.mjs \
            lib/projections.js \
            lib/server/load.mjs \
            lib/server/fpl_brief_api.mjs \
            lib/solver/score.mjs \
            app/api/brief/route.js \
            app/api/optimise/route.js \
            app/builder/BuilderClient.jsx \
            app/players/page.jsx \
            app/squad/SquadClient.jsx \
            jobs/projections_run.mjs \
            .github/workflows/projections-run.yml \
            .github/workflows/presser-pull.yml \
            .github/workflows/zeus-release-check-v5.yml \
            docs/EXTERNAL_XPTS_MODE.md \
            tests/external-xpts.test.mjs
          if git diff --cached --quiet; then
            echo "No new changes were required."
          else
            git commit -m "Switch xPTS to external GW1-GW8 import"
            git push origin HEAD:main
          fi
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Published commit: $commit_sha"

      - name: Verify the deployed site and Letta API contract
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ vars.ZEUS_BASE_URL || 'https://zeus-teal.vercel.app' }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY || secrets.OPENWEBUI_API_KEY || secrets.FPL_BRIEF_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = String(process.env.ZEUS_BASE_URL || '').replace(/\/$/, '');
          const headers = { accept: 'application/json' };
          if (process.env.ZEUS_API_KEY) headers['x-api-key'] = process.env.ZEUS_API_KEY;
          const expected = [7.5, 7.2, 8.2, 6.9, 7.8, 6.3, 8.1, 6.7];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = '';

          for (let attempt = 1; attempt <= 45; attempt += 1) {
            try {
              const briefResponse = await fetch(`${base}/api/brief?format=json&gw=1`, {
                headers,
                cache: 'no-store',
              });
              const briefText = await briefResponse.text();
              last = `brief ${briefResponse.status}: ${briefText.slice(0, 500)}`;
              if (!briefResponse.ok) throw new Error(last);
              const brief = JSON.parse(briefText);
              const haaland = (brief.players || []).find((player) => player.name === 'Haaland');
              if (brief.model_version !== 'external-fplcopilot-2026-08-03') {
                throw new Error(`old deployment still active: ${brief.model_version}`);
              }
              if (!haaland || Number(haaland.xpts) !== 7.5 || Number(haaland.expected_minutes) !== 88) {
                throw new Error(`GW1 Haaland mismatch: ${JSON.stringify(haaland)}`);
              }
              if (!Array.isArray(brief.available_gameweeks) || brief.available_gameweeks.join(',') !== '1,2,3,4,5,6,7,8') {
                throw new Error(`gameweek window mismatch: ${JSON.stringify(brief.available_gameweeks)}`);
              }

              const seriesResponse = await fetch(`${base}/api/brief?view=xpts&player=Haaland&gw_from=1&gw_to=8&limit=100`, {
                headers,
                cache: 'no-store',
              });
              const seriesText = await seriesResponse.text();
              last = `series ${seriesResponse.status}: ${seriesText.slice(0, 500)}`;
              if (!seriesResponse.ok) throw new Error(last);
              const series = JSON.parse(seriesText);
              const values = (series.projections || [])
                .filter((row) => row.name === 'Haaland')
                .sort((a, b) => a.gw - b.gw)
                .map((row) => Number(row.xpts));
              if (JSON.stringify(values) !== JSON.stringify(expected)) {
                throw new Error(`Haaland series mismatch: ${JSON.stringify(values)}`);
              }

              const disabledResponse = await fetch(`${base}/api/brief?view=xpts&gw_from=9&gw_to=9`, {
                headers,
                cache: 'no-store',
              });
              if (disabledResponse.status !== 400) {
                throw new Error(`GW9 was not disabled: HTTP ${disabledResponse.status}`);
              }

              const fixtureResponse = await fetch(`${base}/api/brief?view=fixtures`, {
                headers,
                cache: 'no-store',
              });
              const fixtureText = await fixtureResponse.text();
              if (!fixtureResponse.ok) throw new Error(`fixtures ${fixtureResponse.status}: ${fixtureText.slice(0, 500)}`);
              const fixtureBody = JSON.parse(fixtureText);
              if (!Array.isArray(fixtureBody.fixtures) || fixtureBody.fixtures.length === 0) {
                throw new Error('fixture endpoint returned no fixtures');
              }

              console.log('Live site, external xPTS series, GW9 block and fixture tools all passed.');
              process.exit(0);
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
              console.log(`Waiting for deployment, attempt ${attempt}/45: ${last}`);
              await sleep(20000);
            }
          }
          throw new Error(`The live deployment did not pass verification: ${last}`);
          NODE

      - name: Final state
        shell: bash
        run: |
          echo "External xPTS mode is live."
          echo "Backup branch: $BACKUP_BRANCH"
          echo "Backup tag: $BACKUP_TAG"
          echo "GW1-GW8 use the imported values. GW9-GW38 are disabled."
