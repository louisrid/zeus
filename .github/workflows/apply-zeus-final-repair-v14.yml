          PAYLOAD
          base64 --decode /tmp/zeus-v14/payload.b64 > /tmp/zeus-v14/payload.tar.gz
          echo "3b3afd6cf91e67682759bdf481318663edf42cb7354fe5aa995990d41b6b1082  /tmp/zeus-v14/payload.tar.gz" | sha256sum -c -
          mkdir -p /tmp/zeus-v14/payload
          tar -xzf /tmp/zeus-v14/payload.tar.gz -C /tmp/zeus-v14/payload
          python3 -m py_compile /tmp/zeus-v14/payload/apply_direct_v14.py
          python3 /tmp/zeus-v14/payload/apply_direct_v14.py

      - name: Prove no workflow or browser-runtime file was changed
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/zeus-v14/workflows.after.sha
          sha256sum lib/projections.js > /tmp/zeus-v14/browser-runtime.after.sha
          diff -u /tmp/zeus-v14/workflows.before.sha /tmp/zeus-v14/workflows.after.sha
          diff -u /tmp/zeus-v14/browser-runtime.before.sha /tmp/zeus-v14/browser-runtime.after.sha
          if git diff --name-only -- .github/workflows | grep -q .; then
            echo "Refusing to continue because a workflow file changed"
            git diff --name-status -- .github/workflows
            exit 1
          fi

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/engine/lineup_evidence.mjs
          node --check lib/projection_generation.mjs
          node --check lib/server/fpl_brief_api.mjs
          node --check jobs/projection_integrity_v14.mjs
          node --check tests/xpts_v14_contract.test.mjs

      - name: Targeted regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/xpts_v14_contract.test.mjs
          if [ -f tests/xpts_overhaul_contract.test.mjs ]; then
            node --test tests/xpts_overhaul_contract.test.mjs
          fi

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run all repository tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Final pre-push safety check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/zeus-v14/changed-files.txt
          echo "Files to commit:"
          cat /tmp/zeus-v14/changed-files.txt
          if grep -E '^\.github/workflows/' /tmp/zeus-v14/changed-files.txt; then
            echo "Refusing to push any workflow-file change"
            exit 1
          fi

      - name: Commit and push normal code files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
              echo "Workflow file entered the staged commit. Aborting."
              exit 1
            fi
            git commit -m "Fix projection coverage, stale rows and FPL brief"
            git push origin HEAD:main
          else
            echo "Code repair is already installed."
          fi
          git rev-parse HEAD > /tmp/zeus-v14/target-sha.txt

      - name: Run fresh projections and wait for completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_file="$(cat /tmp/zeus-v14/projection-workflow.txt)"
          target_sha="$(cat /tmp/zeus-v14/target-sha.txt)"
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" -f ref=main

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"${target_sha}\" and .created_at >= \"${dispatch_started}\") | .id" | head -n 1 || true)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "The projections workflow was dispatched but its run could not be identified."
            exit 1
          fi
          echo "Waiting for projections run ${run_id}"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Remove stale rows and validate the new projections
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SB_SERVICE_ROLE_KEY: ${{ secrets.SB_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          node jobs/projection_integrity_v14.mjs

      - name: Upload final integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-integrity-v14
          path: projection-integrity-v14-report.json
          if-no-files-found: ignore
