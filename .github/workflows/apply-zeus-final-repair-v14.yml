name: Apply Zeus final repair v14

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate projections workflow and protect every workflow file
        shell: bash
        run: |
          set -euo pipefail
          projection_workflow=""
          for candidate in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$candidate" ] || continue
            case "$(basename "$candidate")" in
              apply-zeus*|apply-xpts*|projection-integrity*|restore-players-runtime*) continue ;;
            esac
            if grep -q 'jobs/projections_run.mjs\|projections_run.mjs' "$candidate"; then
              projection_workflow="$candidate"
              break
            fi
          done
          if [ -z "$projection_workflow" ]; then
            for candidate in .github/workflows/*projection*run*.yml .github/workflows/*projection*run*.yaml; do
              [ -f "$candidate" ] || continue
              projection_workflow="$candidate"
              break
            done
          fi
          if [ -z "$projection_workflow" ]; then
            echo "Could not locate the existing projections-run workflow"
            exit 1
          fi
          grep -q 'workflow_dispatch' "$projection_workflow"
          mkdir -p /tmp/zeus-v14
          basename "$projection_workflow" > /tmp/zeus-v14/projection-workflow.txt
          find .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/zeus-v14/workflows.before.sha
          sha256sum lib/projections.js > /tmp/zeus-v14/browser-runtime.before.sha
          echo "Using $(basename "$projection_workflow")"

