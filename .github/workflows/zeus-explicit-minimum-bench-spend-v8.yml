name: ZEUS Explicit Minimum Bench Spend V8

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeus-explicit-minimum-bench-spend-v8
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce an explicit minimum bench-spend floor
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/minimum-bench-spend.mjs <<'JS'
          const own = (value, key) => Object.prototype.hasOwnProperty.call(value || {}, key);

          export function parseMinimumBenchSpend(body, {
            budget = 100,
            required = false,
            defaultValue = 17,
          } = {}) {
            const input = body && typeof body === "object" ? body : {};
            const hasPreferred = own(input, "minimum_bench_spend");
            const hasLegacy = own(input, "bench_budget");

            if (required && !hasPreferred && !hasLegacy) {
              return {
                ok: false,
                error: "minimum_bench_spend is required. It is a floor: the four-player bench may cost this amount or more.",
              };
            }

            const preferred = hasPreferred ? Number(input.minimum_bench_spend) : null;
            const legacy = hasLegacy ? Number(input.bench_budget) : null;
            if (hasPreferred && hasLegacy
              && Number.isFinite(preferred) && Number.isFinite(legacy)
              && Math.abs(preferred - legacy) > 1e-9) {
              return {
                ok: false,
                error: "minimum_bench_spend and legacy bench_budget conflict. Supply one minimum value.",
              };
            }

            const value = hasPreferred ? preferred : hasLegacy ? legacy : Number(defaultValue);
            const totalBudget = Number(budget);
            if (!Number.isFinite(value) || value < 0 || !Number.isFinite(totalBudget) || value > totalBudget) {
              return {
                ok: false,
                error: "minimum_bench_spend must be between 0 and the total budget.",
              };
            }

            return {
              ok: true,
              value,
              source: hasPreferred ? "minimum_bench_spend" : hasLegacy ? "bench_budget" : "default",
              rule: "at_least",
            };
          }
          JS

          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              return text.replace(old, new, 1)

          # Exact squad endpoint: preferred clear name, legacy alias accepted, £17 default retained
          # only for older app callers. The response always names the rule as a minimum floor.
          path = Path("app/api/exact-squad/route.js")
          text = path.read_text()
          text = replace_once(
              text,
              'import { buildExactSquadForRange } from "../../../lib/server/exact-range-optimiser.mjs";\n',
              'import { buildExactSquadForRange } from "../../../lib/server/exact-range-optimiser.mjs";\n'
              'import { parseMinimumBenchSpend } from "../../../lib/minimum-bench-spend.mjs";\n',
              "exact-squad parser import",
          )
          text = replace_once(
              text,
              '    const budget = finite(body?.budget, 100);\n'
              '    const benchBudget = finite(body?.bench_budget, 17);\n'
              '    if (benchBudget < 0 || benchBudget > budget) {\n'
              '      return Response.json({ ok: false, error: "bench_budget must be between 0 and the total budget." }, { status: 400 });\n'
              '    }\n',
              '    const budget = finite(body?.budget, 100);\n'
              '    const minimumResult = parseMinimumBenchSpend(body, {\n'
              '      budget,\n'
              '      required: false,\n'
              '      defaultValue: 17,\n'
              '    });\n'
              '    if (!minimumResult.ok) return Response.json(minimumResult, { status: 400 });\n'
              '    const minimumBenchSpend = minimumResult.value;\n',
              "exact-squad minimum parser",
          )
          text = replace_once(
              text,
              '      benchBudget,\n',
              '      benchBudget: minimumBenchSpend,\n',
              "exact-squad optimiser minimum",
          )
          text = replace_once(
              text,
              '    return Response.json(result, { headers: { "cache-control": "no-store" } });\n',
              '    return Response.json({\n'
              '      ...result,\n'
              '      minimum_bench_spend: minimumBenchSpend,\n'
              '      bench_spend_rule: "at_least",\n'
              '      bench_spend_can_exceed_minimum: true,\n'
              '    }, { headers: { "cache-control": "no-store" } });\n',
              "exact-squad response echo",
          )
          path.write_text(text)

          # Bench Boost comparison: the user-specified minimum is mandatory. No silent £17 fallback
          # is allowed because this endpoint can save replacements and delete current plans.
          path = Path("app/api/benchboost-compare/route.js")
          text = path.read_text()
          text = replace_once(
              text,
              'import { validatePlanWrite } from "../../../lib/plan-write-validation.mjs";\n',
              'import { validatePlanWrite } from "../../../lib/plan-write-validation.mjs";\n'
              'import { parseMinimumBenchSpend } from "../../../lib/minimum-bench-spend.mjs";\n',
              "comparison parser import",
          )
          text = replace_once(
              text,
              '  const budget = Number(body?.budget ?? 100);\n'
              '  const benchBudget = Number(body?.bench_budget ?? 17);\n'
              '  if (!Number.isInteger(gwFrom) || !Number.isInteger(gwTo) || gwFrom < 1 || gwTo > 8 || gwTo < gwFrom) {\n'
              '    return { ok: false, error: "gw_from and gw_to must define an inclusive range within GW1-GW8." };\n'
              '  }\n'
              '  if (!Number.isFinite(budget) || budget <= 0) return { ok: false, error: "budget must be a positive number." };\n'
              '  if (!Number.isFinite(benchBudget) || benchBudget < 0 || benchBudget > budget) {\n'
              '    return { ok: false, error: "bench_budget must be between 0 and the total budget." };\n'
              '  }\n',
              '  const budget = Number(body?.budget ?? 100);\n'
              '  if (!Number.isInteger(gwFrom) || !Number.isInteger(gwTo) || gwFrom < 1 || gwTo > 8 || gwTo < gwFrom) {\n'
              '    return { ok: false, error: "gw_from and gw_to must define an inclusive range within GW1-GW8." };\n'
              '  }\n'
              '  if (!Number.isFinite(budget) || budget <= 0) return { ok: false, error: "budget must be a positive number." };\n'
              '  const minimumResult = parseMinimumBenchSpend(body, { budget, required: true });\n'
              '  if (!minimumResult.ok) return minimumResult;\n'
              '  const minimumBenchSpend = minimumResult.value;\n',
              "comparison required minimum parser",
          )
          text = replace_once(
              text,
              '  return { ok: true, gwFrom, gwTo, budget, benchBudget, candidateChipGameweeks, saveNames, deletePlanIds, excludePlayerIds };\n',
              '  return { ok: true, gwFrom, gwTo, budget, minimumBenchSpend, candidateChipGameweeks, saveNames, deletePlanIds, excludePlayerIds };\n',
              "comparison parsed minimum",
          )
          text = replace_once(
              text,
              'function validateBuild(build, budget, benchBudget, gwFrom, gwTo) {',
              'function validateBuild(build, budget, minimumBenchSpend, gwFrom, gwTo) {',
              "comparison validator signature",
          )
          text = replace_once(
              text,
              '    if (xiCost > budget - benchBudget + 1e-9) errors.push(`GW${gw} XI costs ${xiCost.toFixed(1)}, above ${(budget - benchBudget).toFixed(1)}`);\n'
              '    if (benchCost < benchBudget - 1e-9) errors.push(`GW${gw} bench costs ${benchCost.toFixed(1)}, below ${benchBudget.toFixed(1)}`);\n',
              '    if (xiCost > budget - minimumBenchSpend + 1e-9) errors.push(`GW${gw} XI costs ${xiCost.toFixed(1)}, above the derived ceiling ${(budget - minimumBenchSpend).toFixed(1)}`);\n'
              '    if (benchCost < minimumBenchSpend - 1e-9) errors.push(`GW${gw} bench costs ${benchCost.toFixed(1)}, below the required minimum ${minimumBenchSpend.toFixed(1)}`);\n',
              "comparison minimum validation",
          )
          text = replace_once(
              text,
              'function publicBuild(shared, chipGw, budget, benchBudget, gwFrom, gwTo) {',
              'function publicBuild(shared, chipGw, budget, minimumBenchSpend, gwFrom, gwTo) {',
              "comparison public build signature",
          )
          text = replace_once(
              text,
              '    constraints: {\n'
              '      total_budget: budget,\n'
              '      xi_budget: budget - benchBudget,\n'
              '      bench_budget: benchBudget,\n'
              '      bench_budget_rule: "minimum",\n'
              '      max_per_club: 3,\n',
              '    constraints: {\n'
              '      total_budget: budget,\n'
              '      minimum_bench_spend: minimumBenchSpend,\n'
              '      bench_spend_rule: "at_least",\n'
              '      bench_spend_can_exceed_minimum: true,\n'
              '      derived_xi_ceiling: budget - minimumBenchSpend,\n'
              '      max_per_club: 3,\n',
              "comparison public constraint names",
          )
          text = replace_once(
              text,
              '        budget: parsed.budget,\n'
              '        benchBudget: parsed.benchBudget,\n'
              '        maxPerClub: 3,\n',
              '        budget: parsed.budget,\n'
              '        benchBudget: parsed.minimumBenchSpend,\n'
              '        maxPerClub: 3,\n',
              "comparison optimiser minimum",
          )
          text = replace_once(
              text,
              '      const build = publicBuild(shared, chipGw, parsed.budget, parsed.benchBudget, parsed.gwFrom, parsed.gwTo);\n'
              '      const validation = validateBuild(build, parsed.budget, parsed.benchBudget, parsed.gwFrom, parsed.gwTo);\n',
              '      const build = publicBuild(shared, chipGw, parsed.budget, parsed.minimumBenchSpend, parsed.gwFrom, parsed.gwTo);\n'
              '      const validation = validateBuild(build, parsed.budget, parsed.minimumBenchSpend, parsed.gwFrom, parsed.gwTo);\n',
              "comparison build validation calls",
          )
          text = replace_once(
              text,
              '    const comparison = compareBenchBoostBuilds(builds);\n',
              '    const wrongMinimum = builds.filter((build) =>\n'
              '      Number(build?.constraints?.minimum_bench_spend) !== parsed.minimumBenchSpend\n'
              '      || build?.constraints?.bench_spend_rule !== "at_least"\n'
              '      || build?.constraints?.bench_spend_can_exceed_minimum !== true);\n'
              '    if (wrongMinimum.length) {\n'
              '      return json({\n'
              '        ok: false,\n'
              '        error: "The backend did not preserve the explicitly requested minimum bench-spend floor. Nothing was saved or deleted.",\n'
              '      }, 422);\n'
              '    }\n'
              '\n'
              '    const comparison = compareBenchBoostBuilds(builds);\n',
              "comparison pre-persistence minimum guard",
          )
          text = replace_once(
              text,
              '      candidate_chip_gameweeks: builds.map((build) => build.chip_gw),\n'
              '      bench_budget: parsed.benchBudget,\n'
              '      excluded_player_ids: parsed.excludePlayerIds,\n',
              '      candidate_chip_gameweeks: builds.map((build) => build.chip_gw),\n'
              '      minimum_bench_spend: parsed.minimumBenchSpend,\n'
              '      bench_spend_rule: "at_least",\n'
              '      bench_spend_can_exceed_minimum: true,\n'
              '      excluded_player_ids: parsed.excludePlayerIds,\n',
              "comparison objective minimum echo",
          )
          text = replace_once(
              text,
              '      gw_to: parsed.gwTo,\n'
              '      bench_budget: parsed.benchBudget,\n'
              '      excluded_player_ids: parsed.excludePlayerIds,\n',
              '      gw_to: parsed.gwTo,\n'
              '      minimum_bench_spend: parsed.minimumBenchSpend,\n'
              '      bench_spend_rule: "at_least",\n'
              '      bench_spend_can_exceed_minimum: true,\n'
              '      excluded_player_ids: parsed.excludePlayerIds,\n',
              "comparison response minimum echo",
          )
          path.write_text(text)

          # Builder: send the unambiguous preferred field and describe the value as a floor, never a cap.
          path = Path("app/builder/BuilderClient.jsx")
          text = path.read_text()
          text = replace_once(
              text,
              '        bench_budget: benchBudget,\n',
              '        minimum_bench_spend: benchBudget,\n',
              "Builder preferred request field",
          )
          text = replace_once(
              text,
              '<label htmlFor="bench-budget" style={code(12)}>MIN BENCH SPEND</label>',
              '<label htmlFor="bench-budget" style={code(12)}>MINIMUM BENCH SPEND</label>',
              "Builder minimum label",
          )
          text = replace_once(
              text,
              '<span style={code(12)}>£m · XI max {(RULES.budget - benchBudget).toFixed(1)}</span>',
              '<span style={code(12)}>£m minimum across the four bench players · spending more is allowed</span>',
              "Builder floor explanation",
          )
          path.write_text(text)

          # User-facing report: state only the minimum/floor semantics.
          path = Path("lib/benchboost-comparison.mjs")
          text = path.read_text()
          text = replace_once(
              text,
              '  lines.push(`Minimum bench spend: £${n1(applied.bench_budget)}m in every gameweek. Maximum XI spend: £${n1(applied.xi_budget)}m.`);\n',
              '  lines.push(`Minimum combined bench spend: at least £${n1(applied.minimum_bench_spend)}m in every gameweek. This is a floor, not a cap; the bench may cost more.`);\n',
              "comparison report floor wording",
          )
          path.write_text(text)

          # Letta operating memory: preserve the full minimum-floor meaning and fail safely.
          path = Path("docs/LETTA_FINAL_OPERATING_PROMPT.md")
          text = path.read_text()
          old = (
              "Map the user's stated minimum bench spend to the exact optimiser's bench minimum. "
              "The maximum XI spend is the total budget minus that minimum. Never silently fall back "
              "to £17.0m when the user supplied another value.\n\n"
              "Treat every “do not include”, “exclude” or “avoid” instruction as a hard exclusion from "
              "every candidate build. Resolve each name against the current player list. If a name is "
              "missing or ambiguous, explain that exact ambiguity before running; never guess or silently "
              "drop an exclusion.\n"
          )
          new = (
              "Map the user's stated minimum bench spend to the exact optimiser's explicit minimum "
              "bench-spend floor. “Minimum £16.5m” means the four bench players must cost £16.5m or "
              "more in every gameweek. It is not an exact target and it is never a maximum; spending "
              "more on the bench is allowed when that maximises the full objective.\n\n"
              "For any Bench Boost comparison that can save or replace plans, the minimum bench spend "
              "must be sent explicitly. The backend intentionally rejects a comparison when the minimum "
              "is omitted, so never retry without it and never allow a silent £17.0m fallback. Before "
              "claiming success, verify that the response echoes the exact requested minimum, states the "
              "rule as “at least”, and confirms the bench may exceed the minimum. If that proof is absent, "
              "stop and ensure nothing is saved or deleted.\n\n"
              "Do not claim that the endpoint lacks custom-minimum support merely because a response "
              "shows £17.0m. That means the requested minimum was omitted or the wrong deployment was "
              "called. Surface that exact failure instead of accepting or replacing plans.\n\n"
              "Treat every “do not include”, “exclude” or “avoid” instruction as a hard exclusion from "
              "every candidate build. Resolve each name against the current player list. If a name is "
              "missing or ambiguous, explain that exact ambiguity before running; never guess or silently "
              "drop an exclusion.\n"
          )
          text = replace_once(text, old, new, "Letta minimum-floor contract")
          path.write_text(text)
          PY

          cat > tests/minimum-bench-spend-v8.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { parseMinimumBenchSpend } from "../lib/minimum-bench-spend.mjs";
          import { renderBenchBoostReport } from "../lib/benchboost-comparison.mjs";

          test("preferred minimum field is parsed as an at-least floor", () => {
            assert.deepEqual(
              parseMinimumBenchSpend({ minimum_bench_spend: 16.5 }, { budget: 100, required: true }),
              { ok: true, value: 16.5, source: "minimum_bench_spend", rule: "at_least" },
            );
          });

          test("legacy field remains accepted but an omitted comparison minimum fails", () => {
            assert.equal(
              parseMinimumBenchSpend({ bench_budget: 16.5 }, { budget: 100, required: true }).value,
              16.5,
            );
            const missing = parseMinimumBenchSpend({}, { budget: 100, required: true });
            assert.equal(missing.ok, false);
            assert.match(missing.error, /required/);
            assert.match(missing.error, /floor/);
          });

          test("conflicting aliases and invalid minima are rejected", () => {
            assert.equal(
              parseMinimumBenchSpend(
                { minimum_bench_spend: 16.5, bench_budget: 17 },
                { budget: 100, required: true },
              ).ok,
              false,
            );
            assert.equal(
              parseMinimumBenchSpend({ minimum_bench_spend: 101 }, { budget: 100, required: true }).ok,
              false,
            );
          });

          test("comparison cannot silently default to 17 before destructive persistence", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /required: true/);
            assert.match(source, /minimum_bench_spend/);
            assert.match(source, /bench_spend_rule: "at_least"/);
            assert.match(source, /Nothing was saved or deleted/);
            assert.doesNotMatch(source, /body\?\.bench_budget \?\? 17/);
            assert.doesNotMatch(source, /bench_budget: parsed\.benchBudget/);
          });

          test("Builder submits the minimum and explains that more spending is allowed", () => {
            const source = readFileSync("app/builder/BuilderClient.jsx", "utf8");
            assert.match(source, /minimum_bench_spend: benchBudget/);
            assert.match(source, /MINIMUM BENCH SPEND/);
            assert.match(source, /spending more is allowed/);
            assert.doesNotMatch(source, /XI max/);
          });

          test("report calls the value a floor rather than a maximum", () => {
            const report = renderBenchBoostReport({
              gwFrom: 1,
              gwTo: 3,
              builds: [{
                chip_gw: 1,
                solver: { status: "OPTIMAL", mip_gap: 0 },
                weekly: [],
                total: { net_xpts: 0 },
                objective: { arithmetic_verified: true, gw_from: 1, gw_to: 3 },
                constraints: {
                  minimum_bench_spend: 16.5,
                  bench_spend_rule: "at_least",
                  bench_spend_can_exceed_minimum: true,
                },
                players: [],
              }],
            });
            assert.match(report, /at least £16\.5m/);
            assert.match(report, /floor, not a cap/);
            assert.match(report, /bench may cost more/);
            assert.doesNotMatch(report, /Maximum XI spend/);
          });

          test("Letta contract forbids exact-target, maximum and silent fallback interpretations", () => {
            const source = readFileSync("docs/LETTA_FINAL_OPERATING_PROMPT.md", "utf8");
            assert.match(source, /It is not an exact target and it is never a maximum/);
            assert.match(source, /minimum bench spend must be sent explicitly/);
            assert.match(source, /never allow a silent £17\.0m fallback/);
            assert.match(source, /Do not claim that the endpoint lacks custom-minimum support/);
          });
          JS

          cat > tests/configurable-optimiser-controls.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          test("exact squad accepts a caller-selected minimum and echoes floor semantics", () => {
            const source = readFileSync("app/api/exact-squad/route.js", "utf8");
            assert.match(source, /parseMinimumBenchSpend/);
            assert.match(source, /minimum_bench_spend: minimumBenchSpend/);
            assert.match(source, /bench_spend_rule: "at_least"/);
            assert.match(source, /benchBudget: minimumBenchSpend/);
          });

          test("comparison requires the selected minimum and preserves hard exclusions", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /parseMinimumBenchSpend/);
            assert.match(source, /required: true/);
            assert.match(source, /exclude_player_ids/);
            assert.match(source, /ignores: parsed\.excludePlayerIds/);
            assert.match(source, /benchBudget: parsed\.minimumBenchSpend/);
            assert.match(source, /validateBuild\(build, parsed\.budget, parsed\.minimumBenchSpend/);
            assert.match(source, /Unknown excluded player IDs/);
            assert.doesNotMatch(source, /benchCost < 17/);
          });

          test("Builder uses one selected minimum for every optimiser path", () => {
            const source = readFileSync("app/builder/BuilderClient.jsx", "utf8");
            assert.match(source, /MINIMUM BENCH SPEND/);
            assert.match(source, /minimum_bench_spend: benchBudget/);
            assert.equal((source.match(/xiBudget: RULES\.budget - benchBudget/g) || []).length, 2);
            assert.equal((source.match(/\n\s+benchBudget,\n/g) || []).length >= 2, true);
            assert.match(source, /formationLocked, benchBudget\]/);
            assert.doesNotMatch(source, /xiBudget: RULES\.budget - 17/);
            assert.doesNotMatch(source, /benchBudget: 17/);
          });

          test("Letta instructions keep natural-language resolution and full minimum meaning", () => {
            const source = readFileSync("docs/LETTA_FINAL_OPERATING_PROMPT.md", "utf8");
            assert.match(source, /Natural-language optimiser controls/);
            assert.match(source, /Do not ask the user for API fields, JSON, player IDs or saved-plan IDs/);
            assert.match(source, /It is not an exact target and it is never a maximum/);
            assert.match(source, /Speak to the user in natural language/);
          });
          JS

      - name: Syntax and static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/minimum-bench-spend.mjs
          node --check app/api/exact-squad/route.js
          node --check app/api/benchboost-compare/route.js
          node --check lib/benchboost-comparison.mjs
          grep -F 'required: true' app/api/benchboost-compare/route.js
          grep -F 'minimum_bench_spend: parsed.minimumBenchSpend' app/api/benchboost-compare/route.js
          grep -F 'bench_spend_rule: "at_least"' app/api/benchboost-compare/route.js
          grep -F 'minimum_bench_spend: benchBudget' app/builder/BuilderClient.jsx
          grep -F 'spending more is allowed' app/builder/BuilderClient.jsx
          grep -F 'floor, not a cap' lib/benchboost-comparison.mjs
          ! grep -F 'body?.bench_budget ?? 17' app/api/benchboost-compare/route.js
          ! grep -F 'Maximum XI spend' lib/benchboost-comparison.mjs
          ! grep -F 'XI max' app/builder/BuilderClient.jsx

      - name: Focused regression tests
        run: |
          node --test \
            tests/minimum-bench-spend-v8.test.mjs \
            tests/configurable-optimiser-controls.test.mjs \
            tests/bench-boost-flexible-minimum.test.mjs \
            tests/bench-minimum.test.mjs \
            tests/benchboost-comparison.test.mjs \
            tests/benchboost-route-contract.test.mjs \
            tests/exact-global-build.test.mjs \
            tests/exact-save-pipeline.test.mjs \
            tests/plan-write-validation.test.mjs \
            tests/plan-range.test.mjs \
            tests/plan.test.mjs

      - name: Complete test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Final source integrity check
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'minimum_bench_spend is required' lib/minimum-bench-spend.mjs
          grep -F 'required: true' app/api/benchboost-compare/route.js
          grep -F 'bench_spend_can_exceed_minimum: true' app/api/benchboost-compare/route.js
          grep -F 'minimum_bench_spend: benchBudget' app/builder/BuilderClient.jsx
          grep -F 'floor, not a cap' lib/benchboost-comparison.mjs
          ! grep -F 'body?.bench_budget ?? 17' app/api/benchboost-compare/route.js
          ! grep -F 'Maximum XI spend' lib/benchboost-comparison.mjs

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/exact-squad/route.js \
            app/api/benchboost-compare/route.js \
            app/builder/BuilderClient.jsx \
            lib/minimum-bench-spend.mjs \
            lib/benchboost-comparison.mjs \
            docs/LETTA_FINAL_OPERATING_PROMPT.md \
            tests/minimum-bench-spend-v8.test.mjs \
