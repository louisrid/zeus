name: history-load
on:
  # Every Tuesday at 05:05 UTC, after a normal weekend's gameweek has finished and the open dataset has
  # published it. The job upserts on (season, gw, player_name, element), so re-running is harmless and a
  # week that is not published yet is simply reported as excluded.
  schedule:
    - cron: "5 5 * * 2"
  workflow_dispatch: {}
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node jobs/history_load.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
