      - name: Remove superseded repair installers
        shell: bash
        run: |
          set -euo pipefail
          # Remove only the temporary repair files supplied in this chat.
          rm -f .github/workflows/apply-xpts-overhaul.yml
          rm -f .github/workflows/apply-xpts-direct-v6.yml
          rm -f .github/workflows/apply-xpts-direct-v7.yml
          rm -f .github/workflows/apply-xpts-direct-v8.yml
          rm -f .github/workflows/apply-xpts-direct-v9.yml
          rm -rf tools/xpts-overhaul

      - name: Check changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/engine/player_data_matcher.mjs
          node --check lib/engine/player_rate_resolver.mjs
          node --check lib/engine/lineup_sampler_v2.mjs
          node --check lib/engine/lineup_evidence.mjs
          node --check lib/engine/layer2_allocation.mjs
          node --check lib/engine/layer3_minutes.mjs
          node --check lib/engine/layer4_sim.mjs
          node --check jobs/projections_run.mjs
          node --check lib/solver/score.mjs
          node --check lib/projections.js

      - name: Run targeted xPTS contracts
        run: node --test tests/xpts_overhaul_contract.test.mjs

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run live regression files
        run: node --test tests/engine.test.mjs tests/minutes_contract.test.mjs tests/scoring.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Verify final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes required. The direct v9 overhaul is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix xPTS projection architecture"
          git push origin HEAD:main
