      - name: Validate scope and requested behaviour before installing anything
        shell: bash
        run: |
          set -euo pipefail

          allowed='^(app/globals\.css|app/page\.jsx|app/players/page\.jsx|components/BenchPlayerCard\.jsx|components/BuilderPitch\.jsx|components/Candidates\.jsx|components/Opp\.jsx|components/Pitch\.jsx|components/PlayerControls\.jsx|components/PlayerPlate\.jsx|lib/range-options\.mjs|tests/ui-consistency\.test\.mjs)$'

          git add \
            app/globals.css \
            app/page.jsx \
            app/players/page.jsx \
            components/BenchPlayerCard.jsx \
            components/BuilderPitch.jsx \
            components/Candidates.jsx \
            components/Opp.jsx \
            components/Pitch.jsx \
            components/PlayerControls.jsx \
            components/PlayerPlate.jsx \
            lib/range-options.mjs \
            tests/ui-consistency.test.mjs

          changed="$(git diff --cached --name-only)"
          printf '%s\n' "${changed}"
          unexpected="$(printf '%s\n' "${changed}" | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "Unexpected staged files:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "An existing workflow file was unexpectedly modified."
            exit 1
          fi

          test -f components/BenchPlayerCard.jsx
          test -f lib/range-options.mjs
          test -f tests/ui-consistency.test.mjs
          ! grep -q 'type="range"' components/PlayerControls.jsx
          grep -q 'step={0.5}' components/PlayerControls.jsx
          grep -q 'step={5}' components/PlayerControls.jsx
          grep -q 'BenchPlayerCard' components/Pitch.jsx
          grep -q 'BenchPlayerCard' components/BuilderPitch.jsx
          grep -q 'grid-template-columns: auto repeat(4, minmax(0, 1fr))' app/globals.css
          ! grep -q 'FixtureOutlook' app/page.jsx
          ! grep -q 'Easiest fixtures ahead' app/page.jsx
          grep -q 'window.setInterval' app/page.jsx
          grep -q 'templateSquad(core.players)' app/page.jsx
          grep -q 'range-select-bench-v1' app/page.jsx
          grep -q 'range-select-bench-v1' app/players/page.jsx

          # Explicitly prove that the Letta/API and external xPTS files were not touched.
          test -z "$(git diff --cached --name-only -- app/api lib/server lib/external_xpts.mjs config/external-xpts-2026-27.mjs jobs/projections_run.mjs)"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without creating repository noise
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock=false --no-audit --no-fund
            rm -f package-lock.json
          fi

      - name: Run full tests including new UI regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Build the complete production application
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: |
          set -euo pipefail
          npm run build

      - name: Confirm build left no accidental files or unstaged edits
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git add \
            app/globals.css \
            app/page.jsx \
            app/players/page.jsx \
            components/BenchPlayerCard.jsx \
            components/BuilderPitch.jsx \
            components/Candidates.jsx \
            components/Opp.jsx \
            components/Pitch.jsx \
            components/PlayerControls.jsx \
            components/PlayerPlate.jsx \
            lib/range-options.mjs \
            tests/ui-consistency.test.mjs

          unstaged="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "${unstaged}" ] || [ -n "${untracked}" ]; then
            echo "Unexpected repository changes remain after build."
            [ -z "${unstaged}" ] || { echo "Unstaged:"; printf '%s\n' "${unstaged}"; }
            [ -z "${untracked}" ] || { echo "Untracked:"; printf '%s\n' "${untracked}"; }
            exit 1
          fi

      - name: Commit and publish atomically to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          current_remote="$(git rev-parse origin/main)"
          if [ "${current_remote}" != "${BASE_SHA}" ]; then
            echo "main changed while this verified build was running. Nothing was pushed."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "The final UI fix is already present; no new commit is needed."
          else
            git commit -m "Fix range filters, compact benches and dashboard"
            git push origin HEAD:main
          fi

          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "Published commit: ${commit_sha}"

      - name: Refresh official FPL ownership and prices immediately
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "Immediate refresh secrets are unavailable; the existing six-hour fpl-pull schedule remains active."
            exit 0
          fi

          for attempt in 1 2 3; do
            if node jobs/fpl_bootstrap.mjs; then
              echo "Official prices, ownership, statuses and fixtures refreshed."
              exit 0
            fi
            echo "Refresh attempt ${attempt}/3 failed; retrying."
            sleep $((attempt * 15))
          done

          echo "::warning::The optional immediate data refresh failed after retries. The deployed code is unaffected and the existing six-hour refresh remains active."
          exit 0

      - name: Verify live pages, external xPTS and Letta fixture contract
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ vars.ZEUS_BASE_URL || 'https://zeus-teal.vercel.app' }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY || secrets.OPENWEBUI_API_KEY || secrets.FPL_BRIEF_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = String(process.env.ZEUS_BASE_URL || '').replace(/\/$/, '');
          const headers = { accept: 'application/json' };
          if (process.env.ZEUS_API_KEY) headers['x-api-key'] = process.env.ZEUS_API_KEY;
          const expectedHaaland = [7.5, 7.2, 8.2, 6.9, 7.8, 6.3, 8.1, 6.7];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = '';

          for (let attempt = 1; attempt <= 45; attempt += 1) {
            try {
              const [dashboardResponse, playersResponse, builderResponse, squadResponse] = await Promise.all([
                fetch(`${base}/`, { cache: 'no-store' }),
                fetch(`${base}/players`, { cache: 'no-store' }),
                fetch(`${base}/builder`, { cache: 'no-store' }),
                fetch(`${base}/squad`, { cache: 'no-store' }),
              ]);
              const [dashboardHtml, playersHtml] = await Promise.all([
                dashboardResponse.text(),
                playersResponse.text(),
              ]);

              if (!dashboardResponse.ok || !playersResponse.ok || !builderResponse.ok || !squadResponse.ok) {
                throw new Error(`page status: dashboard ${dashboardResponse.status}, players ${playersResponse.status}, builder ${builderResponse.status}, squad ${squadResponse.status}`);
              }
              if (!dashboardHtml.includes('range-select-bench-v1')) {
                throw new Error('new dashboard deployment marker is not live yet');
              }
              if (!playersHtml.includes('range-select-bench-v1')) {
                throw new Error('new players deployment marker is not live yet');
              }
              if (dashboardHtml.includes('Easiest fixtures ahead')) {
                throw new Error('removed dashboard fixture widget is still live');
              }

              const briefResponse = await fetch(`${base}/api/brief?format=json&gw=1`, { headers, cache: 'no-store' });
              const briefText = await briefResponse.text();
              if (!briefResponse.ok) throw new Error(`brief ${briefResponse.status}: ${briefText.slice(0, 350)}`);
              const brief = JSON.parse(briefText);
              if (brief.model_version !== 'external-fplcopilot-2026-08-03') {
                throw new Error(`external xPTS source changed unexpectedly: ${brief.model_version}`);
              }

              const seriesResponse = await fetch(`${base}/api/brief?view=xpts&player=Haaland&gw_from=1&gw_to=8&limit=100`, {
                headers, cache: 'no-store',
              });
              const seriesText = await seriesResponse.text();
              if (!seriesResponse.ok) throw new Error(`series ${seriesResponse.status}: ${seriesText.slice(0, 350)}`);
              const series = JSON.parse(seriesText);
              const values = (series.projections || [])
                .filter((row) => row.name === 'Haaland')
                .sort((a, b) => a.gw - b.gw)
                .map((row) => Number(row.xpts));
              if (JSON.stringify(values) !== JSON.stringify(expectedHaaland)) {
                throw new Error(`Haaland xPTS regression: ${JSON.stringify(values)}`);
              }

              const disabled = await fetch(`${base}/api/brief?view=xpts&gw_from=9&gw_to=9`, { headers, cache: 'no-store' });
              if (disabled.status !== 400) throw new Error(`GW9 is no longer disabled: HTTP ${disabled.status}`);

              const fixturesResponse = await fetch(`${base}/api/brief?view=fixtures`, { headers, cache: 'no-store' });
              const fixturesText = await fixturesResponse.text();
              if (!fixturesResponse.ok) throw new Error(`fixtures ${fixturesResponse.status}: ${fixturesText.slice(0, 350)}`);
              const fixtureBody = JSON.parse(fixturesText);
              if (!Array.isArray(fixtureBody.fixtures) || fixtureBody.fixtures.length === 0) {
                throw new Error('Letta fixture endpoint returned no fixtures');
              }

              console.log('Live UI, dashboard cleanup, external xPTS and Letta fixture tools all passed.');
              process.exit(0);
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
              console.log(`Waiting for verified Vercel deployment (${attempt}/45): ${last}`);
              await sleep(15000);
            }
          }

          throw new Error(`Live deployment did not pass complete verification: ${last}`);
          NODE

      - name: Write final summary
        shell: bash
        run: |
          {
            echo "## ZEUS final UI fix is live"
            echo ""
            echo "- Price filters: MIN/MAX dropdowns in £0.5m steps"
            echo "- Ownership filters: MIN/MAX dropdowns in 5% steps"
            echo "- Builder picker: same price dropdown system"
            echo "- Dashboard, Builder and Squad benches: one shared compact 4-card row"
            echo "- Dashboard fixture-outlook widget: removed only from the homepage"
            echo "- Template: recalculates from live ownership on load, focus and every 15 minutes"
            echo "- Official FPL data schedule: existing six-hour pull preserved"
            echo "- External GW1-GW8 xPTS and Letta fixture API: live verification passed"
            echo "- Backup branch: ${BACKUP_BRANCH}"
            echo "- Backup tag: ${BACKUP_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
