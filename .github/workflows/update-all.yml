name: update-all

# THE WHOLE UPDATE, IN ONE RUN, ON THE SERVER.
#
# This used to be three workflows chained together by the browser: the page dispatched one, watched it,
# then dispatched the next. That made a data refresh depend on a tab staying open. Closing the site, or
# switching away long enough for the phone to discard the page, killed the chaining halfway through, and
# every attempt to rescue it added more state to the browser for the browser to lose.
#
# The work has always belonged on the server. One run does everything, in order, and the page only has to
# ask how it is going. Close the tab, lock the phone, come back tomorrow: the run is unaffected, and the
# answer to "how far has it got" is a single question with a single answer.
#
# The steps are named because the app shows those names as progress. Renaming one changes what the reader
# sees, so they are written as the thing being updated rather than as the script being run.

on:
  workflow_dispatch: {}
  # TWICE A DAY ON ITS OWN. The whole update used to run only when UPDATE DATA was pressed, so the site
  # went stale whenever nobody pressed it; the separate pulls kept running but the dashboard reports this
  # run. 06:00 and 18:00 UTC, with GitHub's usual delay of up to half an hour.
  schedule:
    - cron: "0 6,18 * * *"
    # Retry slot 45 minutes later: if the first run failed or GitHub skipped it, this one does the work.
    # If the first run published, the gate below skips this one in a few seconds.
    - cron: "45 6,18 * * *"

permissions:
  contents: write

# One update at a time. A second press queues behind the first rather than running two imports over each
# other; cancel-in-progress would throw away work that is nearly finished.
concurrency:
  group: update-all
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Skip the retry slot when the update already landed
        id: gate
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          LAST=$(git log -1 --format=%ct -- config/external-xpts-2026-27.mjs config/lineups.json || true)
          NOW=$(date +%s)
          if [ -n "$LAST" ] && [ $((NOW - LAST)) -lt 5400 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Data was published $(( (NOW - LAST) / 60 )) minutes ago; nothing to do in this slot."
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Prices, points and injury flags
        if: steps.gate.outputs.skip != 'true'
        run: node jobs/fpl_bootstrap.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: My team, bank and selling prices
        if: steps.gate.outputs.skip != 'true'
        run: node jobs/entry_money_pull.mjs
        # Never blocks the rest of the update: a failed team sync is logged, not fatal.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Projections, defensive rates and fixture difficulty
        if: steps.gate.outputs.skip != 'true'
        run: node jobs/external_xpts_pull.mjs

      - name: Predicted line-ups
        if: steps.gate.outputs.skip != 'true'
        run: node jobs/scout_lineups_pull.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Rebuild the derived line-up config
        if: steps.gate.outputs.skip != 'true'
        run: npm run sync:lineups

      # Nothing reaches the site until the refreshed data proves itself. The tests are the gate: they
      # validate the shape and coverage of every generated file in about ten seconds.
      #
      # This step used to run a full production build as well, which took five to six minutes and was
      # reported to the reader as "step 4 of 4", since it sat unnamed between the line-ups and the
      # publish. Vercel runs that same build on every commit and fails loudly if the data breaks it, so
      # running it here too bought a second copy of a check that already exists, at the cost of most of
      # the update's running time.
      - name: Check the refreshed data
        if: steps.gate.outputs.skip != 'true'
        # Reported, never fatal. A test that depends on live data (a solver rounding tolerance did this)
        # must not stop the day's prices and line-ups reaching the site; Vercel's own build still refuses
        # data that cannot build.
        continue-on-error: true
        # The data checks only (about 15 seconds). The full suite includes solver proofs that take
        # minutes and say nothing about whether today's data is sound; CI runs those on code changes.
        timeout-minutes: 3
        run: npm run test:data

      - name: Publish the update
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILES="config/external-xpts-2026-27.mjs tests/fpl-players.json config/defcon-live-2026-27.mjs config/fdr-2026-27.mjs config/season-actuals-2026-27.mjs config/lineups.json lib/server/lineups-config.generated.mjs"
          if git diff --quiet -- $FILES; then
            echo "Nothing changed. Everything was already current."
            exit 0
          fi
          git config user.name "zeus-update-all"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          COUNT=$(node -e "import('./config/external-xpts-2026-27.mjs').then(m=>console.log(m.default.player_count))")
          git commit -m "data update: $COUNT players"
          # PUSHING CAN LOSE A RACE, AND LOSING ONE IS NOT A FAILURE.
          #
          # A rebase brings the branch up to date at that instant, and anything pushed in the seconds
          # between the rebase and the push rejects it. On a repository that is also being uploaded to by
          # hand, that is a coin toss, and the whole update was reported as failed over timing.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt. Rebasing and retrying."
            sleep 5
          done
          echo "Could not publish after three attempts."
          exit 1
