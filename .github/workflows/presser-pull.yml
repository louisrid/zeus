name: presser-pull
on:
  schedule:
    - cron: "40 7 * * 5"   # Friday morning team news
    - cron: "40 6 * * 6"   # Saturday morning, late team news before the deadline
    - cron: "40 9 * * 1"   # Monday morning, pressers ahead of midweek gameweeks
    - cron: "40 9 * * 2"   # Tuesday morning, final news before a midweek deadline
  workflow_dispatch: {}
jobs:
  pressers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node jobs/presser_pull.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # THE ENGINE RE-RUNS IMMEDIATELY AFTER TEAM NEWS LANDS.
      # It used to run Friday 07:23 and the news arrived 07:40, so every projection
      # shown over the weekend was priced on minutes the news had already contradicted.
      # Measured on 2025-26: knowing the named eleven cut the per-player bias from
      # -1.13 to -0.22 and nearly doubled ordering. Chaining it here means the numbers
      # on screen always postdate the latest news.
      - run: node jobs/projections_run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROJECTION_GWS: "3"
