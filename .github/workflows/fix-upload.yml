name: fix-upload
# ONE-CLICK REPAIR for an upload that landed in the wrong place.
#
# Dragging a zip's contents into GitHub keeps the folder it came in, so eleven files arrived at
# zeus-tuning/jobs/sweep.mjs instead of jobs/sweep.mjs. Nothing reads them there, which is why the model
# looked unchanged. This moves every file up one level, onto the path it was meant to have, and then removes
# the empty wrapper.
#
# It also deletes the stray github/workflows folder at the repo root. That one has no dot, so GitHub never
# read it and the workflow inside it has never run. It is a duplicate of .github/workflows/backtest-engine.yml.
#
# AND IT ADDS A .gitignore, WHICH THE REPO HAS NEVER HAD. The first attempt at this job failed on the push,
# because installing the packages to run the tests left a 125MB file in node_modules and a blanket "add
# everything" swept it into the commit. GitHub rejects any file over 100MB, so nothing landed at all. Two
# fixes: node_modules and the build folder are now ignored, and this job commits only the files it moved
# itself, never whatever else happens to be sitting in the folder.
#
# Nothing is committed unless the whole suite passes and the site still builds afterwards.
#
# Safe to run twice: with nothing to move it says so and stops.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move every uploaded file onto its real path
        # git mv stages each move as it goes, which is what lets the commit step below be specific rather
        # than sweeping up the whole folder.
        run: |
          set -e
          if [ ! -d zeus-tuning ]; then
            echo "No zeus-tuning folder, so there is nothing to move. Already repaired."
            exit 0
          fi
          for f in $(find zeus-tuning -type f | sort); do
            dest=${f#zeus-tuning/}
            mkdir -p "$(dirname "$dest")"
            git mv -f "$f" "$dest"
            echo "moved to $dest"
          done
          find zeus-tuning -type d -empty -delete 2>/dev/null || true

      - name: Remove the workflows folder that has no dot
        run: git rm -rq --ignore-unmatch github

      - name: Stop the packages folder ever reaching a commit again
        run: |
          set -e
          printf 'node_modules/\n.next/\n.vercel/\n*.log\n.DS_Store\n' > .gitignore
          git add .gitignore
          echo "Ignoring node_modules and the build folder from now on."

      - name: Refuse to commit anything that breaks the tree
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: And that it still builds
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Commit only what this job changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git diff --cached --quiet; then
            echo "Nothing to change."
          else
            git diff --cached --name-only
            git commit -qm "fix: move the uploaded files onto their real paths and add a gitignore"
            git push
          fi
