name: ZEUS final workflow cleanup and Letta tool fix
run-name: Remove obsolete installers and publish correct Letta tool message

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete ZEUS installer workflows
        shell: bash
        run: |
          set -euo pipefail

          obsolete=(
            .github/workflows/zeus-external-xpts-switch.yml
            .github/workflows/zeus-external-xpts-switch-v2.yml
            .github/workflows/zeus-external-xpts-switch-v3.yml
            .github/workflows/zeus-external-xpts-switch-v4.yml
            .github/workflows/zeus-final-ui-consistency-fix.yml
            .github/workflows/zeus-final-ui-consistency-fix-v2.yml
            .github/workflows/zeus-final-ui-consistency-fix-v3.yml
            .github/workflows/zeus-final-ui-consistency-fix-v4.yml
            .github/workflows/zeus-final-ui-consistency-fix-v5.yml
            .github/workflows/zeus-final-ui-consistency-fix-v6.yml
            .github/workflows/zeus-lineups-chips-letta-squads.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v2.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v3.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v4.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v5.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v6.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v7.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v8.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v9.yml
            .github/workflows/zeus-lineups-chips-letta-squads-v10.yml
          )

          for path in "${obsolete[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -- "$path"
            fi
          done

      - name: Replace the wrong Letta prompt with the actual tool setup message
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/LETTA_FINAL_OPERATING_PROMPT.md <<'EOF'
          # Message to send to the existing Letta chat

          Paste the message below into the existing Letta Code agent. This is a one-time tool setup request, not a replacement system prompt.

          ---

          The ZEUS backend now supports saved-squad range analysis, but this agent does not yet have the Letta tool that exposes it. Add and register that missing tool now.

          ## Missing tool

          Create or update a Letta tool named:

          `get_saved_fpl_squads`

          This tool is for Louis's real saved ZEUS squads and plans. It is not the same as `get_fpl_squad`, which builds a new theoretical squad from the full player pool.

          ## Where the backend already exists

          The backend is already deployed in ZEUS at:

          `GET /api/brief?view=squads&format=json`

          Use the same ZEUS base URL, API-key header, HTTP helper, timeout, retry logic and error handling already used by the existing ZEUS tools. Do not create a second hard-coded base URL or duplicate secret.

          The supporting server code is in the ZEUS GitHub repository at:

          - `app/api/brief/route.js`
          - `lib/server/squad-brief.mjs`
          - `lib/plan-range.mjs`
          - `lib/squad-range.mjs`

          Do not copy that JavaScript into Letta. The Letta tool should call the deployed HTTP endpoint.

          ## Tool inputs

          Register the tool with these inputs:

          - `gw_from`: required integer; first gameweek of the exact inclusive range
          - `gw_to`: required integer; last gameweek of the exact inclusive range
          - `plan`: optional string; `active`, a saved-plan name or a one-based visible index
          - `plan_id`: optional integer for an exact database plan ID
          - `simulate_chip`: optional string; `wildcard`, `benchboost` or `triplecaptain`
          - `simulate_gw`: optional integer; required when `simulate_chip` is used and must be inside the requested range
          - `include_players`: optional boolean; default `true`

          Always send:

          - `view=squads`
          - `format=json`
          - the exact `gw_from` and `gw_to`

          Do not send both `plan` and `plan_id` unless the existing ZEUS tool pattern explicitly supports that combination.

          ## Request examples

          Active saved plan across GW2-GW4:

          `/api/brief?view=squads&format=json&gw_from=2&gw_to=4&plan=active&include_players=true`

          Read-only Bench Boost simulation in GW3:

          `/api/brief?view=squads&format=json&gw_from=2&gw_to=4&plan=active&simulate_chip=benchboost&simulate_gw=3&include_players=true`

          ## Response handling

          Return the ZEUS JSON without silently dropping fields needed for analysis. Preserve at least:

          - `saved_squad_count`
          - `available_squads`
          - `selected_squad`
          - `selected_squad.weekly`
          - `selected_squad.range_total`
          - `selected_squad.range_simulation`
          - `selected_squad.range_error`
          - weekly formation, XI, captain, vice-captain, bench order, chip, transfers, transfer hit, gross xPTS and net xPTS
          - player `raw_imported_xpts`, effective `xpts` and role fields when players are included
          - `persisted`, which must remain `false` for simulations

          Surface ZEUS API errors directly. Do not replace unsupported ranges or failed requests with guesses.

          Team 4812 is hidden and must not be counted or presented as a saved squad; the endpoint already filters it.

          ## When to use it

          Use `get_saved_fpl_squads` when Louis asks about:

          - "my squad" or his active squad
          - his owned 15
          - saved plans
          - planned transfers
          - weekly line-ups, captains, benches or chips
          - projected totals over an exact range
          - read-only chip simulations

          Continue using `get_fpl_squad` only when Louis asks ZEUS to create a brand-new theoretical squad.

          ## Complete the setup

          1. Inspect the currently registered ZEUS tools and locate the shared HTTP helper/config used by `get_fpl_squad` or the current ZEUS data tool.
          2. Implement `get_saved_fpl_squads` using that same helper and deployed ZEUS base URL.
          3. Register or attach the tool to this existing agent.
          4. Reload the active tool list so it is callable in this chat.
          5. Run one small verification call only: retrieve the active saved squad for GW1-GW2 with `include_players=false`.
          6. Report the registered tool name, its input schema, the endpoint path used and whether that one verification call succeeded.

          Do not run a broad smoke-test suite. Do not rewrite the agent's system prompt or replace its persona. This task is only to add the missing ZEUS saved-squads tool and make it available in the current Letta chat.

          ---
          EOF

      - name: Update cleanup record and workflow inventory
        shell: bash
        run: |
          set -euo pipefail

          cat >> config/repository-cleanup-paths.txt <<'EOF'

          # Superseded ZEUS installer workflows removed after final range implementation
          .github/workflows/zeus-external-xpts-switch.yml
          .github/workflows/zeus-external-xpts-switch-v2.yml
          .github/workflows/zeus-external-xpts-switch-v3.yml
          .github/workflows/zeus-external-xpts-switch-v4.yml
          .github/workflows/zeus-final-ui-consistency-fix.yml
          .github/workflows/zeus-final-ui-consistency-fix-v2.yml
          .github/workflows/zeus-final-ui-consistency-fix-v3.yml
          .github/workflows/zeus-final-ui-consistency-fix-v4.yml
          .github/workflows/zeus-final-ui-consistency-fix-v5.yml
          .github/workflows/zeus-final-ui-consistency-fix-v6.yml
          .github/workflows/zeus-lineups-chips-letta-squads.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v2.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v3.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v4.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v5.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v6.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v7.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v8.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v9.yml
          .github/workflows/zeus-lineups-chips-letta-squads-v10.yml
          EOF

          awk '!seen[$0]++' config/repository-cleanup-paths.txt > /tmp/cleanup-paths.txt
          mv /tmp/cleanup-paths.txt config/repository-cleanup-paths.txt

          cat > docs/WORKFLOWS.md <<'EOF'
          # GitHub workflow inventory

          The obsolete uploaded ZEUS installer versions have been removed. The workflows below are the remaining operational or permanent repository workflows.

          ## Permanent and operational workflows

          - `archive-2526.yml`
          - `backtest-engine.yml`
          - `backtest.yml`
          - `baseline-gate.yml`
          - `ci.yml`
          - `component-attribution.yml`
          - `fpl-pull.yml`
          - `history-load.yml`
          - `minutes-scorecard.yml`
          - `odds-pull.yml`
          - `penalty-duty.yml`
          - `presser-pull.yml`
          - `projections-run.yml`
          - `reliability.yml`
          - `rival-pull.yml`
          - `sweep.yml`
          - `understat-pull.yml`
          - `zeus-release-check-v5.yml`

          ## Removed installer families

          The following one-off version families were removed after the final ZEUS range, fixture and saved-squad implementation passed its complete workflow:

          - `zeus-external-xpts-switch*.yml`
          - `zeus-final-ui-consistency-fix*.yml`
          - `zeus-lineups-chips-letta-squads*.yml`

          The cleanup workflow that performed this change deletes itself in the same commit.
          EOF

      - name: Verify the requested cleanup
        shell: bash
        run: |
          set -euo pipefail

          if find .github/workflows -maxdepth 1 -type f \( \
            -name 'zeus-external-xpts-switch*.yml' -o \
            -name 'zeus-final-ui-consistency-fix*.yml' -o \
            -name 'zeus-lineups-chips-letta-squads*.yml' \
          \) -print -quit | grep -q .; then
            echo 'Obsolete ZEUS installer workflows still remain.'
            exit 1
          fi

          grep -Fq 'This is a one-time tool setup request, not a replacement system prompt.' docs/LETTA_FINAL_OPERATING_PROMPT.md
          grep -Fq 'GET /api/brief?view=squads&format=json' docs/LETTA_FINAL_OPERATING_PROMPT.md
          grep -Fq 'Do not run a broad smoke-test suite.' docs/LETTA_FINAL_OPERATING_PROMPT.md
          ! grep -Fq 'Required smoke tests' docs/LETTA_FINAL_OPERATING_PROMPT.md

      - name: Commit cleanup and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch .github/workflows/zeus-final-cleanup-and-letta-tool-fix.yml
          git add docs/LETTA_FINAL_OPERATING_PROMPT.md docs/WORKFLOWS.md config/repository-cleanup-paths.txt .github/workflows

          if git diff --cached --quiet; then
            echo 'No cleanup changes were required.'
            exit 0
          fi

          git commit -m 'Remove obsolete ZEUS workflows and publish correct Letta tool setup'
          git push origin HEAD:main
