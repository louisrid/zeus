name: Restore Zeus pre-font-change files

on:
  push:
    paths:
      - ".github/workflows/restore-zeus.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact files from good commit
        run: |
          git checkout 5c257d64b287dd4873bd207c5f49e4dfc0fde55f --             app/globals.css             app/players/page.jsx             components/BuilderPitch.jsx             components/Candidates.jsx             components/PlayerPlate.jsx             lib/sorting.mjs             lib/ui.jsx             tests/design-system.test.mjs             tests/players.test.mjs

          rm -f .github/workflows/restore-zeus.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/globals.css             app/players/page.jsx             components/BuilderPitch.jsx             components/Candidates.jsx             components/PlayerPlate.jsx             lib/sorting.mjs             lib/ui.jsx             tests/design-system.test.mjs             tests/players.test.mjs             .github/workflows/restore-zeus.yml

          git commit -m "Restore pre-font-change Zeus files"
          git push origin HEAD:main
