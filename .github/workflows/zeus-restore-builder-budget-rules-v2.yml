name: Restore Builder budget rules V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zeus-restore-builder-budget-rules-v2.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore existing Builder budget rules
        run: |
          git show c8c5e21880a7b4fbbf0d807fb4f79902945eead3:lib/solver/build-range.mjs > lib/solver/build-range.mjs
          git show c8c5e21880a7b4fbbf0d807fb4f79902945eead3:app/api/optimise/route.js > app/api/optimise/route.js
          rm -f tests/bench-boost-full-squad.test.mjs

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/builder/BuilderClient.jsx")
          text = path.read_text()

          pattern = re.compile(
              r"^(?P<indent>[ \t]+)requiredStarterIdsForGw: \(\) => locks,\n"
              r"(?P=indent)onlyFormationForGw: \(\) => formationLocked \? squad\.structure : null,\n"
              r"(?P<close>[ \t]+)\}\);$",
              re.MULTILINE,
          )

          def replacement(match):
              indent = match.group("indent")
              close = match.group("close")
              return (
                  f"{indent}requiredStarterIdsForGw: () => locks,\n"
                  f"{indent}onlyFormationForGw: () => formationLocked ? squad.structure : null,\n"
                  f"{indent}xiBudget: RULES.budget - 17,\n"
                  f"{indent}benchBudget: 17,\n"
                  f"{close}}});"
              )

          text, count = pattern.subn(replacement, text)
          if count != 2:
              raise SystemExit(f"Expected 2 Builder optimisation blocks, found {count}")

          path.write_text(text)
          PY

      - name: Verify restored constraints
        run: |
          grep -n "xiBudget: RULES.budget - 17" app/builder/BuilderClient.jsx
          grep -n "benchBudget: 17" app/builder/BuilderClient.jsx
          grep -n "xiBudget: xiCap" lib/solver/build-range.mjs
          grep -n "benchBudget: benchCap" lib/solver/build-range.mjs

      - name: Run targeted solver tests
        run: node --test tests/build-range.test.mjs

      - name: Run production build
        run: npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/zeus-restore-builder-budget-rules-v2.yml
          git add -A
          git commit -m "Restore Builder budget rules"
          git push
