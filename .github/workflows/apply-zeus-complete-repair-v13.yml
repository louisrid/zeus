name: Apply Zeus complete repair v13

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decode, verify and apply the complete repair
        shell: bash
        run: |
          set -euo pipefail
          echo "Zeus complete repair v13"
          rm -rf /tmp/zeus-v13
          mkdir -p /tmp/zeus-v13

          projection_workflow=""
          for candidate in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$candidate" ] || continue
            case "$(basename "$candidate")" in
              apply-zeus*|apply-xpts*|projection-integrity*|restore-players-runtime*) continue ;;
            esac
            if grep -q 'jobs/projections_run.mjs\|projections_run.mjs' "$candidate"; then
              projection_workflow="$candidate"
              break
            fi
          done
          if [ -z "$projection_workflow" ]; then
            for candidate in .github/workflows/*projection*run*.yml .github/workflows/*projection*run*.yaml; do
              [ -f "$candidate" ] || continue
              projection_workflow="$candidate"
              break
            done
          fi
          if [ -z "$projection_workflow" ]; then
            echo "Could not locate the existing projections-run workflow"
            exit 1
          fi
          grep -q 'workflow_dispatch' "$projection_workflow"
          basename "$projection_workflow" > /tmp/zeus-v13/projection-workflow.txt
          sha256sum "$projection_workflow" > /tmp/zeus-v13/projection-workflow.before.sha
          sha256sum lib/projections.js > /tmp/zeus-v13/browser-runtime.before.sha

