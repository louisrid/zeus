      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/engine/lineup_evidence.mjs
          node --check lib/projection_generation.mjs
          node --check lib/server/fpl_brief_api.mjs
          node --check jobs/projection_integrity_v13.mjs
          node --check tests/xpts_v13_contract.test.mjs

      - name: Targeted regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/xpts_v13_contract.test.mjs
          if [ -f tests/xpts_overhaul_contract.test.mjs ]; then
            node --test tests/xpts_overhaul_contract.test.mjs
          fi

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run the complete repository test suite
        run: npm test

      - name: Run the production build
        run: npm run build

      - name: Reject malformed changes
        run: git diff --check

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No code changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix projection integrity and FPL brief API"
          git push origin HEAD:main

      - name: Start fresh projections automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_file="$(cat /tmp/zeus-v13/projection-workflow.txt)"
          for attempt in 1 2 3; do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/dispatches" -f ref=main; then
              echo "Started ${workflow_file} on main. Projection integrity v13 will run after it completes."
              exit 0
            fi
            sleep 5
          done
          echo "The repair committed, but the projections workflow could not be dispatched."
          exit 1
