name: ZEUS 17m Bench Minimum V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zeus-17m-bench-minimum-action-v2.yml
      - lib/solver/optimise.mjs
      - lib/solver/autobuild.mjs
      - lib/solver/build-range.mjs
      - app/api/optimise/route.js
      - tests/bench-minimum.test.mjs
      - tests/build-range.test.mjs
      - tests/autobuild.test.mjs

permissions:
  contents: read

concurrency:
  group: zeus-17m-bench-minimum-v2
  cancel-in-progress: true

jobs:
  verify:
    name: Verify minimum bench spend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify minimum-budget implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "lib/solver/optimise.mjs": [
                  "const benchMinimum",
                  "benchCost + 1e-9 < benchMinimum",
              ],
              "lib/solver/autobuild.mjs": [
                  "DEFAULT_BENCH_MINIMUM",
                  "const benchMinimum",
                  "benchCost + EPS < benchMinimum",
              ],
              "lib/solver/build-range.mjs": [
                  "const benchMinimum",
                  "benchBudget: benchMinimum",
              ],
              "app/api/optimise/route.js": [
                  'bench_budget_rule: "minimum"',
              ],
              "tests/bench-minimum.test.mjs": [
                  "treats 17m as a minimum, not a maximum",
                  "permits a bench above 17m",
                  "preserve the 17m minimum",
              ],
          }

          forbidden = {
              "lib/solver/optimise.mjs": ["benchCost > benchBudget"],
              "lib/solver/autobuild.mjs": [
                  "benchCost > benchCap",
                  "benchSpend > benchCap",
                  "bench ceiling",
              ],
          }

          failures = []
          for filename, needles in required.items():
              path = Path(filename)
              if not path.exists():
                  failures.append(f"Missing file: {filename}")
                  continue
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      failures.append(f"{filename}: missing {needle!r}")

          for filename, needles in forbidden.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              for needle in needles:
                  if needle in text:
                      failures.append(f"{filename}: contains forbidden ceiling logic {needle!r}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("Verified source contract: bench >= 17m, XI <= 83m, total <= 100m.")
          PY

      - name: Run bench-budget regression tests
        run: node --test tests/bench-minimum.test.mjs tests/build-range.test.mjs tests/autobuild.test.mjs

      - name: Run production build
        run: npm run build
