name: ZEUS Configurable Optimiser Controls V7

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeus-configurable-optimiser-controls-v7
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply configurable optimiser controls
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{label}: expected at least {count} marker(s), found {actual}")
              return text.replace(old, new, count)

          # 1. Exact squad API: accept a caller-selected minimum bench spend.
          path = Path("app/api/exact-squad/route.js")
          text = path.read_text()
          text = must_replace(
              text,
              '    const budget = finite(body?.budget, 100);\n',
              '    const budget = finite(body?.budget, 100);\n'
              '    const benchBudget = finite(body?.bench_budget, 17);\n'
              '    if (benchBudget < 0 || benchBudget > budget) {\n'
              '      return Response.json({ ok: false, error: "bench_budget must be between 0 and the total budget." }, { status: 400 });\n'
              '    }\n',
              "exact-squad bench parser",
          )
          text = must_replace(text, '      benchBudget: 17,\n', '      benchBudget,\n', "exact-squad optimiser argument")
          path.write_text(text)

          # 2. Bench Boost comparison API: configurable bench spend and hard exclusions.
          path = Path("app/api/benchboost-compare/route.js")
          text = path.read_text()
          text = must_replace(
              text,
              '  const budget = Number(body?.budget ?? 100);\n',
              '  const budget = Number(body?.budget ?? 100);\n'
              '  const benchBudget = Number(body?.bench_budget ?? 17);\n',
              "comparison bench parser",
          )
          text = must_replace(
              text,
              '  if (!Number.isFinite(budget) || budget <= 0) return { ok: false, error: "budget must be a positive number." };\n',
              '  if (!Number.isFinite(budget) || budget <= 0) return { ok: false, error: "budget must be a positive number." };\n'
              '  if (!Number.isFinite(benchBudget) || benchBudget < 0 || benchBudget > budget) {\n'
              '    return { ok: false, error: "bench_budget must be between 0 and the total budget." };\n'
              '  }\n',
              "comparison bench validation",
          )
          text = must_replace(
              text,
              '  const deletePlanIds = [...new Set((Array.isArray(body?.delete_plan_ids) ? body.delete_plan_ids : [])\n'
              '    .map((id) => String(id || "").trim()).filter(Boolean))];\n'
              '  return { ok: true, gwFrom, gwTo, budget, candidateChipGameweeks, saveNames, deletePlanIds };\n',
              '  const deletePlanIds = [...new Set((Array.isArray(body?.delete_plan_ids) ? body.delete_plan_ids : [])\n'
              '    .map((id) => String(id || "").trim()).filter(Boolean))];\n'
              '  const rawExcludePlayerIds = Array.isArray(body?.exclude_player_ids) ? body.exclude_player_ids.map(Number) : [];\n'
              '  if (rawExcludePlayerIds.some((id) => !Number.isInteger(id) || id <= 0)) {\n'
              '    return { ok: false, error: "exclude_player_ids must contain positive integer player IDs." };\n'
              '  }\n'
              '  const excludePlayerIds = [...new Set(rawExcludePlayerIds)];\n'
              '  return { ok: true, gwFrom, gwTo, budget, benchBudget, candidateChipGameweeks, saveNames, deletePlanIds, excludePlayerIds };\n',
              "comparison exclusion parser",
          )
          text = must_replace(
              text,
              'function validateBuild(build, budget, gwFrom, gwTo) {',
              'function validateBuild(build, budget, benchBudget, gwFrom, gwTo) {',
              "comparison validator signature",
          )
          text = must_replace(
              text,
              '    if (xiCost > budget - 17 + 1e-9) errors.push(`GW${gw} XI costs ${xiCost.toFixed(1)}, above ${(budget - 17).toFixed(1)}`);\n'
              '    if (benchCost < 17 - 1e-9) errors.push(`GW${gw} bench costs ${benchCost.toFixed(1)}, below 17.0`);\n',
              '    if (xiCost > budget - benchBudget + 1e-9) errors.push(`GW${gw} XI costs ${xiCost.toFixed(1)}, above ${(budget - benchBudget).toFixed(1)}`);\n'
              '    if (benchCost < benchBudget - 1e-9) errors.push(`GW${gw} bench costs ${benchCost.toFixed(1)}, below ${benchBudget.toFixed(1)}`);\n',
              "comparison dynamic budget validation",
          )
          text = must_replace(
              text,
              'function publicBuild(shared, chipGw, budget, gwFrom, gwTo) {',
              'function publicBuild(shared, chipGw, budget, benchBudget, gwFrom, gwTo) {',
              "comparison public build signature",
          )
          text = must_replace(
              text,
              '      xi_budget: budget - 17,\n      bench_budget: 17,\n',
              '      xi_budget: budget - benchBudget,\n      bench_budget: benchBudget,\n',
              "comparison public constraints",
          )
          text = must_replace(
              text,
              '    const { players, scorer } = loaded;\n'
              '    const pool = players.filter((player) => (!player.status || player.status === "a") && Number(player.price) > 0);\n',
              '    const { players, scorer } = loaded;\n'
              '    const playerById = new Map(players.map((player) => [idOf(player), player]));\n'
              '    const unknownExclusions = parsed.excludePlayerIds.filter((id) => !playerById.has(id));\n'
              '    if (unknownExclusions.length) {\n'
              '      return json({ ok: false, error: `Unknown excluded player IDs: ${unknownExclusions.join(",")}.` }, 400);\n'
              '    }\n'
              '    const excludedPlayers = parsed.excludePlayerIds.map((id) => playerById.get(id));\n'
              '    const pool = players.filter((player) => (!player.status || player.status === "a") && Number(player.price) > 0);\n',
              "comparison exclusion resolution",
          )
          text = must_replace(
              text,
              '        benchBudget: 17,\n        maxPerClub: 3,\n',
              '        benchBudget: parsed.benchBudget,\n        maxPerClub: 3,\n        ignores: parsed.excludePlayerIds,\n',
              "comparison optimiser controls",
          )
          text = must_replace(
              text,
              '      const build = publicBuild(shared, chipGw, parsed.budget, parsed.gwFrom, parsed.gwTo);\n'
              '      const validation = validateBuild(build, parsed.budget, parsed.gwFrom, parsed.gwTo);\n',
              '      const build = publicBuild(shared, chipGw, parsed.budget, parsed.benchBudget, parsed.gwFrom, parsed.gwTo);\n'
              '      const validation = validateBuild(build, parsed.budget, parsed.benchBudget, parsed.gwFrom, parsed.gwTo);\n',
              "comparison validation calls",
          )
          text = must_replace(
              text,
              '      candidate_chip_gameweeks: builds.map((build) => build.chip_gw),\n',
              '      candidate_chip_gameweeks: builds.map((build) => build.chip_gw),\n'
              '      bench_budget: parsed.benchBudget,\n'
              '      excluded_player_ids: parsed.excludePlayerIds,\n',
              "comparison objective metadata",
          )
          text = must_replace(
              text,
              '      saved,\n    });\n',
              '      saved,\n      excludedPlayers,\n    });\n',
              "comparison report exclusions",
          )
          text = must_replace(
              text,
              '      gw_to: parsed.gwTo,\n      objective,\n',
              '      gw_to: parsed.gwTo,\n      bench_budget: parsed.benchBudget,\n      excluded_player_ids: parsed.excludePlayerIds,\n      objective,\n',
              "comparison response controls",
          )
          path.write_text(text)

          # 3. Builder UI: selectable bench minimum everywhere, not only one optimiser path.
          path = Path("app/builder/BuilderClient.jsx")
          text = path.read_text()
          text = must_replace(
              text,
              '  const [chipGw, setChipGw] = React.useState(1);\n',
              '  const [chipGw, setChipGw] = React.useState(1);\n'
              '  const [benchBudget, setBenchBudget] = React.useState(17);\n',
              "builder bench state",
          )
          text = must_replace(
              text,
              '        budget: RULES.budget,\n        chip_schedule: chipSchedule,\n',
              '        budget: RULES.budget,\n        bench_budget: benchBudget,\n        chip_schedule: chipSchedule,\n',
              "builder exact request",
          )
          text = must_replace(
              text,
              '      xiBudget: RULES.budget - 17,\n      benchBudget: 17,\n',
              '      xiBudget: RULES.budget - benchBudget,\n      benchBudget,\n',
              "builder owned-squad constraints",
              count=2,
          )
          text = must_replace(
              text,
              '  }, [model, squad, gwFrom, gwTo, planWeeks, locks, formationLocked]);\n',
              '  }, [model, squad, gwFrom, gwTo, planWeeks, locks, formationLocked, benchBudget]);\n',
              "builder selected range dependencies",
          )

          marker = '    <ChipControls chip={activeChip} onChange={toggleChip} gw={chipGw} disabled={!squad.players.length} />'
          control = '''    <ChipControls chip={activeChip} onChange={toggleChip} gw={chipGw} disabled={!squad.players.length} />
                <section aria-label="Minimum bench spend" style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, flexWrap: "wrap" }}>
                  <label htmlFor="bench-budget" style={code(12)}>MIN BENCH SPEND</label>
                  <input
                    id="bench-budget"
                    type="number"
                    min="0"
                    max={RULES.budget}
                    step="0.5"
                    value={benchBudget}
                    onChange={(event) => {
                      const value = Number(event.target.value);
                      if (Number.isFinite(value)) setBenchBudget(Math.max(0, Math.min(RULES.budget, value)));
                    }}
                    style={{ height: 38, width: 92, padding: "0 10px", borderRadius: S.radiusSm,
                      background: T.card, border: `1px solid ${T.line}`, color: "#FFFFFF", ...lang(13.5, 700) }}
                  />
                  <span style={code(12)}>£m · XI max {(RULES.budget - benchBudget).toFixed(1)}</span>
                </section>'''
          text = must_replace(text, marker, control, "builder bench control")
          if 'xiBudget: RULES.budget - 17' in text or 'benchBudget: 17' in text:
              raise SystemExit("Builder still contains a hardcoded £17 optimiser constraint")
          path.write_text(text)

          # 4. Backend report: prove which controls were actually applied.
          path = Path("lib/benchboost-comparison.mjs")
          text = path.read_text()
          text = must_replace(
              text,
              'export function renderBenchBoostReport({ gwFrom, gwTo, builds = [], comparison = {}, deleted = [], saved = [] } = {}) {',
              'export function renderBenchBoostReport({ gwFrom, gwTo, builds = [], comparison = {}, deleted = [], saved = [], excludedPlayers = [] } = {}) {',
              "report signature",
          )
          text = must_replace(
              text,
              '  lines.push(`Each build maximises total net xPTS across GW${gwFrom}-GW${gwTo}, with Bench Boost fixed to that build\'s stated gameweek.`);\n'
              '  lines.push("");\n',
              '  lines.push(`Each build maximises total net xPTS across GW${gwFrom}-GW${gwTo}, with Bench Boost fixed to that build\'s stated gameweek.`);\n'
              '  const applied = builds[0]?.constraints || {};\n'
              '  lines.push(`Minimum bench spend: £${n1(applied.bench_budget)}m in every gameweek. Maximum XI spend: £${n1(applied.xi_budget)}m.`);\n'
              '  lines.push(`Hard exclusions: ${excludedPlayers.length ? names(excludedPlayers) : "none"}.`);\n'
              '  lines.push("");\n',
              "report applied controls",
          )
          path.write_text(text)

          # 5. Letta's durable operating instructions: users speak naturally; Letta does the translation.
          path = Path("docs/LETTA_FINAL_OPERATING_PROMPT.md")
          text = path.read_text()
          heading = "## Natural-language optimiser controls"
          block = '''
          
          ## Natural-language optimiser controls
          
          Users specify optimiser constraints in ordinary language. Interpret phrases such as “minimum £16.5m bench”, “spend at least £16.5m on the bench”, “do not include O'Reilly”, “avoid Anderson”, or “keep Haaland”. Do not ask the user for API fields, JSON, player IDs or saved-plan IDs when the named player or plan can be resolved from current ZEUS data.
          
          Map the user's stated minimum bench spend to the exact optimiser's bench minimum. The maximum XI spend is the total budget minus that minimum. Never silently fall back to £17.0m when the user supplied another value.
          
          Treat every “do not include”, “exclude” or “avoid” instruction as a hard exclusion from every candidate build. Resolve each name against the current player list. If a name is missing or ambiguous, explain that exact ambiguity before running; never guess or silently drop an exclusion.
          
          When the user asks to replace existing saved plans, find the current matching plan rows yourself. Use the server-authoritative Bench Boost comparison pipeline so new plans are optimised, validated, saved, reread and canonically verified before the old plans are deleted.
          
          Speak to the user in natural language. Do not expose endpoint names, parameter names, JSON or internal IDs unless the user explicitly asks for technical details.
          '''
          if heading in text:
              text = text[:text.index(heading)].rstrip() + block + "\n"
          else:
              text = text.rstrip() + block + "\n"
          path.write_text(text)
          PY

          cat > tests/configurable-optimiser-controls.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { renderBenchBoostReport } from "../lib/benchboost-comparison.mjs";

          test("exact squad API accepts a caller-selected bench minimum", () => {
            const source = readFileSync("app/api/exact-squad/route.js", "utf8");
            assert.match(source, /bench_budget/);
            assert.match(source, /benchBudget,/);
            assert.match(source, /ignores: ids\(body\?\.ignores\)/);
            assert.doesNotMatch(source, /benchBudget: 17/);
          });

          test("comparison API applies bench minimum and hard exclusions", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /bench_budget/);
            assert.match(source, /exclude_player_ids/);
            assert.match(source, /ignores: parsed\.excludePlayerIds/);
            assert.match(source, /benchBudget: parsed\.benchBudget/);
            assert.match(source, /validateBuild\(build, parsed\.budget, parsed\.benchBudget/);
            assert.match(source, /Unknown excluded player IDs/);
            assert.doesNotMatch(source, /benchCost < 17/);
          });

          test("Builder uses the selected bench minimum for every optimiser path", () => {
            const source = readFileSync("app/builder/BuilderClient.jsx", "utf8");
            assert.match(source, /MIN BENCH SPEND/);
            assert.match(source, /bench_budget: benchBudget/);
            assert.equal((source.match(/xiBudget: RULES\.budget - benchBudget/g) || []).length, 2);
            assert.equal((source.match(/\n\s+benchBudget,\n/g) || []).length >= 2, true);
            assert.match(source, /formationLocked, benchBudget\]/);
            assert.doesNotMatch(source, /xiBudget: RULES\.budget - 17/);
            assert.doesNotMatch(source, /benchBudget: 17/);
          });

          test("comparison report states the applied bench minimum and exclusions", () => {
            const report = renderBenchBoostReport({
              gwFrom: 1,
              gwTo: 3,
              builds: [{
                chip_gw: 1,
                solver: { status: "OPTIMAL", mip_gap: 0 },
                weekly: [],
                total: { net_xpts: 0 },
                objective: { arithmetic_verified: true, gw_from: 1, gw_to: 3 },
                constraints: { bench_budget: 16.5, xi_budget: 83.5 },
                players: [],
              }],
              excludedPlayers: [{ web_name: "O'Reilly" }, { web_name: "Anderson" }],
            });
            assert.match(report, /Minimum bench spend: £16\.5m/);
            assert.match(report, /Maximum XI spend: £83\.5m/);
            assert.match(report, /Hard exclusions: O'Reilly, Anderson/);
          });

          test("Letta instructions require natural-language resolution", () => {
            const source = readFileSync("docs/LETTA_FINAL_OPERATING_PROMPT.md", "utf8");
            assert.match(source, /Natural-language optimiser controls/);
            assert.match(source, /Do not ask the user for API fields, JSON, player IDs or saved-plan IDs/);
            assert.match(source, /Speak to the user in natural language/);
          });
          JS

      - name: Syntax and static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app/api/exact-squad/route.js
          node --check app/api/benchboost-compare/route.js
          node --check lib/benchboost-comparison.mjs
          grep -F 'bench_budget: benchBudget' app/builder/BuilderClient.jsx
          grep -F 'MIN BENCH SPEND' app/builder/BuilderClient.jsx
          test "$(grep -c 'xiBudget: RULES.budget - benchBudget' app/builder/BuilderClient.jsx)" -eq 2
          ! grep -F 'xiBudget: RULES.budget - 17' app/builder/BuilderClient.jsx
          ! grep -F 'benchBudget: 17' app/builder/BuilderClient.jsx
          grep -F 'ignores: parsed.excludePlayerIds' app/api/benchboost-compare/route.js
          grep -F 'Minimum bench spend:' lib/benchboost-comparison.mjs
          grep -F 'Speak to the user in natural language' docs/LETTA_FINAL_OPERATING_PROMPT.md

      - name: Focused regression tests
        run: |
          node --test \
            tests/configurable-optimiser-controls.test.mjs \
            tests/exact-save-pipeline.test.mjs \
            tests/benchboost-route-contract.test.mjs \
            tests/benchboost-comparison.test.mjs \
            tests/exact-global-build.test.mjs \
            tests/plan-write-validation.test.mjs \
            tests/plan-range.test.mjs \
            tests/plan.test.mjs

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/exact-squad/route.js \
            app/api/benchboost-compare/route.js \
            app/builder/BuilderClient.jsx \
            lib/benchboost-comparison.mjs \
            docs/LETTA_FINAL_OPERATING_PROMPT.md \
            tests/configurable-optimiser-controls.test.mjs
          git commit -m "Add configurable bench spend and natural-language exclusions"
          git push
