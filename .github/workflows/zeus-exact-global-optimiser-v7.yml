      - name: Commit and push
        shell: bash
        run: |
          git config user.name "ZEUS Exact Optimiser"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json next.config.mjs \
            lib/server/exact-range-optimiser.mjs app/api/exact-squad/route.js \
            app/api/optimise/route.js app/api/benchboost-compare/route.js \
            app/builder/BuilderClient.jsx lib/benchboost-comparison.mjs docs/LETTA_FINAL_OPERATING_PROMPT.md \
            tests/exact-global-build.test.mjs tests/squad-range-ui-contract.test.mjs \
            tests/core-restoration.test.mjs tests/optimise-route-contract.test.mjs
          if git diff --cached --quiet; then
            echo "Exact optimiser already installed."
            exit 0
          fi
          git commit -m "Install verified zero-gap HiGHS squad optimiser"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
