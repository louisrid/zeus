              '  if (build?.solver?.status !== "OPTIMAL" || build?.solver?.optimality_proven !== true || Number(build?.solver?.mip_gap) !== 0) {\n    errors.push("exact global optimality proof is missing");\n  }\n  if (!build.objective?.arithmetic_verified) {',
            );
            if (!source.includes('buildExactSquadForRange') || !source.includes('solver: shared.solver')) throw new Error('benchboost route patch failed');
            return source;
          });

          patch('lib/benchboost-comparison.mjs', (source) => {
            source = source.replace(
              'lines.push("| BB GW | Weekly net xPTS | Range total | Arithmetic verified |");',
              'lines.push("| BB GW | Solver | Gap | Weekly net xPTS | Range total | Arithmetic verified |");',
            );
            source = source.replace(
              'lines.push("|---:|---|---:|:---:|");',
              'lines.push("|---:|---|---:|---|---:|:---:|");',
            );
            source = source.replace(
              'lines.push(`| ${build.chip_gw} | ${(build.weekly || []).map((week) => `GW${week.gw} ${n1(week.net_xpts)}`).join(" + ")} | ${n1(build.total?.net_xpts)} | ${build.objective?.arithmetic_verified ? "yes" : "no"} |`);',
              'lines.push(`| ${build.chip_gw} | ${safe(build.solver?.status)} | ${n1(build.solver?.mip_gap)} | ${(build.weekly || []).map((week) => `GW${week.gw} ${n1(week.net_xpts)}`).join(" + ")} | ${n1(build.total?.net_xpts)} | ${build.objective?.arithmetic_verified ? "yes" : "no"} |`);',
            );
            source = source.replace(
              'lines.push(`**Objective:** maximise GW${build.objective?.gw_from}-GW${build.objective?.gw_to} total net xPTS with Bench Boost fixed to GW${build.chip_gw}.`);',
              'lines.push(`**Solver:** ${safe(build.solver?.engine)} ${safe(build.solver?.version)}, status ${safe(build.solver?.status)}, MIP gap ${n1(build.solver?.mip_gap)}, optimality proven ${build.solver?.optimality_proven === true ? "yes" : "no"}.`);\n    lines.push("");\n    lines.push(`**Objective:** maximise GW${build.objective?.gw_from}-GW${build.objective?.gw_to} total net xPTS with Bench Boost fixed to GW${build.chip_gw}.`);',
            );
            if (!source.includes('MIP gap') || !source.includes('build.solver?.status')) throw new Error('benchboost report proof patch failed');
            return source;
          });
          NODE

      - name: Make Builder buttons use exact backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/builder/BuilderClient.jsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('import { buildSquadForRange } from "../../lib/solver/build-range.mjs";\n', '');

          const oldBlock = /  const runRangeBuild = \(keep = \[\]\) => buildSquadForRange\(\{[\s\S]*?\n  \}\);/;
          const replacement = [
            '  const runRangeBuild = async (keep = []) => {',
            '    const chipSchedule = {};',
            '    for (let gameweek = gwFrom; gameweek <= gwTo; gameweek += 1) {',
            '      const chip = chipForGameweek(gameweek);',
            '      if (chip) chipSchedule[gameweek] = chip;',
            '    }',
            '    return fetch("/api/exact-squad", {',
            '      method: "POST",',
            '      headers: { "Content-Type": "application/json" },',
            '      body: JSON.stringify({',
            '        gw_from: gwFrom,',
            '        gw_to: gwTo,',
            '        budget: RULES.budget,',
            '        chip_schedule: chipSchedule,',
            '        locks,',
            '        keep,',
            '        ignores,',
            '        only_formation: formationLocked ? squad.structure : null,',
            '      }),',
            '    }).then((response) => response.json())',
            '      .catch(() => ({ ok: false, error: "The exact optimiser request failed." }));',
            '  };',
          ].join('\n');
          if (!oldBlock.test(source)) throw new Error('Builder runRangeBuild block not found');
          source = source.replace(oldBlock, replacement);
          source = source.replace('  const doBestXI = () => {', '  const doBestXI = async () => {');
          source = source.replace('      const result = runRangeBuild(keep);', '      const result = await runRangeBuild(keep);');
          source = source.replace('  const doRebuild = () => {', '  const doRebuild = async () => {');
          source = source.replace('      const result = runRangeBuild([]);', '      const result = await runRangeBuild([]);');
          source = source.replace(
            '      const result = await runRangeBuild(keep);\n      if (!result.ok) return say(result.error, true);\n      snapshot();',
            '      const result = await runRangeBuild(keep);\n      if (!result.ok) return say(result.error, true);\n      if (result.solver?.status !== "OPTIMAL" || result.solver?.optimality_proven !== true || result.solver?.mip_gap !== 0) return say("Global optimality was not proven.", true);\n      snapshot();',
          );
          source = source.replace(
            '      const result = await runRangeBuild([]);\n      if (!result.ok) return say(result.error, true);\n      snapshot();',
            '      const result = await runRangeBuild([]);\n      if (!result.ok) return say(result.error, true);\n      if (result.solver?.status !== "OPTIMAL" || result.solver?.optimality_proven !== true || result.solver?.mip_gap !== 0) return say("Global optimality was not proven.", true);\n      snapshot();',
          );
          source = source.replace(
            '  /* BUILD SQUAD and IMPROVE are the same full-pool, exact-range, chip-aware solver path. */',
            '  /* BUILD SQUAD, FILL GAPS and IMPROVE use the same server-side zero-gap HiGHS MILP. */',
          );
          if (source.includes('buildSquadForRange') || !source.includes('/api/exact-squad')) throw new Error('Builder exact-backend patch failed');
          fs.writeFileSync(path, source);
          NODE

