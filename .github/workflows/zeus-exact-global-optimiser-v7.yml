            return source;
          });

          patch('app/api/benchboost-compare/route.js', (source) => {
            source = source.replace(
              'import { buildSquadForRange } from "../../../lib/solver/build-range.mjs";',
              'import { buildExactSquadForRange } from "../../../lib/server/exact-range-optimiser.mjs";',
