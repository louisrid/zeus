name: ZEUS Repair Exact Save Pipeline V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeus-repair-exact-save-pipeline-v3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply complete exact-save repair
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/plan-write-validation.mjs <<'JS'
          import { PLAN_RULES, squadAt, validateChips } from "./plan.mjs";
          
          const own = (value, key) => Object.prototype.hasOwnProperty.call(value || {}, key);
          const asId = (value) => {
            const raw = value?.fpl_id ?? value?.element ?? value?.id ?? value;
            const id = Number(raw);
            return Number.isInteger(id) && id > 0 ? id : null;
          };
          const ids = (values) => (Array.isArray(values) ? values : []).map(asId);
          const uniqueValidIds = (values) => [...new Set(ids(values).filter((id) => id !== null))];
          
          function formationFor(players, starterIds) {
            const starterSet = new Set(starterIds);
            const counts = { GKP: 0, DEF: 0, MID: 0, FWD: 0 };
            for (const player of players || []) {
              if (starterSet.has(asId(player)) && counts[player?.position] !== undefined) counts[player.position] += 1;
            }
            if (counts.GKP !== 1) return null;
            if (counts.DEF < 3 || counts.DEF > 5) return null;
            if (counts.MID < 2 || counts.MID > 5) return null;
            if (counts.FWD < 1 || counts.FWD > 3) return null;
            return `${counts.DEF}-${counts.MID}-${counts.FWD}`;
          }
          
          function validateSquadShape(players, label, errors, requireComplete) {
            const rows = Array.isArray(players) ? players : [];
            const rowIds = ids(rows);
            const unique = uniqueValidIds(rows);
            if (rows.length > PLAN_RULES.squadSize) errors.push(`${label} contains ${rows.length} players, maximum is ${PLAN_RULES.squadSize}`);
            if (rowIds.some((id) => id === null) || unique.length !== rows.length) errors.push(`${label} player IDs must be unique positive integers`);
            for (const [position, maximum] of Object.entries(PLAN_RULES.quotas)) {
              const count = rows.filter((player) => player?.position === position).length;
              if (count > maximum) errors.push(`${label} ${position} count is ${count}, maximum is ${maximum}`);
              if (requireComplete && count !== maximum) errors.push(`${label} ${position} count is ${count}, expected ${maximum}`);
            }
            const clubs = new Map();
            for (const player of rows) {
              const teamId = Number(player?.team_id);
              if (Number.isInteger(teamId) && teamId > 0) clubs.set(teamId, (clubs.get(teamId) || 0) + 1);
            }
            for (const [teamId, count] of clubs) if (count > PLAN_RULES.maxPerClub) errors.push(`${label} club ${teamId} has ${count} players, maximum is ${PLAN_RULES.maxPerClub}`);
          }
          
          function validateTransfer(transfer, gw, index, errors) {
            const out = asId(transfer?.out);
            const incoming = asId(transfer?.in);
            if (out === null || incoming === null) errors.push(`GW${gw} transfer ${index + 1} requires numeric out and in IDs`);
            if (out !== null && out === incoming) errors.push(`GW${gw} transfer ${index + 1} cannot replace a player with himself`);
            if (transfer?.position && !Object.hasOwn(PLAN_RULES.quotas, transfer.position)) errors.push(`GW${gw} transfer ${index + 1} has unsupported position ${transfer.position}`);
          }
          
          export function validatePlanWrite({
            base,
            weeks,
            structure = "3-5-2",
            captain = null,
            vice = null,
            strictGameweeks = [],
          } = {}) {
            const errors = [];
            const squad = Array.isArray(base) ? base : [];
            const weekMap = weeks && typeof weeks === "object" && !Array.isArray(weeks) ? weeks : {};
            validateSquadShape(squad, "base", errors, squad.length === PLAN_RULES.squadSize);
          
            const validWeekKeys = [];
            for (const key of Object.keys(weekMap)) {
              const gw = Number(key);
              if (!Number.isInteger(gw) || gw < 1 || gw > 38 || String(gw) !== String(key)) {
                errors.push(`invalid gameweek key ${key}; use canonical keys "1" to "38" and never "0"`);
              } else {
                validWeekKeys.push(gw);
              }
            }
          
            const strict = new Set((Array.isArray(strictGameweeks) ? strictGameweeks : [])
              .map(Number).filter((gw) => Number.isInteger(gw) && gw >= 1 && gw <= 38));
            for (const gw of strict) if (!own(weekMap, String(gw))) errors.push(`GW${gw} is required but missing from weeks`);
          
            const plan = { base: squad, weeks: weekMap, structure, captain, vice };
            for (const gw of validWeekKeys.sort((a, b) => a - b)) {
              const week = weekMap[String(gw)] || weekMap[gw] || {};
              const transfers = Array.isArray(week.transfers) ? week.transfers : [];
              transfers.forEach((transfer, index) => validateTransfer(transfer, gw, index, errors));
          
              const state = squadAt(plan, gw);
              for (const problem of state.problems || []) {
                errors.push(problem.kind === "missing_out"
                  ? `GW${problem.gw} transfers out a player who is not in the squad`
                  : `GW${problem.gw} transfers in a player who is already in the squad`);
              }
              if ((state.players || []).length === PLAN_RULES.squadSize) validateSquadShape(state.players, `GW${gw} squad`, errors, true);
              else if ((state.players || []).length > PLAN_RULES.squadSize) validateSquadShape(state.players, `GW${gw} squad`, errors, false);
          
              const hasStarting = Array.isArray(week.startingIds);
              const hasBench = Array.isArray(week.benchOrder);
              const fullRolesRequired = strict.has(gw) || hasStarting || hasBench;
              if (!fullRolesRequired) continue;
              if (!hasStarting) errors.push(`GW${gw} is missing startingIds`);
              if (!hasBench) errors.push(`GW${gw} is missing benchOrder`);
              if (!hasStarting || !hasBench) continue;
          
              const currentIds = uniqueValidIds(state.players || []);
              const currentSet = new Set(currentIds);
              const starterRaw = ids(week.startingIds);
              const benchRaw = ids(week.benchOrder);
              const starters = uniqueValidIds(week.startingIds);
              const bench = uniqueValidIds(week.benchOrder);
          
              if ((state.players || []).length !== PLAN_RULES.squadSize || currentIds.length !== PLAN_RULES.squadSize) errors.push(`GW${gw} must resolve to a complete 15-player squad before weekly roles can be saved`);
              if (starterRaw.some((id) => id === null) || starterRaw.length !== 11 || starters.length !== 11) errors.push(`GW${gw} must contain exactly 11 unique positive startingIds`);
              if (benchRaw.some((id) => id === null) || benchRaw.length !== 4 || bench.length !== 4) errors.push(`GW${gw} must contain exactly four unique positive benchOrder IDs`);
          
              const outsideStarters = starters.filter((id) => !currentSet.has(id));
              const outsideBench = bench.filter((id) => !currentSet.has(id));
              if (outsideStarters.length) errors.push(`GW${gw} starters outside current squad: ${outsideStarters.join(",")}`);
              if (outsideBench.length) errors.push(`GW${gw} bench outside current squad: ${outsideBench.join(",")}`);
              const benchSet = new Set(bench);
              const overlap = starters.filter((id) => benchSet.has(id));
              if (overlap.length) errors.push(`GW${gw} XI/bench overlap: ${overlap.join(",")}`);
              const union = new Set([...starters, ...bench]);
              if (union.size !== PLAN_RULES.squadSize || currentIds.some((id) => !union.has(id))) errors.push(`GW${gw} startingIds plus benchOrder must equal the current 15-player squad`);
          
              const expectedFormation = formationFor(state.players || [], starters);
              if (!expectedFormation) errors.push(`GW${gw} startingIds do not form a legal FPL XI`);
              if (expectedFormation && state.structure !== expectedFormation) errors.push(`GW${gw} structure is ${state.structure || "missing"}, expected ${expectedFormation}`);
              const selectedCaptain = asId(state.captain);
              const selectedVice = asId(state.vice);
              if (selectedCaptain === null || !starters.includes(selectedCaptain)) errors.push(`GW${gw} captain must be a starting player`);
              if (selectedVice === null || !starters.includes(selectedVice)) errors.push(`GW${gw} vice must be a starting player`);
              if (selectedCaptain !== null && selectedCaptain === selectedVice) errors.push(`GW${gw} captain and vice must differ`);
            }
          
            const chipValidation = validateChips(plan);
            for (const error of chipValidation.errors || []) errors.push(error);
            return { ok: errors.length === 0, errors };
          }
          JS

          python3 <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label} start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label} end marker not found")
              return text[:start] + replacement.rstrip() + text[end:]

          plans = Path("app/api/plans/route.js")
          text = plans.read_text()
          import_line = 'import { createClient } from "@supabase/supabase-js";\n'
          validation_import = 'import { validatePlanWrite } from "../../../lib/plan-write-validation.mjs";\n'
          if validation_import not in text:
              if import_line not in text:
                  raise SystemExit("plans route import marker not found")
              text = text.replace(import_line, import_line + validation_import, 1)

          validation_block = "\n  const validation = validatePlanWrite({ base: row.base, weeks: row.weeks, structure: row.structure, captain: row.captain, vice: row.vice });\n  if (!validation.ok) {\n    return bad(`Invalid plan payload: ${validation.errors.join("; ")}`, 422);\n  }"
          if 'const validation = validatePlanWrite({ base: row.base, weeks: row.weeks, structure: row.structure, captain: row.captain, vice: row.vice });' not in text:
              insert_before = "\n\n  if (body.id) {"
              if insert_before not in text:
                  raise SystemExit("plans route save/update marker not found")
              text = text.replace(insert_before, validation_block + insert_before, 1)
          plans.write_text(text)

          route = Path("app/api/benchboost-compare/route.js")
          text = route.read_text()
          comparison_import_end = '} from "../../../lib/benchboost-comparison.mjs";\n'
          validation_import = 'import { validatePlanWrite } from "../../../lib/plan-write-validation.mjs";\n'
          if validation_import not in text:
              if comparison_import_end not in text:
                  raise SystemExit("comparison import marker not found")
              text = text.replace(comparison_import_end, comparison_import_end + validation_import, 1)

          parse_body = r'''function parseBody(body) {
            const gwFrom = Number(body?.gw_from ?? 1);
            const gwTo = Number(body?.gw_to ?? 3);
            const budget = Number(body?.budget ?? 100);
            if (!Number.isInteger(gwFrom) || !Number.isInteger(gwTo) || gwFrom < 1 || gwTo > 8 || gwTo < gwFrom) {
              return { ok: false, error: "gw_from and gw_to must define an inclusive range within GW1-GW8." };
            }
            if (!Number.isFinite(budget) || budget <= 0) return { ok: false, error: "budget must be a positive number." };

            const defaults = Array.from({ length: gwTo - gwFrom + 1 }, (_, index) => gwFrom + index);
            const candidateChipGameweeks = Array.isArray(body?.candidate_chip_gameweeks)
              ? body.candidate_chip_gameweeks.map(Number)
              : defaults;
            if (!candidateChipGameweeks.length
              || candidateChipGameweeks.some((gw) => !Number.isInteger(gw) || gw < gwFrom || gw > gwTo)) {
              return { ok: false, error: "candidate_chip_gameweeks must contain gameweeks inside gw_from-gw_to." };
            }
            if (new Set(candidateChipGameweeks).size !== candidateChipGameweeks.length) {
              return { ok: false, error: "candidate_chip_gameweeks must not contain duplicates." };
            }

            const saveNames = Array.isArray(body?.save_names)
              ? body.save_names.map((name) => String(name || "").trim())
              : [];
            if (saveNames.some((name) => !name)) return { ok: false, error: "save_names cannot contain blank names." };
            if (saveNames.length && saveNames.length !== candidateChipGameweeks.length) {
              return { ok: false, error: "save_names must contain exactly one name for every requested candidate Bench Boost gameweek." };
            }

            const deletePlanIds = [...new Set((Array.isArray(body?.delete_plan_ids) ? body.delete_plan_ids : [])
              .map((id) => String(id || "").trim()).filter(Boolean))];
            return { ok: true, gwFrom, gwTo, budget, candidateChipGameweeks, saveNames, deletePlanIds };
          }
          '''
          text = replace_between(text, 'function parseBody(body) {', '\n\nfunction validateBuild', parse_body, 'parseBody')

          validate_build = r'''function validateBuild(build, budget, gwFrom, gwTo) {
            const errors = [];
            const players = Array.isArray(build?.players) ? build.players : [];
            const squadIds = players.map(idOf);
            const squadSet = new Set(squadIds);
            if (players.length !== 15) errors.push(`expected 15 players, received ${players.length}`);
            if (squadSet.size !== 15 || squadIds.some((id) => !Number.isInteger(id) || id <= 0)) errors.push("player IDs are not 15 unique positive integers");

            const quotas = { GKP: 2, DEF: 5, MID: 5, FWD: 3 };
            for (const [position, expected] of Object.entries(quotas)) {
              const count = players.filter((player) => player.position === position).length;
              if (count !== expected) errors.push(`${position} count is ${count}, expected ${expected}`);
            }
            const clubs = new Map();
            for (const player of players) clubs.set(Number(player.team_id), (clubs.get(Number(player.team_id)) || 0) + 1);
            for (const [teamId, count] of clubs) if (count > 3) errors.push(`club ${teamId} has ${count} players`);
            if (sumCost(players) > budget + 1e-9) errors.push(`squad cost ${sumCost(players).toFixed(1)} exceeds ${budget.toFixed(1)}`);

            const expectedWeeks = Array.from({ length: gwTo - gwFrom + 1 }, (_, index) => gwFrom + index);
            const weekly = Array.isArray(build?.weekly) ? build.weekly : [];
            const actualWeeks = weekly.map((week) => Number(week.gw));
            if (JSON.stringify(actualWeeks) !== JSON.stringify(expectedWeeks)) {
              errors.push(`weekly range is ${actualWeeks.join(",") || "missing"}, expected ${expectedWeeks.join(",")}`);
            }

            for (const week of weekly) {
              const gw = Number(week.gw);
              const starters = Array.isArray(week.starters) ? week.starters : [];
              const bench = Array.isArray(week.bench) ? week.bench : [];
              const starterIds = starters.map(idOf);
              const benchIds = bench.map(idOf);
              const starterSet = new Set(starterIds);
              const benchSet = new Set(benchIds);
              const benchOrderIds = (Array.isArray(week.bench_order) ? week.bench_order : []).map((value) => idOf(value));
              const benchOrderSet = new Set(benchOrderIds);
              if (starters.length !== 11 || starterSet.size !== 11) errors.push(`GW${gw} does not have 11 unique starters`);
              if (bench.length !== 4 || benchSet.size !== 4) errors.push(`GW${gw} does not have four unique bench players`);
              if (benchOrderIds.length !== 4 || benchOrderSet.size !== 4
                || benchOrderIds.some((id) => !benchSet.has(id)) || benchIds.some((id) => !benchOrderSet.has(id))) {
                errors.push(`GW${gw} bench_order does not exactly match the four bench players`);
              }
              const overlap = starterIds.filter((id) => benchSet.has(id));
              if (overlap.length) errors.push(`GW${gw} XI/bench overlap: ${overlap.join(",")}`);
              const union = new Set([...starterIds, ...benchIds]);
              if (union.size !== 15 || [...squadSet].some((id) => !union.has(id))) errors.push(`GW${gw} XI and bench do not equal the fixed squad`);
              const outside = [...starterIds, ...benchIds].filter((id) => !squadSet.has(id));
              if (outside.length) errors.push(`GW${gw} contains players outside the fixed squad: ${outside.join(",")}`);

              const counts = { GKP: 0, DEF: 0, MID: 0, FWD: 0 };
              for (const player of starters) if (counts[player.position] !== undefined) counts[player.position] += 1;
              const formation = counts.GKP === 1 && counts.DEF >= 3 && counts.DEF <= 5
                && counts.MID >= 2 && counts.MID <= 5 && counts.FWD >= 1 && counts.FWD <= 3
                ? `${counts.DEF}-${counts.MID}-${counts.FWD}` : null;
              if (!formation) errors.push(`GW${gw} has an illegal formation`);
              if (formation && week.formation !== formation) errors.push(`GW${gw} formation is ${week.formation}, expected ${formation}`);

              const captain = Number(week.captain);
              const vice = Number(week.vice_captain);
              if (!starterSet.has(captain)) errors.push(`GW${gw} captain is not a starter`);
              if (!starterSet.has(vice)) errors.push(`GW${gw} vice is not a starter`);
              if (captain === vice) errors.push(`GW${gw} captain and vice are identical`);

              const xiCost = rounded(sumCost(starters));
              const benchCost = rounded(sumCost(bench));
              if (xiCost > budget - 17 + 1e-9) errors.push(`GW${gw} XI costs ${xiCost.toFixed(1)}, above ${(budget - 17).toFixed(1)}`);
              if (benchCost < 17 - 1e-9) errors.push(`GW${gw} bench costs ${benchCost.toFixed(1)}, below 17.0`);
              if (Math.abs(finite(week.xi_cost) - xiCost) > 0.05) errors.push(`GW${gw} stored XI cost does not match its players`);
              if (Math.abs(finite(week.bench_cost) - benchCost) > 0.05) errors.push(`GW${gw} stored bench cost does not match its players`);
            }

            const chipWeeks = weekly.filter((week) => week.chip === "benchboost").map((week) => Number(week.gw));
            if (chipWeeks.length !== 1 || chipWeeks[0] !== Number(build.chip_gw)) {
              errors.push(`Bench Boost schedule is ${chipWeeks.join(",") || "missing"}, expected GW${build.chip_gw}`);
            }

            const solver = build?.solver || {};
            if (solver.engine !== "HiGHS"
              || solver.status !== "OPTIMAL"
              || solver.optimality_proven !== true
              || Number(solver.mip_gap) !== 0
              || Number(solver.requested_mip_rel_gap) !== 0
              || Number(solver.requested_mip_abs_gap) !== 0
              || solver.timeout_used !== false
              || solver.fallback_used !== false) {
              errors.push("complete exact global optimality proof is missing");
            }
            if (!build.objective?.arithmetic_verified) {
              errors.push(`weekly net xPTS sum ${build.objective?.weekly_net_xpts_sum} does not match total ${build.total?.net_xpts}`);
            }
            return { ok: errors.length === 0, errors };
          }
          '''
          text = replace_between(text, 'function validateBuild(build, budget, gwFrom, gwTo) {', '\n\nfunction publicBuild', validate_build, 'validateBuild')

          delete_function = r'''async function deleteRequestedPlans(db, ids) {
            if (!ids.length) return [];
            const { data: rows, error: readError } = await db.from("plans").select("id,name,kind").in("id", ids);
            if (readError) throw new Error(`Could not read plans before deletion: ${readError.message}`);
            const byId = new Map((rows || []).map((row) => [String(row.id), row]));
            const live = (rows || []).filter((row) => row.kind === "live");
            if (live.length) throw new Error(`Refusing to delete live plan IDs: ${live.map((row) => row.id).join(",")}`);
            const deletable = (rows || []).map((row) => row.id);
            if (deletable.length) {
              const { error } = await db.from("plans").delete().in("id", deletable);
              if (error) throw new Error(`Could not delete requested plans: ${error.message}`);
              const { data: remaining, error: verifyError } = await db.from("plans").select("id").in("id", deletable);
              if (verifyError) throw new Error(`Could not verify requested plan deletion: ${verifyError.message}`);
              if ((remaining || []).length) throw new Error(`Requested plan deletion was incomplete: ${remaining.map((row) => row.id).join(",")}`);
            }
            return ids.map((id) => {
              const row = byId.get(String(id));
              return row ? { id, name: row.name, result: "deleted" } : { id, name: null, result: "not_found" };
            });
          }
          '''
          text = replace_between(text, 'async function deleteRequestedPlans(db, ids) {', '\n\nasync function saveAndVerify', delete_function, 'deleteRequestedPlans')

          save_function = r'''async function saveAndVerify(db, builds, requestedNames, ignoredPlanIds = []) {
            if (!requestedNames.length) return [];
            const ignored = new Set(ignoredPlanIds.map(String));
            const { data: existing, error: existingError } = await db.from("plans").select("id,name");
            if (existingError) throw new Error(`Could not check existing plan names: ${existingError.message}`);
            const usedNames = (existing || []).filter((row) => !ignored.has(String(row.id))).map((row) => row.name);
            const expectedRows = builds.map((build, index) => {
              const name = nextAvailablePlanName(requestedNames[index], usedNames);
              usedNames.push(name);
              const row = planRowFromBenchBoostBuild(build, name);
              const strictGameweeks = (build.weekly || []).map((week) => Number(week.gw));
              const validation = validatePlanWrite({ base: row.base, weeks: row.weeks, structure: row.structure, captain: row.captain, vice: row.vice, strictGameweeks });
              if (!validation.ok) throw new Error(`Generated plan ${name} failed pre-save validation: ${validation.errors.join("; ")}`);
              return row;
            });

            const { data: inserted, error: insertError } = await db.from("plans").insert(expectedRows).select("*");
            if (insertError) throw new Error(`Could not save comparison plans: ${insertError.message}`);
            const insertedIds = (inserted || []).map((row) => row.id);
            const { data: reread, error: readError } = await db.from("plans").select("*").in("id", insertedIds);
            if (readError) {
              if (insertedIds.length) await db.from("plans").delete().in("id", insertedIds);
              throw new Error(`Could not verify saved plans: ${readError.message}`);
            }
            const byId = new Map((reread || []).map((row) => [String(row.id), row]));
            const expectedByName = new Map(expectedRows.map((row) => [row.name, row]));
            const results = (inserted || []).map((row) => {
              const saved = byId.get(String(row.id));
              const expected = expectedByName.get(row.name);
              const verification = expected ? verifySavedPlan(saved, expected) : { ok: false };
              return { name: row.name, id: row.id, plan_id: row.id, verified: verification.ok, verification };
            });
            if (results.length !== expectedRows.length || results.some((row) => !row.verified)) {
              if (insertedIds.length) await db.from("plans").delete().in("id", insertedIds);
              const failed = results.filter((row) => !row.verified).map((row) => row.name).join(",") || "missing inserted rows";
              throw new Error(`Post-save canonical verification failed for ${failed}; newly inserted plans were removed.`);
            }
            return results.map(({ name, id, plan_id, verified }) => ({ name, id, plan_id, verified }));
          }
          '''
          text = replace_between(text, 'async function saveAndVerify(', '\n\nexport async function POST', save_function, 'saveAndVerify')

          old_loop = '    const builds = [];\n    for (let chipGw = parsed.gwFrom; chipGw <= parsed.gwTo; chipGw += 1) {'
          new_loop = '    const builds = [];\n    for (const chipGw of parsed.candidateChipGameweeks) {'
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit("benchboost build loop marker not found")

          persist_start = '    let deleted = [];'
          persist_end = '\n\n    const objective = {'
          if persist_start not in text or persist_end not in text:
              raise SystemExit("benchboost persistence markers not found")
          new_persist = "\n".join([
              "    let deleted = [];",
              "    let saved = [];",
              "    if (parsed.deletePlanIds.length || parsed.saveNames.length) {",
              "      const db = admin();",
              "      if (!db) return json({ ok: false, error: \"Plan saving is not configured on this deployment yet.\" }, 503);",
              "      try {",
              "        saved = await saveAndVerify(db, builds, parsed.saveNames, parsed.deletePlanIds);",
              "        deleted = await deleteRequestedPlans(db, parsed.deletePlanIds);",
              "      } catch (error) {",
              "        const newIds = saved.map((row) => row.id).filter(Boolean);",
              "        if (newIds.length) await db.from(\"plans\").delete().in(\"id\", newIds);",
              "        throw error;",
              "      }",
              "    }",
          ])
          text = replace_between(text, persist_start, persist_end, new_persist, "persistence block")


          route.write_text(text)

          doc = Path("docs/LETTA_FINAL_OPERATING_PROMPT.md")
          content = doc.read_text()
          heading = "## Exact build persistence rule"
          block = '''

          ## Exact build persistence rule

          Letta must never manually transform `builds[].weekly` into `plans.weeks`, and must never create or update an exact optimiser result through `/api/plans`.

          For exact Bench Boost comparison and persistence, call `POST /api/benchboost-compare` once with `candidate_chip_gameweeks`, `save_names` in the same order, and only the explicitly approved `delete_plan_ids`. The server performs optimisation, validation, conversion, insertion, reread, canonical verification and deletion of the obsolete plans. Gameweeks are keyed from each returned `week.gw`, never from zero-based array positions.

          Return `report_markdown` verbatim. Completion requires every saved result to have `verified = true`, all solver proof fields to be valid, and the requested candidate gameweeks to match exactly. Never repair, reinterpret or manually resave a backend result.
          '''
          if heading in content:
              content = content[:content.index(heading)].rstrip() + block + "\n"
          else:
              content = content.rstrip() + block + "\n"
          doc.write_text(content)

          contract = Path("tests/benchboost-route-contract.test.mjs")
          contract_text = contract.read_text()
          old_contract = '  assert.match(route, /for \\(let chipGw = parsed\\.gwFrom; chipGw <= parsed\\.gwTo; chipGw \\+= 1\\)/);'
          new_contract = '  assert.match(route, /candidate_chip_gameweeks/);\n  assert.match(route, /for \\(const chipGw of parsed\\.candidateChipGameweeks\\)/);\n  assert.doesNotMatch(route, /for \\(let chipGw = parsed\\.gwFrom/);'
          if old_contract in contract_text:
              contract_text = contract_text.replace(old_contract, new_contract, 1)
          elif new_contract not in contract_text:
              raise SystemExit("benchboost route contract loop marker not found")
          contract.write_text(contract_text)
          PY

          cat > tests/plan-write-validation.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { validatePlanWrite } from "../lib/plan-write-validation.mjs";

          const positions = ["GKP","GKP","DEF","DEF","DEF","DEF","DEF","MID","MID","MID","MID","MID","FWD","FWD","FWD"];
          const completeBase = positions.map((position, index) => ({
            fpl_id: index + 1,
            position,
            team_id: index + 1,
            price: 5,
            purchasePrice: 5,
            starting: index < 11,
          }));
          const validWeek = {
            transfers: [],
            startingIds: [1,3,4,5,8,9,10,11,12,13,14],
            benchOrder: [2,6,7,15],
            structure: "3-5-2",
            captain: 13,
            vice: 14,
            chip: null,
          };

          test("allows incomplete ordinary plans and chip-only future weeks", () => {
            const result = validatePlanWrite({
              base: completeBase.slice(0, 4),
              weeks: { "2": { transfers: [], chip: "benchboost" } },
            });
            assert.deepEqual(result, { ok: true, errors: [] });
          });

          test("accepts a complete weekly lineup after a valid transfer", () => {
            const weeks = {
              "2": {
                transfers: [{ out: 12, in: 16, position: "MID", team_id: 16, price: 5 }],
                startingIds: [1,3,4,5,8,9,10,11,16,13,14],
                benchOrder: [2,6,7,15],
                structure: "3-5-2",
                captain: 13,
                vice: 14,
                chip: null,
              },
            };
            assert.deepEqual(validatePlanWrite({ base: completeBase, weeks }), { ok: true, errors: [] });
          });

          test("rejects zero-based gameweek keys", () => {
            const result = validatePlanWrite({ base: completeBase, weeks: { "0": validWeek } });
            assert.equal(result.ok, false);
            assert.match(result.errors.join(" "), /never "0"/);
          });

          test("rejects overlap, incomplete roles, wrong formation and non-starting captain", () => {
            const broken = {
              ...validWeek,
              startingIds: validWeek.startingIds.slice(0, 10),
              benchOrder: [2,3,6,7],
              structure: "4-4-2",
              captain: 2,
            };
            const result = validatePlanWrite({ base: completeBase, weeks: { "1": broken }, strictGameweeks: [1] });
            assert.equal(result.ok, false);
            assert.match(result.errors.join(" "), /11 unique positive startingIds/);
            assert.match(result.errors.join(" "), /XI\/bench overlap/);
            assert.match(result.errors.join(" "), /current 15-player squad/);
            assert.match(result.errors.join(" "), /captain must be a starting player/);
          });
          JS

          cat > tests/exact-save-pipeline.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { planRowFromBenchBoostBuild, verifySavedPlan } from "../lib/benchboost-comparison.mjs";
          import { hydratePlanState } from "../lib/plan-range.mjs";
          import { squadAt } from "../lib/plan.mjs";
          import { validatePlanWrite } from "../lib/plan-write-validation.mjs";

          const positions = ["GKP","GKP","DEF","DEF","DEF","DEF","DEF","MID","MID","MID","MID","MID","FWD","FWD","FWD"];
          const players = positions.map((position, index) => ({
            fpl_id: index + 1,
            position,
            team_id: index + 1,
            team: `T${index + 1}`,
            web_name: `P${index + 1}`,
            price: 5,
          }));
          const rawWeeks = [
            { gw: 1, formation: "3-5-2", starters: [1,3,4,5,8,9,10,11,12,13,14], bench: [2,6,7,15], chip: null },
            { gw: 2, formation: "4-4-2", starters: [2,3,4,5,6,8,9,10,11,13,14], bench: [1,7,12,15], chip: "benchboost" },
            { gw: 3, formation: "4-5-1", starters: [1,3,4,5,6,8,9,10,11,12,13], bench: [2,7,14,15], chip: null },
          ];
          const weekly = rawWeeks.map((week) => ({
            ...week,
            starters: week.starters.map((id) => players[id - 1]),
            bench: week.bench.map((id) => players[id - 1]),
            bench_order: week.bench,
            captain: 13,
            vice_captain: week.starters.includes(14) ? 14 : 12,
          }));

          test("exact server conversion survives the same GW1-GW3 hydration path used by the squad screen", () => {
            const row = planRowFromBenchBoostBuild({ players, weekly }, "Exact pair");
            assert.deepEqual(Object.keys(row.weeks), ["1", "2", "3"]);
            for (const source of rawWeeks) {
              const state = hydratePlanState(row, source.gw, players);
              const displayed = state.players.filter((player) => player.starting).map((player) => player.fpl_id).sort((a, b) => a - b);
              assert.deepEqual(displayed, [...source.starters].sort((a, b) => a - b), `GW${source.gw} shifted during hydration`);
              assert.deepEqual([...state.benchOrder].sort((a, b) => a - b), [...source.bench].sort((a, b) => a - b));
            }
            assert.equal(squadAt(row, 1).chip, null);
            assert.equal(squadAt(row, 2).chip, "benchboost");
            assert.equal(squadAt(row, 3).chip, null);
            assert.equal(validatePlanWrite({ base: row.base, weeks: row.weeks, strictGameweeks: [1,2,3] }).ok, true);
            assert.equal(verifySavedPlan(structuredClone(row), row).ok, true);
          });

          test("the original zero-based off-by-one corruption is rejected", () => {
            const row = planRowFromBenchBoostBuild({ players, weekly }, "Shifted");
            const shifted = { "0": row.weeks["1"], "1": row.weeks["2"], "2": row.weeks["3"] };
            const result = validatePlanWrite({ base: row.base, weeks: shifted, strictGameweeks: [1,2,3] });
            assert.equal(result.ok, false);
            assert.match(result.errors.join(" "), /never "0"/);
            assert.match(result.errors.join(" "), /GW3 is required but missing/);
          });

          test("comparison endpoint uses only explicit candidate gameweeks and server-side persistence", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /candidate_chip_gameweeks/);
            assert.match(source, /for \(const chipGw of parsed\.candidateChipGameweeks\)/);
            assert.match(source, /saveAndVerify\(db, builds, parsed\.saveNames, parsed\.deletePlanIds\)/);
            assert.match(source, /bench_order does not exactly match the four bench players/);
            assert.doesNotMatch(source, /for \(let chipGw = parsed\.gwFrom/);
          });

          test("plans endpoint validates without banning incomplete ordinary plans", () => {
            const source = readFileSync("app/api/plans/route.js", "utf8");
            assert.match(source, /validatePlanWrite/);
            assert.match(source, /Invalid plan payload/);
            assert.doesNotMatch(source, /base must contain exactly 15 players/);
          });
          JS

      - name: Syntax and static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/plan-write-validation.mjs
          node --check app/api/plans/route.js
          node --check app/api/benchboost-compare/route.js
          grep -F 'candidate_chip_gameweeks' app/api/benchboost-compare/route.js
          grep -F 'for (const chipGw of parsed.candidateChipGameweeks)' app/api/benchboost-compare/route.js
          grep -F 'saveAndVerify(db, builds, parsed.saveNames, parsed.deletePlanIds)' app/api/benchboost-compare/route.js
          grep -F 'validatePlanWrite' app/api/plans/route.js
          grep -F 'String(week.gw)' lib/benchboost-comparison.mjs
          ! grep -F 'for (let chipGw = parsed.gwFrom' app/api/benchboost-compare/route.js

      - name: Run focused regression tests
        run: |
          node --test \
            tests/plan-write-validation.test.mjs \
            tests/exact-save-pipeline.test.mjs \
            tests/benchboost-comparison.test.mjs \
            tests/benchboost-route-contract.test.mjs \
            tests/exact-global-build.test.mjs \
            tests/plan-range.test.mjs \
            tests/plan.test.mjs

      - name: Run complete test suite
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/api/benchboost-compare/route.js \
            app/api/plans/route.js \
            lib/plan-write-validation.mjs \
            docs/LETTA_FINAL_OPERATING_PROMPT.md \
            tests/plan-write-validation.test.mjs \
            tests/exact-save-pipeline.test.mjs \
            tests/benchboost-route-contract.test.mjs
          git commit -m "Repair exact plan persistence and prevent shifted gameweeks"
          git push
