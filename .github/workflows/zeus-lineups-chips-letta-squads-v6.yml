name: Deploy ZEUS Lineups, Chips and Letta Squads V6
run-name: ZEUS lineups, chips and saved squads V5 · ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zeus-lineups-chips-saved-squads-v5
  cancel-in-progress: false

jobs:
  apply-test-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record base and create reversible backup
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          backup_branch="backup-pre-lineups-chips-${short_sha}"
          backup_tag="pre-lineups-chips-${short_sha}"

          if ! git ls-remote --exit-code --heads origin "${backup_branch}" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${backup_branch}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${backup_tag}" >/dev/null 2>&1; then
            git tag "${backup_tag}" HEAD
            git push origin "refs/tags/${backup_tag}"
          fi

          echo "BASE_SHA=${base_sha}" >> "$GITHUB_ENV"
          echo "BACKUP_BRANCH=${backup_branch}" >> "$GITHUB_ENV"
          echo "BACKUP_TAG=${backup_tag}" >> "$GITHUB_ENV"

      - name: Verify the expected current ZEUS source
        shell: bash
        run: |
          set -euo pipefail
          test -f config/lineups.json
          test -f lib/external_xpts.mjs
          test -f lib/lineups.mjs
          test -f lib/plan.mjs
          test -f app/builder/BuilderClient.jsx
          test -f app/squad/SquadClient.jsx
          test -f app/api/brief/route.js
          grep -Fq 'export function buildExternalProjectionModel' lib/external_xpts.mjs
          grep -Fq 'const [selectedId, setSelectedId] = React.useState("live");' app/squad/SquadClient.jsx
          grep -Fq 'const selectedTotal = React.useMemo' app/builder/BuilderClient.jsx
          grep -Fq 'view === "fixtures"' lib/server/fpl_brief_api.mjs
          grep -Fq 'difficulty_scale: "0 = easiest, 100 = hardest"' lib/server/fpl_brief_api.mjs
          grep -Fq 'FixtureOutlook' components/FixtureOutlook.jsx
          ! grep -Fq 'Easiest fixtures ahead' app/page.jsx

      - name: Apply all four connected changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zeus-feature-bundle
          mkdir -p /tmp/zeus-feature-bundle
