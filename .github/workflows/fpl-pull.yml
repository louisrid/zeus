name: fpl-pull
on:
  schedule:
    # Twenty minutes before xpts-pull, because that job overrides club, position and price from the
    # official bootstrap and the database should already agree with it. Running both on the hour meant
    # two jobs starting together, and the two that push commits rebasing over each other for nothing.
    - cron: "40 5,11,17,23 * * *"   # four times a day, ahead of the projections import
  workflow_dispatch: {}      # manual run button

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node jobs/fpl_bootstrap.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
