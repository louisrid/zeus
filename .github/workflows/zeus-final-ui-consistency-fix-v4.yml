name: Apply Final ZEUS UI Consistency Fix V4
run-name: Final ZEUS UI consistency fix V4 · ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zeus-final-ui-consistency-fix-v4
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record base and create reversible backup
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          backup_branch="backup-pre-ui-consistency-${short_sha}"
          backup_tag="pre-ui-consistency-${short_sha}"

          if ! git ls-remote --exit-code --heads origin "${backup_branch}" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${backup_branch}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${backup_tag}" >/dev/null 2>&1; then
            git tag "${backup_tag}" HEAD
            git push origin "refs/tags/${backup_tag}"
          fi

          echo "BASE_SHA=${base_sha}" >> "$GITHUB_ENV"
          echo "BACKUP_BRANCH=${backup_branch}" >> "$GITHUB_ENV"
          echo "BACKUP_TAG=${backup_tag}" >> "$GITHUB_ENV"
          echo "Backup branch: ${backup_branch}"
          echo "Backup tag: ${backup_tag}"

      - name: Apply the complete requested change set
