name: tidy
# ONE-CLICK CLEANUP, no terminal required. Actions tab, choose "tidy", press "Run workflow".
#
# A zip can only add or overwrite, so files removed from the project cannot leave the repo by upload.
# This deletes them properly and commits the result. Everything listed is already retired: inert stubs
# that exist only because they could not be deleted.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired files and directories
        run: |
          git rm -rq --ignore-unmatch \
            app/api/analyst \
            components/AskAnalyst.jsx \
            tests/analyst.test.mjs \
            supabase/migration-019.sql \
            lib/harness.mjs \
            tests/harness.test.mjs \
            jobs/projection_run.mjs \
            app/legacy \
            mockups \
            workflows-for-github \
            HOW-TO-APPLY.md \
            TIDY-WORKFLOW.yml.txt \
            components/PlanList.jsx \
            components/PlanTimeline.jsx \
            components/TransferPicker.jsx \
            components/PlayerPicker.jsx \
            components/BuildPitch.jsx \
            components/FeedbackPanel.jsx \
            components/TeamAndChips.jsx \
            components/Feedback.jsx \
            components/Stub.jsx \
            baseline-gate.yml \
            history-load.yml \
            lp-retire.yml \
            github/workflows/backtest-engine.yml \
            .github/workflows/app/builder/BuilderClient.jsx \
            .github/workflows/components/BuilderPitch.jsx \
            .github/workflows/lib/solver/score.mjs \
            .github/workflows/lib/projections.js \
            .github/workflows/tests/render.test.mjs \
            .github/workflows/docs/DECISIONS.md \
            jobs/lineups_pull.mjs \
            .github/workflows/lineups-pull.yml \
            supabase/migration-023.sql \
            supabase/migration-024.sql
      - name: Refuse to delete anything still imported
        run: |
          # Checks every file on the list above, not a fixed list of old names. HeadlineBoxes was retired in
          # one delivery, brought back into use two deliveries later, and deleted here anyway: the site
          # stopped building. A check that only knows about yesterday's retirements cannot catch that.
          fail=0
          for f in $(git diff --cached --name-only --diff-filter=D); do
            case "$f" in
              *.jsx|*.js|*.mjs) ;;
              *) continue ;;
            esac
            base=$(basename "$f" | sed 's/\.[^.]*$//')
            dir=$(dirname "$f")
            if grep -rnE "(from|require\()[\"'][^\"']*(${dir}/${base}|/${base})[\"']" \
                --include='*.jsx' --include='*.js' --include='*.mjs' \
                app components lib jobs 2>/dev/null | grep -v "^${f}:"; then
              echo "STILL IMPORTED: $f"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "Refusing to commit: deleting those would break the build."
            exit 1
          fi
      - name: Verify the tree still passes
        run: |
          npm install
          npm test
      - name: And that it still builds
        # The suite passed while the site would not compile, because a missing import is a build error, not
        # a test failure. Both gates now run before anything is committed.
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git diff --cached --quiet; then
            echo "Nothing to remove. Already tidy."
          else
            git commit -qm "tidy: remove retired files"
            git push
          fi
