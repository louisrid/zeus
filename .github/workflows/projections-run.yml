name: projections-run
on:
  schedule:
    - cron: "23 7 * * 3"   # Wednesday, after the odds pull. Friday and Saturday runs
                           # now live inside presser-pull, AFTER the team news lands.
  workflow_dispatch: {}
jobs:
  projections:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - name: Read-only projection data audit
        run: npm run audit:projection-data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Local eight-gameweek dry run
        run: npm run dry-run:eight-gameweeks
      - run: node jobs/projections_run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROJECTION_GWS: "8"
          PROJECTION_START_GW: "1"
