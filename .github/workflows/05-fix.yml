name: 05 Final Exclusion Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 05-final-exclusion-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot permanent workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            ! -name '02-fix.yml' \
            ! -name '03-fix.yml' \
            ! -name '04-fix.yml' \
            ! -name '05-fix.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/permanent-workflows.before

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent exclusion fix
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/excluded-player-ids.mjs <<'JS'
          const own = (value, key) => Object.prototype.hasOwnProperty.call(value || {}, key);

          function normaliseIds(value, field) {
            if (!Array.isArray(value)) {
              return { ok: false, error: `${field} must be an array of positive integer player IDs.` };
            }
            const ids = value.map(Number);
            if (ids.some((id) => !Number.isInteger(id) || id <= 0)) {
              return { ok: false, error: `${field} must contain only positive integer player IDs.` };
            }
            return { ok: true, value: [...new Set(ids)].sort((a, b) => a - b) };
          }

          export function parseExcludedPlayerIds(body = {}) {
            const input = body && typeof body === "object" ? body : {};
            const fields = ["excluded_player_ids", "exclude_player_ids", "ignores"]
              .filter((field) => own(input, field));

            if (!fields.length) return { ok: true, value: [], source: "none" };

            const parsed = [];
            for (const field of fields) {
              const result = normaliseIds(input[field], field);
              if (!result.ok) return result;
              parsed.push({ field, value: result.value });
            }

            const canonical = JSON.stringify(parsed[0].value);
            if (parsed.some((entry) => JSON.stringify(entry.value) !== canonical)) {
              return {
                ok: false,
                error: `Conflicting exclusion fields were supplied: ${fields.join(", ")}. Supply one matching exclusion list.`,
              };
            }

            return {
              ok: true,
              value: parsed[0].value,
              source: fields.includes("excluded_player_ids")
                ? "excluded_player_ids"
                : fields.includes("exclude_player_ids")
                  ? "exclude_player_ids"
                  : "ignores",
            };
          }
          JS

          python3 <<'PY'
          from pathlib import Path


          def replace_or_confirm(text, old, new, label):
              if new in text:
                  if text.count(new) != 1:
                      raise SystemExit(
                          f"{label}: expected one already-applied marker, found {text.count(new)}"
                      )
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source marker, found {count}")
              return text.replace(old, new, 1)


          def block(*lines):
              return "\n".join(lines) + "\n"


          route = Path("app/api/benchboost-compare/route.js")
          text = route.read_text()

          old_import = 'import { parseMinimumBenchSpend } from "../../../lib/minimum-bench-spend.mjs";\n'
          new_import = (
              old_import
              + 'import { parseExcludedPlayerIds } from "../../../lib/excluded-player-ids.mjs";\n'
          )
          text = replace_or_confirm(text, old_import, new_import, "exclusion parser import")

          parse_marker = "  const exclusionResult = parseExcludedPlayerIds(body);\n"
          if parse_marker not in text:
              start_marker = (
                  "  const rawExcludePlayerIds = Array.isArray(body?.exclude_player_ids) "
                  "? body.exclude_player_ids.map(Number) : [];\n"
              )
              end_marker = (
                  "  return { ok: true, gwFrom, gwTo, budget, minimumBenchSpend, "
                  "candidateChipGameweeks, saveNames, deletePlanIds, excludePlayerIds };\n"
              )
              start = text.find(start_marker)
              end = text.find(end_marker, start + 1)
              if start < 0 or end < 0:
                  raise SystemExit(
                      "exclusion request parsing: could not locate the current legacy parser boundaries"
                  )
              end += len(end_marker)
              replacement = block(
                  "  const exclusionResult = parseExcludedPlayerIds(body);",
                  "  if (!exclusionResult.ok) return exclusionResult;",
                  "  const excludePlayerIds = exclusionResult.value;",
                  "  return {",
                  "    ok: true,",
                  "    gwFrom,",
                  "    gwTo,",
                  "    budget,",
                  "    minimumBenchSpend,",
                  "    candidateChipGameweeks,",
                  "    saveNames,",
                  "    deletePlanIds,",
                  "    excludePlayerIds,",
                  "    exclusionInputField: exclusionResult.source,",
                  "  };",
              )
              text = text[:start] + replacement + text[end:]
          elif text.count(parse_marker) != 1:
              raise SystemExit(
                  f"exclusion request parsing: expected one applied parser, found {text.count(parse_marker)}"
              )

          text = replace_or_confirm(
              text,
              'function validateBuild(build, budget, minimumBenchSpend, gwFrom, gwTo) {\n',
              'function validateBuild(build, budget, minimumBenchSpend, gwFrom, gwTo, excludedPlayerIds = []) {\n',
              "validator signature",
          )

          leak_marker = "  const excludedSet = new Set((excludedPlayerIds || []).map(Number));\n"
          if leak_marker not in text:
              anchor = "  const squadSet = new Set(squadIds);\n"
              if text.count(anchor) != 1:
                  raise SystemExit(
                      f"validator exclusion leak check: expected one squad anchor, found {text.count(anchor)}"
                  )
              leak_block = block(
                  "  const excludedSet = new Set((excludedPlayerIds || []).map(Number));",
                  "  const leakedExcludedIds = squadIds.filter((id) => excludedSet.has(id));",
                  "  if (leakedExcludedIds.length) {",
                  "    errors.push(`excluded players appeared in the squad: ${[...new Set(leakedExcludedIds)].join(\",\")}`);",
                  "  }",
              )
              text = text.replace(anchor, anchor + leak_block, 1)
          elif text.count(leak_marker) != 1:
              raise SystemExit(
                  f"validator exclusion leak check: expected one applied block, found {text.count(leak_marker)}"
              )

          text = replace_or_confirm(
              text,
              '      const validation = validateBuild(build, parsed.budget, parsed.minimumBenchSpend, parsed.gwFrom, parsed.gwTo);\n',
              '      const validation = validateBuild(build, parsed.budget, parsed.minimumBenchSpend, parsed.gwFrom, parsed.gwTo, parsed.excludePlayerIds);\n',
              "validator exclusion argument",
          )

          guard_marker = "    const exclusionLeaks = builds.flatMap((build) =>\n"
          if guard_marker not in text:
              anchor = "    const wrongMinimum = builds.filter((build) =>\n"
              if text.count(anchor) != 1:
                  raise SystemExit(
                      f"pre-persistence exclusion guard: expected one insertion point, found {text.count(anchor)}"
                  )
              guard = block(
                  "    const excludedSet = new Set(parsed.excludePlayerIds);",
                  "    const exclusionLeaks = builds.flatMap((build) =>",
                  "      (build.players || [])",
                  "        .map(idOf)",
                  "        .filter((id) => excludedSet.has(id))",
                  "        .map((id) => ({ chip_gw: build.chip_gw, player_id: id }))",
                  "    );",
                  "    if (exclusionLeaks.length) {",
                  "      return json({",
                  "        ok: false,",
                  "        error: \"Hard exclusions were not preserved by every build. Nothing was saved or deleted.\",",
                  "        requested_excluded_player_ids: parsed.excludePlayerIds,",
                  "        exclusion_input_field: parsed.exclusionInputField,",
                  "        exclusion_leaks: exclusionLeaks,",
                  "      }, 422);",
                  "    }",
                  "",
              )
              text = text.replace(anchor, guard + anchor, 1)
          elif text.count(guard_marker) != 1:
              raise SystemExit(
                  f"pre-persistence exclusion guard: expected one applied guard, found {text.count(guard_marker)}"
              )

          text = replace_or_confirm(
              text,
              block(
                  "      excluded_player_ids: parsed.excludePlayerIds,",
                  "      primary_metric: \"builds[].total.net_xpts\",",
              ),
              block(
                  "      excluded_player_ids: parsed.excludePlayerIds,",
                  "      exclusion_input_field: parsed.exclusionInputField,",
                  "      exclusions_verified_absent_from_all_builds: true,",
                  "      primary_metric: \"builds[].total.net_xpts\",",
              ),
              "objective exclusion proof",
          )

          text = replace_or_confirm(
              text,
              block(
                  "      excluded_player_ids: parsed.excludePlayerIds,",
                  "      objective,",
              ),
              block(
                  "      excluded_player_ids: parsed.excludePlayerIds,",
                  "      exclusion_input_field: parsed.exclusionInputField,",
                  "      exclusions_verified_absent_from_all_builds: true,",
                  "      objective,",
              ),
              "response exclusion proof",
          )

          route.write_text(text)

          control_test = Path("tests/configurable-optimiser-controls.test.mjs")
          test_text = control_test.read_text()
          test_text = replace_or_confirm(
              test_text,
              '  assert.match(source, /exclude_player_ids/);\n',
              '  assert.match(source, /parseExcludedPlayerIds/);\n',
              "stale optimiser-control assertion",
          )
          control_test.write_text(test_text)

          prompt = Path("docs/LETTA_FINAL_OPERATING_PROMPT.md")
          prompt_text = prompt.read_text()
          old_input = (
              "- `exclude_player_ids`: hard exclusions resolved from the user's ordinary-language player names\n"
          )
          new_input = (
              "- `excluded_player_ids`: canonical hard exclusions resolved from the user's ordinary-language "
              "player names; the backend also accepts the legacy `exclude_player_ids` and `ignores` aliases\n"
          )
          prompt_text = replace_or_confirm(
              prompt_text,
              old_input,
              new_input,
              "canonical Letta exclusion input",
          )

          contract_heading = "### Hard-exclusion safety contract\n"
          if contract_heading not in prompt_text:
              heading = "## Natural-language optimiser controls\n"
              if prompt_text.count(heading) != 1:
                  raise SystemExit(
                      f"Letta hard-exclusion contract: expected one section heading, found {prompt_text.count(heading)}"
                  )
              contract = block(
                  "## Natural-language optimiser controls",
                  "",
                  "### Hard-exclusion safety contract",
                  "",
                  "When the user asks to exclude named players, resolve every name against current ZEUS data and send the complete list as `excluded_player_ids`. The backend accepts the older `exclude_player_ids` and `ignores` aliases only for compatibility; conflicting lists must fail.",
                  "",
                  "Before accepting, saving, replacing or deleting any plan, verify all of the following:",
                  "",
                  "- the response echoes exactly the complete requested exclusion list;",
                  "- `exclusions_verified_absent_from_all_builds` is true;",
                  "- the report lists the excluded players rather than `Hard exclusions: none`;",
                  "- none of the excluded IDs appears in any returned squad.",
                  "",
                  "If any check fails, stop before persistence. Never accept an empty exclusion response after exclusions were requested, and never claim exclusions were applied merely because they were sent in the request.",
              )
              prompt_text = prompt_text.replace(heading, contract, 1)
          elif prompt_text.count(contract_heading) != 1:
              raise SystemExit(
                  f"Letta hard-exclusion contract: expected one applied section, found {prompt_text.count(contract_heading)}"
              )
          prompt.write_text(prompt_text)
          PY

          cat > tests/excluded-player-ids.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { parseExcludedPlayerIds } from "../lib/excluded-player-ids.mjs";

          test("canonical excluded_player_ids is accepted", () => {
            assert.deepEqual(
              parseExcludedPlayerIds({ excluded_player_ids: [445, 4, 4, 94] }),
              { ok: true, value: [4, 94, 445], source: "excluded_player_ids" },
            );
          });

          test("legacy aliases remain accepted", () => {
            assert.deepEqual(
              parseExcludedPlayerIds({ exclude_player_ids: [4, 94] }),
              { ok: true, value: [4, 94], source: "exclude_player_ids" },
            );
            assert.deepEqual(
              parseExcludedPlayerIds({ ignores: [4, 94] }),
              { ok: true, value: [4, 94], source: "ignores" },
            );
          });

          test("matching aliases pass and conflicting aliases fail", () => {
            assert.equal(
              parseExcludedPlayerIds({ excluded_player_ids: [4, 94], exclude_player_ids: [94, 4] }).ok,
              true,
            );
            const conflict = parseExcludedPlayerIds({
              excluded_player_ids: [4],
              exclude_player_ids: [94],
            });
            assert.equal(conflict.ok, false);
            assert.match(conflict.error, /Conflicting exclusion fields/);
          });

          test("invalid exclusion values are rejected", () => {
            assert.equal(parseExcludedPlayerIds({ excluded_player_ids: "4" }).ok, false);
            assert.equal(parseExcludedPlayerIds({ excluded_player_ids: [0, 4] }).ok, false);
            assert.equal(parseExcludedPlayerIds({ excluded_player_ids: [4.5] }).ok, false);
          });
          JS

          cat > tests/exclusion-persistence-guard.test.mjs <<'JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          test("comparison accepts canonical and legacy exclusion inputs", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /parseExcludedPlayerIds/);
            assert.match(source, /exclusionResult\.value/);
            assert.match(source, /exclusion_input_field/);
          });

          test("excluded players are checked before persistence", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.match(source, /excluded players appeared in the squad/);
            assert.match(source, /Hard exclusions were not preserved by every build/);
            assert.match(source, /Nothing was saved or deleted/);
            assert.match(
              source,
              /validateBuild\(build, parsed\.budget, parsed\.minimumBenchSpend, parsed\.gwFrom, parsed\.gwTo, parsed\.excludePlayerIds\)/,
            );
            const guardIndex = source.indexOf("const exclusionLeaks");
            const saveIndex = source.indexOf("saved = await saveAndVerify");
            const deleteIndex = source.indexOf("deleted = await deleteRequestedPlans");
            assert.ok(guardIndex >= 0 && saveIndex > guardIndex);
            assert.ok(deleteIndex > saveIndex);
          });

          test("successful responses include explicit exclusion proof", () => {
            const source = readFileSync("app/api/benchboost-compare/route.js", "utf8");
            assert.equal(
              (source.match(/exclusions_verified_absent_from_all_builds: true/g) || []).length,
              2,
            );
          });

          test("Letta contract uses the canonical field and rejects missing proof", () => {
            const source = readFileSync("docs/LETTA_FINAL_OPERATING_PROMPT.md", "utf8");
            assert.match(source, /Hard-exclusion safety contract/);
            assert.match(source, /send the complete list as `excluded_player_ids`/);
            assert.match(source, /Never accept an empty exclusion response/);
            assert.match(source, /none of the excluded IDs appears in any returned squad/);
          });
          JS

      - name: Syntax and source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/excluded-player-ids.mjs
          node --check app/api/benchboost-compare/route.js
          git add -N lib/excluded-player-ids.mjs tests/excluded-player-ids.test.mjs tests/exclusion-persistence-guard.test.mjs
          git diff --check
          grep -F 'parseExcludedPlayerIds' app/api/benchboost-compare/route.js
          grep -F 'excluded players appeared in the squad' app/api/benchboost-compare/route.js
          grep -F 'Hard exclusions were not preserved by every build. Nothing was saved or deleted.' app/api/benchboost-compare/route.js
          test "$(grep -Fc 'exclusions_verified_absent_from_all_builds: true' app/api/benchboost-compare/route.js)" -eq 2
          grep -F 'Hard-exclusion safety contract' docs/LETTA_FINAL_OPERATING_PROMPT.md
          grep -F '`excluded_player_ids`' docs/LETTA_FINAL_OPERATING_PROMPT.md

      - name: Focused regression tests
        run: |
          node --test \
            tests/excluded-player-ids.test.mjs \
            tests/exclusion-persistence-guard.test.mjs \
            tests/configurable-optimiser-controls.test.mjs \
            tests/benchboost-route-contract.test.mjs \
            tests/benchboost-comparison.test.mjs \
            tests/exact-save-pipeline.test.mjs \
            tests/plan-write-validation.test.mjs

      - name: Complete test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Remove only temporary repair workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/02-fix.yml \
            .github/workflows/03-fix.yml \
            .github/workflows/04-fix.yml \
            .github/workflows/05-fix.yml

          find .github/workflows -maxdepth 1 -type f \
            ! -name '02-fix.yml' \
            ! -name '03-fix.yml' \
            ! -name '04-fix.yml' \
            ! -name '05-fix.yml' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/permanent-workflows.after
          diff -u /tmp/permanent-workflows.before /tmp/permanent-workflows.after

          test -f .github/workflows/ci.yml

          python3 <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/02-fix.yml",
              ".github/workflows/03-fix.yml",
              ".github/workflows/04-fix.yml",
              ".github/workflows/05-fix.yml",
              "app/api/benchboost-compare/route.js",
              "docs/LETTA_FINAL_OPERATING_PROMPT.md",
              "lib/excluded-player-ids.mjs",
              "tests/configurable-optimiser-controls.test.mjs",
              "tests/excluded-player-ids.test.mjs",
              "tests/exclusion-persistence-guard.test.mjs",
          }
          required = {
              "app/api/benchboost-compare/route.js",
              "docs/LETTA_FINAL_OPERATING_PROMPT.md",
              "lib/excluded-player-ids.mjs",
              "tests/configurable-optimiser-controls.test.mjs",
              "tests/excluded-player-ids.test.mjs",
              "tests/exclusion-persistence-guard.test.mjs",
          }
          tracked = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          actual = tracked | untracked
          unexpected = sorted(actual - allowed)
          missing = sorted(required - actual)
          if unexpected:
              raise SystemExit(f"Unexpected files changed: {unexpected}")
          if missing:
              raise SystemExit(f"Required files did not change: {missing}")
          PY

          echo "Remaining workflows:"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix hard exclusions and guard plan replacement"
          git push origin main
