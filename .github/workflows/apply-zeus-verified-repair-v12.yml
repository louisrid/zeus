          node --check lib/engine/lineup_evidence.mjs
          node --check lib/projection_generation.mjs
          node --check lib/server/fpl_brief_api.mjs
          node --check jobs/projection_integrity_v12.mjs
          node --check app/api/fpl-brief/route.js
          while IFS= read -r file; do
            case "$file" in
              *.js|*.mjs) node --check "$file" ;;
            esac
          done < <(grep -rl 'fpl_brief_api.mjs' app/api --include='route.js' --include='route.mjs' 2>/dev/null || true)

      - name: Targeted projection and API contracts
        run: |
          set -euo pipefail
          node --test tests/xpts_v12_contract.test.mjs
          node --test tests/xpts_overhaul_contract.test.mjs

      - name: Mock FPL brief runtime
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const projections = [
            { player_id: 1, gw: 1, model_version: "same-version", computed_at: "2026-07-30T03:00:04Z", ep_mean: 6, r_p_start: 0.95, r_exp_minutes: 86, minutes_source: "lineup-starter", rate_source: "understat" },
            { player_id: 2, gw: 1, model_version: "same-version", computed_at: "2026-07-26T03:00:00Z", ep_mean: 9 },
          ];
          const players = [
            { id: 1, fpl_id: 101, web_name: "Current", team_id: 10, position: "MID", now_cost: 95 },
            { id: 2, fpl_id: 102, web_name: "Stale", team_id: 10, position: "MID", now_cost: 80 },
          ];
          const teams = [{ id: 10, short_name: "TST" }];
          globalThis.fetch = async (url) => {
            const value = String(url);
            if (value.includes("/projections?select=gw")) return new Response(JSON.stringify([{ gw: 1 }]), { status: 200 });
            if (value.includes("/projections?select=*")) return new Response(JSON.stringify(projections), { status: 200 });
            if (value.includes("/players?")) return new Response(JSON.stringify(players), { status: 200 });
            if (value.includes("/teams?")) return new Response(JSON.stringify(teams), { status: 200 });
            return new Response("not found", { status: 404 });
          };
          const { GET } = await import("./lib/server/fpl_brief_api.mjs");
          const response = await GET(new Request("https://zeus.example/api/fpl-brief?gw=1"));
          const body = await response.json();
          if (response.status !== 200 || body.players.length !== 1 || body.players[0].name !== "Current" || body.stale_rows_excluded !== 1) {
            throw new Error(JSON.stringify({ status: response.status, body }));
          }
          console.log("FPL_BRIEF_RUNTIME_PASSED", response.status, body.players[0].name, body.stale_rows_excluded);
          NODE

      - name: Mock stale-row cleanup runtime
        shell: bash
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-key
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const fresh = Array.from({ length: 60 }, (_, index) => ({
            player_id: index + 1,
            gw: 1,
            computed_at: `2026-07-30T03:00:${String(index % 10).padStart(2, "0")}.000Z`,
            model_version: "same-version",
            ep_mean: 2.5,
            r_exp_minutes: 80,
            r_p_start: 0.9,
            minutes_source: "forecast",
            lineup_version: "x",
            rate_source: "understat",
            lambda_team: 1.5,
            lambda_opponent: 1.2,
          }));
          const stale = { player_id: 999, gw: 1, computed_at: "2026-07-26T03:00:00.000Z", model_version: "same-version", ep_mean: 5 };
          globalThis.fetch = async (url, init = {}) => {
            const method = init.method || "GET";
            if (method === "GET") return new Response(JSON.stringify([...fresh, stale]), { status: 200 });
            if (method === "DELETE") {
              if (!String(url).includes("computed_at=lt.") || String(url).includes("model_version")) return new Response("unsafe filter", { status: 400 });
              return new Response(JSON.stringify([stale]), { status: 200 });
            }
            return new Response("bad request", { status: 400 });
          };
          const { cleanupStaleProjections } = await import("./jobs/projection_integrity_v12.mjs");
          const report = await cleanupStaleProjections();
          if (report.deleted_rows !== 1 || report.gameweeks[0].current_rows !== 60) throw new Error(JSON.stringify(report));
          console.log("PROJECTION_CLEANUP_RUNTIME_PASSED", report.deleted_rows, report.gameweeks[0].current_rows);
          NODE
          rm -f projection-integrity-v12-report.json

      - name: Install dependencies
        run: npm install

      - name: Run complete repository tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Verify final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes required. Zeus verified repair v12 is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix projection generations and FPL brief API"
          git push origin HEAD:main
