name: Apply Zeus verified repair v12

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decode, verify and apply v12
        shell: bash
        run: |
          set -euo pipefail
          echo "Zeus verified repair v12"
          rm -rf /tmp/zeus-v12
          mkdir -p /tmp/zeus-v12
          before_browser="$(sha256sum lib/projections.js | cut -d' ' -f1)"
          : > /tmp/zeus-v12/projection-workflows-before.sha
          shopt -s nullglob
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            case "$(basename "$file")" in
              apply-zeus-*|apply-xpts-*|projection-integrity-v12.yml) continue ;;
            esac
            if grep -Eq 'jobs/projections_run\.mjs|projections_run' "$file"; then
              sha256sum "$file" >> /tmp/zeus-v12/projection-workflows-before.sha
            fi
          done
          sort -o /tmp/zeus-v12/projection-workflows-before.sha /tmp/zeus-v12/projection-workflows-before.sha
