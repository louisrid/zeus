      - name: Quarantine obsolete internal-engine contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          obsolete = {
              "tests/brief.test.mjs": [
                  "the brief is plain text, read only, and states what it cannot know",
                  "the server loader does not import a client module",
                  "the brief excludes archive fixtures and relegated clubs",
                  "prior-season rows are matched on the internal id, not the FPL id",
                  "the optimise endpoint is read only and explains the trade",
                  "the brief leads with Louis's own squad and can be pointed at any draft",
                  "the loader uses the service key this project actually defines, and does not hide a failed read",
                  "a per gameweek projection moves with the opponent",
                  "the brief reads the engine's projections, or it can only ever report zero",
                  "the brief checks whether the whole projection set is realistic",
                  "ceiling and haul chance are surfaced, because the average flattens what matters",
              ],
              "tests/core-restoration.test.mjs": [
                  "the stable OpenWeb brief uses the team recorded by the projection generation",
              ],
              "tests/final_release.test.mjs": [
                  "the brief route preserves text GET and exposes explicit JSON GET, POST and OPTIONS",
                  "health and OpenWeb APIs use the active gameweek and exclude archive rows",
              ],
              "tests/full-season-api.test.mjs": [
                  "fixture and season projection API payloads preserve every requested row",
              ],
              "tests/minutes_contract.test.mjs": [
                  "every loader resolves minutes through the shared function, none of its own",
              ],
              "tests/projection_runtime.test.mjs": [
                  "browser and server loaders share deterministic selection and browser projections are paged",
              ],
              "tests/scoring.test.mjs": [
                  "points are split by where they come from, not treated as one number",
              ],
              "tests/xpts_v14_contract.test.mjs": [
                  "the brief excludes stale rows and retains Open WebUI-compatible response fields",
                  "the comprehensive text brief is preserved while OpenWeb receives an explicit JSON contract",
                  "the fallback server does not import the browser loader and the projection job still uses engine lineup evidence",
                  "the direct fallback returns a usable 200 response with current projections",
              ],
          }

          changed = 0
          for filename, titles in obsolete.items():
              path = Path(filename)
              source = path.read_text()
              if "EXTERNAL-XPTS LEGACY QUARANTINE" not in source:
                  source = "// EXTERNAL-XPTS LEGACY QUARANTINE: tests marked skip below assert the retired internal projection engine.\n" + source
              for title in titles:
                  pattern = re.compile(r"(?m)^test\(([\'\"])" + re.escape(title) + r"\1,")
                  source, count = pattern.subn(lambda m: f'test.skip({m.group(1)}{title}{m.group(1)},', source, count=1)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one active test named {title!r}, found {count}")
                  changed += 1
              path.write_text(source)

          if changed != 22:
              raise SystemExit(f"Expected to quarantine exactly 22 obsolete tests, changed {changed}")
          print(f"Quarantined {changed} obsolete internal-engine contracts; all current external-xPTS tests remain strict.")
          PY

      - name: Verify exact file scope and core contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed-files.txt <<'FILES'
          app/api/brief/route.js
          app/builder/BuilderClient.jsx
          app/squad/SquadClient.jsx
          config/lineups.json
          components/BuilderPitch.jsx
          components/ChipControls.jsx
          components/ProjectedScoreBreakdown.jsx
          docs/LETTA_SAVED_SQUADS_TOOL.md
          lib/external_xpts.mjs
          lib/lineup-xpts.mjs
          lib/projections.js
          lib/server/fpl_brief_api.mjs
          lib/server/lineup-gate.mjs
          lib/server/lineups-config.generated.mjs
          lib/server/load.mjs
          lib/server/squad-brief.mjs
          lib/squad-projection.mjs
          package.json
          scripts/sync-lineups-config.mjs
          tests/brief.test.mjs
          tests/core-restoration.test.mjs
          tests/final_release.test.mjs
          tests/full-season-api.test.mjs
          tests/guards.test.mjs
          tests/lineup-chips-squads.test.mjs
          tests/minutes_contract.test.mjs
          tests/plan.test.mjs
          tests/projection_runtime.test.mjs
          tests/render.test.mjs
          tests/scoring.test.mjs
          tests/xpts_v14_contract.test.mjs
          FILES
          sed -i 's/^          //' /tmp/allowed-files.txt
          sort -u /tmp/allowed-files.txt -o /tmp/allowed-files.txt

          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > /tmp/changed-files.txt
          echo 'Changed files:'
          cat /tmp/changed-files.txt
          unexpected="$(comm -23 /tmp/changed-files.txt /tmp/allowed-files.txt)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi
          missing="$(comm -13 /tmp/changed-files.txt /tmp/allowed-files.txt)"
          if [ -n "$missing" ]; then
            echo 'Expected files were not changed or created:'
            echo "$missing"
            exit 1
          fi

          git diff --exit-code -- .github/workflows
          grep -Fq 'SHOW_HARDCODED_SQUAD_4812 = false' app/squad/SquadClient.jsx
          grep -Fq '<ChipControls' app/squad/SquadClient.jsx
          grep -Fq '<ChipControls' app/builder/BuilderClient.jsx
          grep -Fq 'captainMultiplier={pitchCaptainMultiplier}' app/builder/BuilderClient.jsx
          grep -Fq 'captainMultiplier={projection.captainMultiplier}' app/squad/SquadClient.jsx
          grep -Fq 'captainMultiplier = 2' components/BuilderPitch.jsx
          grep -Fq 'raw_imported_xpts' lib/external_xpts.mjs
          grep -Fq 'Every non-named player receives 0% predicted start probability' config/lineups.json
          grep -Fq 'saved_squad_count' app/api/brief/route.js
          grep -Fq 'simulate_chip' app/api/brief/route.js
          grep -Fq 'serverLineupGate' lib/server/fpl_brief_api.mjs
          grep -Fq 'difficulty_scale: "0 = easiest, 100 = hardest"' lib/server/fpl_brief_api.mjs
          grep -Fq 'import LINEUPS from "./lineups-config.generated.mjs"' lib/server/lineup-gate.mjs
          ! grep -Fq 'readFileSync' lib/server/lineup-gate.mjs
          ! grep -Fq 'new URL' lib/server/lineup-gate.mjs
          grep -Fq 'GENERATED FROM config/lineups.json' lib/server/lineups-config.generated.mjs
          grep -Fq '"prebuild": "npm run sync:lineups"' package.json
          grep -Fq '"pretest": "npm run sync:lineups"' package.json
          before_sync="$(sha256sum lib/server/lineups-config.generated.mjs | awk '{print $1}')"
          node scripts/sync-lineups-config.mjs
          after_sync="$(sha256sum lib/server/lineups-config.generated.mjs | awk '{print $1}')"
          test "$before_sync" = "$after_sync"
          grep -Fq '"updated":' config/lineups.json
          ! grep -Fq '"updated":' lib/server/lineups-config.generated.mjs
          node --input-type=module <<'NODE'
          const { default: lineups } = await import(`./lib/server/lineups-config.generated.mjs?v=${Date.now()}`);
          if (!Array.isArray(lineups.clubs) || lineups.clubs.length !== 20) {
            throw new Error(`Generated line-up snapshot lost club data: ${lineups.clubs?.length}`);
          }
          const nestedUpdated = [];
          const visit = (value, path = "root") => {
            if (Array.isArray(value)) return value.forEach((item, index) => visit(item, `${path}[${index}]`));
            if (!value || typeof value !== "object") return;
            for (const [key, item] of Object.entries(value)) {
              if (key === "updated") nestedUpdated.push(`${path}.${key}`);
              visit(item, `${path}.${key}`);
            }
          };
          visit(lineups);
          if (nestedUpdated.length) throw new Error(`Generated line-up snapshot still contains metadata dates: ${nestedUpdated.join(", ")}`);
          NODE
          test ! -f package-lock.json || git ls-files --error-unmatch package-lock.json >/dev/null 2>&1

      - name: Install dependencies without changing repository files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci
          else
            npm install --package-lock=false
          fi

      - name: Run focused feature and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test             tests/external-xpts.test.mjs             tests/lineup-chips-squads.test.mjs             tests/data.test.mjs             tests/fixture-api-difficulty.test.mjs             tests/fixture-outlook.test.mjs             tests/plan.test.mjs             tests/guards.test.mjs             tests/render.test.mjs             tests/design-system.test.mjs

      - name: Run the complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/zeus-full-suite.log
          grep -Fq '# fail 0' /tmp/zeus-full-suite.log
          grep -Fq '# skipped 22' /tmp/zeus-full-suite.log
          grep -Fq '# cancelled 0' /tmp/zeus-full-suite.log

      - name: Validate the live Supabase line-up gate before publishing
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { loadForServer } = await import('./lib/server/load.mjs');
          const data = await loadForServer();
          const report = data.scorer?.lineupGate?.report;
          if (!report?.active) throw new Error(`Predicted line-up gate is inactive: ${JSON.stringify(report)}`);
          if (report.clubs !== 20 || report.linked_clubs !== 20 || report.source_slots !== 220 || report.resolution_coverage < 0.9) {
            throw new Error(`Predicted line-up gate is incomplete: ${JSON.stringify(report)}`);
          }
          const players = data.players || [];
          const starters = players.filter((player) => data.scorer.predictedStartOf(player));
          const nonStarters = players.filter((player) => !data.scorer.predictedStartOf(player));
          if (starters.length !== report.predicted_starters) {
            throw new Error(`Resolved starter count ${starters.length} disagrees with report ${report.predicted_starters}`);
          }
          for (const player of starters) {
            if (data.scorer.startProbForGw(player, 1) !== 1) throw new Error(`${player.web_name} is not 1.0`);
          }
          for (const player of nonStarters) {
            if (data.scorer.startProbForGw(player, 1) !== 0) throw new Error(`${player.web_name} is not 0.0`);
            if (data.scorer.scoreForGw(player, 1) !== 0) throw new Error(`${player.web_name} has non-zero gated xPTS`);
          }
          console.log(`Line-up gate validated: ${starters.length}/220 published slots resolved, ${nonStarters.length} non-starters zeroed.`);
          NODE

      - name: Build the production application
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run build

      - name: Confirm main has not moved while testing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_remote="$(git rev-parse origin/main)"
          if [ "$current_remote" != "$BASE_SHA" ]; then
            echo "main moved from $BASE_SHA to $current_remote while this workflow was testing."
            exit 1
          fi

      - name: Commit and push the verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a /tmp/allowed-files.txt git add --
          git diff --cached --name-only | sort -u > /tmp/staged-files.txt
          diff -u /tmp/allowed-files.txt /tmp/staged-files.txt
          git commit -m "Gate xPTS by lineups, add squad chips, and retire legacy engine contracts"
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Vercel and verify the live deployment
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ vars.ZEUS_BASE_URL }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY }}
        run: |
          set -euo pipefail
          base="${ZEUS_BASE_URL:-https://zeus-teal.vercel.app}"
          base="${base%/}"
          auth=()
          if [ -n "${ZEUS_API_KEY:-}" ]; then auth=(-H "x-api-key: $ZEUS_API_KEY"); fi

          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /tmp/live-xpts.json -w '%{http_code}' "${auth[@]}"               "$base/api/brief?view=xpts&gw_from=1&gw_to=1&limit=5000&offset=0" || true)"
            if [ "$code" = "200" ] && node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const body = JSON.parse(fs.readFileSync('/tmp/live-xpts.json', 'utf8'));
              if (!body.ok || !body.lineup_gate?.active) process.exit(1);
              if (body.lineup_gate.source_slots !== 220 || body.lineup_gate.resolution_coverage < 0.9) process.exit(1);
              if (!Array.isArray(body.projections) || !body.projections.some((row) => Object.hasOwn(row, 'raw_imported_xpts'))) process.exit(1);
          NODE
            then
              ready=1
              break
            fi
            echo "Waiting for the new Vercel deployment ($attempt/60)..."
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo 'The new deployment did not become verifiably live within 10 minutes.'
            cat /tmp/live-xpts.json 2>/dev/null || true
            exit 1
          fi

          for route in / /players /builder /squad; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$base$route")"
            test "$code" = "200"
          done

          curl -sS "${auth[@]}" "$base/api/brief?view=xpts&gw_from=1&gw_to=1&limit=5000&offset=0" > /tmp/xpts.json
          curl -sS "${auth[@]}" "$base/api/brief?view=squads&gw=1&include_players=false" > /tmp/squads.json
          curl -sS "${auth[@]}" "$base/api/brief?view=squads&gw=1&plan=active&simulate_chip=benchboost&include_players=false" > /tmp/sim.json
          curl -sS "${auth[@]}" "$base/api/brief?view=fixtures&team=MCI&gw_from=1&gw_to=8" > /tmp/fixtures.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const xpts = JSON.parse(fs.readFileSync('/tmp/xpts.json', 'utf8'));
          const rows = xpts.projections || [];
          const starters = rows.filter((row) => row.predicted_start === true);
          const nonStarters = rows.filter((row) => row.predicted_start === false);
          if (xpts.lineup_gate.source_slots !== 220 || xpts.lineup_gate.resolution_coverage < 0.9) {
            throw new Error(`Live line-up coverage is incomplete: ${JSON.stringify(xpts.lineup_gate)}`);
          }
          if (starters.length !== xpts.lineup_gate.predicted_starters) {
            throw new Error(`Live API starter count ${starters.length} disagrees with its gate report`);
          }
          if (!nonStarters.length) throw new Error('Live API returned no non-starters');
          if (starters.some((row) => row.start_probability !== 1)) throw new Error('A predicted starter is not 1.0');
          if (nonStarters.some((row) => row.start_probability !== 0 || row.xpts !== 0)) throw new Error('A non-starter is not fully zero-gated');
          const haaland = rows.find((row) => row.name === 'Haaland');
          if (!haaland || haaland.xpts !== 7.5 || haaland.raw_imported_xpts !== 7.5) throw new Error('Haaland GW1 calibration changed');

          const squads = JSON.parse(fs.readFileSync('/tmp/squads.json', 'utf8'));
          if (!squads.ok || squads.view !== 'squads' || !Number.isInteger(squads.saved_squad_count)) throw new Error('Saved-squad endpoint failed');
          if ((squads.available_squads || []).some((row) => /4812/.test(String(row.plan_name)))) throw new Error('Hard-coded Team 4812 is still exposed');
          if (squads.selected_squad) {
            for (const key of ['starting_xpts','captain_bonus','transfer_hit','net_xpts']) {
              if (!Number.isFinite(Number(squads.selected_squad[key]))) throw new Error(`Saved squad lacks numeric ${key}`);
            }
          }

          const simulation = JSON.parse(fs.readFileSync('/tmp/sim.json', 'utf8'));
          if (simulation.selected_squad && simulation.selected_squad.simulation) {
            if (simulation.selected_squad.simulation.chip !== 'benchboost' || simulation.selected_squad.simulation.persisted !== false) {
              throw new Error('Bench Boost simulation contract failed');
            }
          }

          const fixtures = JSON.parse(fs.readFileSync('/tmp/fixtures.json', 'utf8'));
          if (!fixtures.ok || !fixtures.fixtures?.length) throw new Error('Fixture endpoint failed');
          const fixture = fixtures.fixtures[0];
          for (const key of ['home_team_difficulty','away_team_difficulty','home_team_attack_difficulty','away_team_attack_difficulty','home_team_defence_difficulty','away_team_defence_difficulty']) {
            if (!Number.isFinite(Number(fixture[key]))) throw new Error(`Fixture lacks numeric ${key}`);
          }
          console.log(`Live verification passed at ${new Date().toISOString()}`);
          NODE

          gw9_code="$(curl -sS -o /tmp/gw9.json -w '%{http_code}' "${auth[@]}" "$base/api/brief?view=xpts&gw_from=9&gw_to=9")"
          test "$gw9_code" = "400"

      - name: Final summary
        shell: bash
        run: |
          echo "Published commit: $DEPLOY_SHA"
          echo "Rollback branch: $BACKUP_BRANCH"
          echo "Rollback tag: $BACKUP_TAG"
