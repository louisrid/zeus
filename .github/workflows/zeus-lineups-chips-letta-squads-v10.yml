name: Verify ZEUS Lineups, Chips and Letta Squads V10
run-name: ZEUS lineups, chips and saved squads V10 verification · ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zeus-lineups-chips-saved-squads-v10
  cancel-in-progress: false

jobs:
  test-build-live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record the published source
        shell: bash
        run: |
          set -euo pipefail
          echo "VERIFY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify the committed ZEUS feature source
        shell: bash
        run: |
          set -euo pipefail
          test -f config/lineups.json
          test -f lib/server/lineups-config.generated.mjs
          test -f lib/server/lineup-gate.mjs
          test -f lib/squad-projection.mjs
          test -f lib/server/squad-brief.mjs
          test -f components/ChipControls.jsx
          test -f components/ProjectedScoreBreakdown.jsx
          test -f docs/LETTA_SAVED_SQUADS_TOOL.md
          test -f scripts/sync-lineups-config.mjs
          test -f tests/lineup-chips-squads.test.mjs

          grep -Fq '"sync:lineups": "node scripts/sync-lineups-config.mjs"' package.json
          grep -Fq '"prebuild": "npm run sync:lineups"' package.json
          grep -Fq 'buildSavedSquadsPayload' app/api/brief/route.js
          grep -Fq 'simulate_chip' app/api/brief/route.js
          grep -Fq 'raw_imported_xpts' lib/server/fpl_brief_api.mjs
          grep -Fq 'captainMultiplier' components/BuilderPitch.jsx
          grep -Fq 'ChipControls' app/builder/BuilderClient.jsx
          grep -Fq 'ChipControls' app/squad/SquadClient.jsx

          node --input-type=module <<'NODE'
          const { lineups } = await import('./lib/server/lineups-config.generated.mjs');
          if (!lineups || !Array.isArray(lineups.clubs) || lineups.clubs.length !== 20) {
            throw new Error('Generated line-up snapshot does not contain all 20 clubs');
          }
          const dated = [];
          const visit = (value, path = 'lineups') => {
            if (Array.isArray(value)) {
              value.forEach((item, index) => visit(item, `${path}[${index}]`));
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (key === 'updated') dated.push(`${path}.${key}`);
              visit(child, `${path}.${key}`);
            }
          };
          visit(lineups);
          if (dated.length) throw new Error(`Generated snapshot still contains metadata dates: ${dated.join(', ')}`);
          NODE

      - name: Install dependencies without changing repository files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci
          else
            npm install --package-lock=false
          fi

      - name: Run focused feature and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/external-xpts.test.mjs \
            tests/lineup-chips-squads.test.mjs \
            tests/data.test.mjs \
            tests/fixture-api-difficulty.test.mjs \
            tests/fixture-outlook.test.mjs \
            tests/plan.test.mjs \
            tests/guards.test.mjs \
            tests/render.test.mjs \
            tests/design-system.test.mjs

      - name: Run the complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee /tmp/zeus-full-suite.log
          grep -Fq '# fail 0' /tmp/zeus-full-suite.log
          grep -Fq '# skipped 22' /tmp/zeus-full-suite.log
          grep -Fq '# cancelled 0' /tmp/zeus-full-suite.log

      - name: Build the production application
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code

      - name: Wait for Vercel and verify the live deployment
        shell: bash
        env:
          ZEUS_BASE_URL: ${{ vars.ZEUS_BASE_URL }}
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY }}
        run: |
          set -euo pipefail
          base="${ZEUS_BASE_URL:-https://zeus-teal.vercel.app}"
          base="${base%/}"
          auth=()
          if [ -n "${ZEUS_API_KEY:-}" ]; then auth=(-H "x-api-key: $ZEUS_API_KEY"); fi

          xpts_url="$base/api/brief?view=xpts&format=json&gw_from=1&gw_to=1&limit=5000&offset=0"
          squads_url="$base/api/brief?view=squads&format=json&gw=1&include_players=false"
          simulation_url="$base/api/brief?view=squads&format=json&gw=1&plan=active&simulate_chip=benchboost&include_players=false"
          fixtures_url="$base/api/brief?view=fixtures&format=json&team=MCI&gw_from=1&gw_to=8"
          gw9_url="$base/api/brief?view=xpts&format=json&gw_from=9&gw_to=9"

          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /tmp/live-xpts.json -w '%{http_code}' "${auth[@]}" "$xpts_url" || true)"
            if [ "$code" = "200" ] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('/tmp/live-xpts.json', 'utf8'));
          if (!body.ok || !body.lineup_gate?.active) process.exit(1);
          if (body.lineup_gate.source_slots !== 220 || body.lineup_gate.resolution_coverage < 0.9) process.exit(1);
          if (!Array.isArray(body.projections) || !body.projections.some((row) => Object.hasOwn(row, 'raw_imported_xpts'))) process.exit(1);
          NODE
            then
              ready=1
              break
            fi
            echo "Waiting for the verified Vercel deployment ($attempt/60)..."
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo 'The JSON xPTS endpoint did not become verifiably live within 10 minutes.'
            echo 'Last HTTP response:'
            cat /tmp/live-xpts.json 2>/dev/null || true
            exit 1
          fi

          for route in / /players /builder /squad; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$base$route")"
            test "$code" = "200"
          done

          curl -sS "${auth[@]}" "$xpts_url" > /tmp/xpts.json
          curl -sS "${auth[@]}" "$squads_url" > /tmp/squads.json
          curl -sS "${auth[@]}" "$simulation_url" > /tmp/sim.json
          curl -sS "${auth[@]}" "$fixtures_url" > /tmp/fixtures.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const xpts = JSON.parse(fs.readFileSync('/tmp/xpts.json', 'utf8'));
          const rows = xpts.projections || [];
          const starters = rows.filter((row) => row.predicted_start === true);
          const nonStarters = rows.filter((row) => row.predicted_start === false);
          if (xpts.lineup_gate.source_slots !== 220 || xpts.lineup_gate.resolution_coverage < 0.9) {
            throw new Error(`Live line-up coverage is incomplete: ${JSON.stringify(xpts.lineup_gate)}`);
          }
          if (starters.length !== xpts.lineup_gate.predicted_starters) {
            throw new Error(`Live API starter count ${starters.length} disagrees with its gate report`);
          }
          if (!nonStarters.length) throw new Error('Live API returned no non-starters');
          if (starters.some((row) => row.start_probability !== 1)) throw new Error('A predicted starter is not 1.0');
          if (nonStarters.some((row) => row.start_probability !== 0 || row.xpts !== 0)) {
            throw new Error('A non-starter is not fully zero-gated');
          }
          const haaland = rows.find((row) => row.name === 'Haaland');
          if (!haaland || haaland.xpts !== 7.5 || haaland.raw_imported_xpts !== 7.5) {
            throw new Error('Haaland GW1 calibration changed');
          }

          const squads = JSON.parse(fs.readFileSync('/tmp/squads.json', 'utf8'));
          if (!squads.ok || squads.view !== 'squads' || !Number.isInteger(squads.saved_squad_count)) {
            throw new Error('Saved-squad endpoint failed');
          }
          if ((squads.available_squads || []).some((row) => /4812/.test(String(row.plan_name)))) {
            throw new Error('Hard-coded Team 4812 is still exposed');
          }
          if (squads.selected_squad) {
            for (const key of ['starting_xpts', 'captain_bonus', 'transfer_hit', 'net_xpts']) {
              if (!Number.isFinite(Number(squads.selected_squad[key]))) {
                throw new Error(`Saved squad lacks numeric ${key}`);
              }
            }
          }

          const simulation = JSON.parse(fs.readFileSync('/tmp/sim.json', 'utf8'));
          if (simulation.selected_squad?.simulation) {
            if (simulation.selected_squad.simulation.chip !== 'benchboost'
              || simulation.selected_squad.simulation.persisted !== false) {
              throw new Error('Bench Boost simulation contract failed');
            }
          }

          const fixtures = JSON.parse(fs.readFileSync('/tmp/fixtures.json', 'utf8'));
          if (!fixtures.ok || !fixtures.fixtures?.length) throw new Error('Fixture endpoint failed');
          const fixture = fixtures.fixtures[0];
          for (const key of [
            'home_team_difficulty',
            'away_team_difficulty',
            'home_team_attack_difficulty',
            'away_team_attack_difficulty',
            'home_team_defence_difficulty',
            'away_team_defence_difficulty',
          ]) {
            if (!Number.isFinite(Number(fixture[key]))) throw new Error(`Fixture lacks numeric ${key}`);
          }

          console.log(`Live verification passed at ${new Date().toISOString()}`);
          NODE

          gw9_code="$(curl -sS -o /tmp/gw9.json -w '%{http_code}' "${auth[@]}" "$gw9_url")"
          test "$gw9_code" = "400"

      - name: Final summary
        shell: bash
        run: |
          echo "Verified published commit: $VERIFY_SHA"
          echo "All tests, production build, pages and JSON API contracts passed."
