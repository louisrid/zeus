# FPLBot data update on GitLab: the same six steps as the GitHub update-all workflow, one job each so the
# dashboard can show which step is running. Runs on the schedules set in GitLab (07:00 and 19:00 UK, plus
# a retry at :45) and when the UPDATE DATA button starts it. Never on an ordinary push.
#
# GitLab settings this needs (Settings > CI/CD > Variables, all "Masked"):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY   from Vercel's environment variables
#   GITLAB_PUSH_TOKEN                    a project access token with write_repository, to publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - when: never

default:
  image: node:22
  interruptible: false

variables:
  GIT_DEPTH: "50"
  DATA_FILES: "config/external-xpts-2026-27.mjs config/blend-xpts-2026-27.mjs tests/fpl-players.json config/defcon-live-2026-27.mjs config/fdr-2026-27.mjs config/season-actuals-2026-27.mjs config/lineups.json config/defences.json lib/server/lineups-config.generated.mjs"

stages: [prices, team, projections, lineups, check, publish]

.setup: &setup
  before_script:
    - if [ -f .skip ]; then echo "Data was just published; nothing to do in this slot."; exit 0; fi
    - npm config set fetch-retries 5
    - if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/]
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - config/
      - tests/fpl-players.json
      - lib/server/lineups-config.generated.mjs
      - .skip

"Prices, points and injury flags":
  stage: prices
  <<: *setup
  script:
    # The retry slot (:45) stops at once if the update already landed in the last 90 minutes.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        LAST=$(git log -1 --format=%ct -- config/external-xpts-2026-27.mjs config/lineups.json || true)
        NOW=$(date +%s)
        if [ -n "$LAST" ] && [ $((NOW - LAST)) -lt 3000 ]; then touch .skip; echo "Updated under 50 minutes ago; skipping this slot."; exit 0; fi
      fi
    - node jobs/fpl_bootstrap.mjs

"My team, bank and selling prices":
  stage: team
  <<: *setup
  needs: ["Prices, points and injury flags"]
  allow_failure: true
  script:
    - node jobs/entry_money_pull.mjs

"Projections, defensive rates and fixture difficulty":
  stage: projections
  <<: *setup
  needs: ["Prices, points and injury flags"]
  script:
    - node jobs/external_xpts_pull.mjs
    # The mean of Sideline Quant, FPL GO and Copilot, built on the Copilot file just written. A source that
    # cannot be read is left out of the mean; this line never stops the update.
    - node jobs/blend_xpts_pull.mjs || echo "The mean of three could not be rebuilt this time; the last one stays."

"Predicted line-ups":
  stage: lineups
  <<: *setup
  needs: ["Projections, defensive rates and fixture difficulty"]
  script:
    - node jobs/scout_lineups_pull.mjs
    - npm run sync:lineups

"Check the refreshed data":
  stage: check
  <<: *setup
  needs: ["Predicted line-ups"]
  allow_failure: true
  timeout: 3 minutes
  script:
    # Defences (Sports Mole) is read here rather than as a step of its own; a failure never blocks the update.
    - node jobs/defences_pull.mjs || echo "Defences could not be read this time; the last table stays."
    - npm run test:data

"Publish the update":
  stage: publish
  <<: *setup
  needs: ["Predicted line-ups", "Check the refreshed data"]
  script:
    - |
      set -e
      if git diff --quiet -- $DATA_FILES; then echo "Nothing changed. Everything was already current."; exit 0; fi
      git config user.name "fplbot-update"
      git config user.email "update@fplbot.local"
      git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git checkout -B "$CI_DEFAULT_BRANCH"
      git add $DATA_FILES
      COUNT=$(node -e "import('./config/external-xpts-2026-27.mjs').then(m=>console.log(m.default.player_count))")
      git commit -m "data update: $COUNT players"
      for attempt in 1 2 3; do
        # This run's data is the newest, so if a commit made meanwhile touched the same data files, this
        # run's version wins (-X theirs keeps the commit being replayed). A failed rebase is aborted before
        # the next try, so one conflict cannot wedge every retry.
        git pull --rebase --autostash -X theirs origin "$CI_DEFAULT_BRANCH" && git push origin "$CI_DEFAULT_BRANCH" && { echo "Published on attempt $attempt."; exit 0; }
        git rebase --abort 2>/dev/null || true
        echo "Push rejected on attempt $attempt; retrying."; sleep 5
      done
      echo "Could not publish after three attempts."; exit 1
