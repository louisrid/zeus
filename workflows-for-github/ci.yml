name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Catches partial uploads, mismatched file generations and broken code before Vercel deploys.
      - run: npm install
      - name: Tests
        run: npm test
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
